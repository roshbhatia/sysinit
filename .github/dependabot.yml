version: 2

updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    ignore:
      - dependency-name: "orc"
      - dependency-name: "orc-extras"
      - dependency-name: "ask"
      - dependency-name: "ask-extras"
      - dependency-name: "changes"
      - dependency-name: "gate"
      - dependency-name: "citelock"
      - dependency-name: "tether"
      - dependency-name: "seshy"
      - dependency-name: "roster"
      - dependency-name: "traces"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
