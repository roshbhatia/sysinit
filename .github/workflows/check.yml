name: Check

# Runs `nix flake check` and builds the daily-driver host configuration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded PR runs, never main runs.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only.
permissions:
  contents: read

jobs:
  verify:
    # macos-latest is aarch64-darwin, the platform the daily-driver host targets.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix fmt -- --check` is not reachable from `nix flake check`.
      - name: nix fmt -- --check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix fmt -- --check

      # Before `nix flake check`, so a lint failure is not masked by an
      # evaluation failure. `hack/lint.sh` is the same list `.githooks/pre-commit`
      # runs, over the whole tree rather than the staged paths.
      - name: Lint
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix develop --command bash hack/lint.sh --all

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs

      - name: Evaluate all configurations
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix eval --json .#lib.configurationDerivations

  # `nix flake check` skips the systems a runner cannot build, so the macOS job
  # never reaches checks.x86_64-linux. The Linux bodies, cua-computer-server
  # among them, had never run anywhere.
  verify-linux:
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs
