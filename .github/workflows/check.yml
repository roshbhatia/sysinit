name: Check

# Runs `nix flake check` and builds the daily-driver host configuration.
#
# Deliberately has NO path filter. `build-cache` filters on flake.lock, flake.nix,
# overlays, _sources, and nvfetcher.toml, which means a change under modules/ was
# never built by CI at all. That is exactly the gap this job closes, so filtering
# here would reproduce it.
#
# The Darwin work is one job, several steps rather than several jobs: the host
# evaluation reuses the store the check step already populated, so the
# substitutions are paid once. `baseline-linux` is a separate job because it
# needs a different runner, not because it wants a fresh store.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded PR runs, never main runs. On a pull request only the tip
# matters, so cancelling saves runner time. On main every commit is a candidate
# for `git bisect` and for the required-check history, and cancelling means a
# run of pushes leaves most commits unverified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. This job runs PR-authored Nix (`runCommand` bodies evaluate and
# build), so it must not carry a writable token.
#
# Caveat worth knowing: a fork PR can rewrite this file into an empty job still
# named `verify` and satisfy the required status check. The required check alone
# does not make a fork PR safe to merge; read the diff. Dependabot is unaffected,
# because its branches live in this repo, not a fork.
permissions:
  contents: read

jobs:
  verify:
    # macos-latest is aarch64-darwin, the platform the daily-driver host targets.
    # `nix flake check` builds only the current system's checks, so running on
    # Darwin covers the checks as the owner experiences them.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # Same gate as build-cache: a pull request from a fork has no secret, so
      # read from the cache without pushing rather than failing the job.
      - name: Detect Cachix token
        id: cachix
        run: |
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CACHIX_AUTH_TOKEN not set — reading cache without pushing."
          fi

      - uses: cachix/cachix-action@v17
        if: steps.cachix.outputs.enabled == 'true'
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix fmt -- --check` is not reachable from `nix flake check`, so without
      # this step the formatter's check mode existed and was documented while
      # drift still shipped green. The `--` is mandatory: `nix fmt --check`
      # errors before the formatter runs.
      - name: nix fmt -- --check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix fmt -- --check

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs

      # Evaluation-time assertions (the cross-layer keybinding chord check, the
      # home-manager module assertions) do not fire under `nix flake check`,
      # which reports the host configuration as "build skipped".
      #
      # Evaluate rather than build. The lv426 system closure is 17.9 GiB and a
      # macos-latest runner has roughly 14 GB free, so `nix build` of it fails on
      # disk before it can fail on anything useful. Forcing `.drvPath` evaluates
      # the whole module tree, which is what fires the assertions, and takes about
      # 10 seconds while materialising nothing. Verified by injecting a failing
      # assertion: the eval aborts with its message.
      - name: Evaluate host configuration (lv426)
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix eval --raw ".#darwinConfigurations.lv426.system.drvPath"

  # The arrakis half of the closure gates for the `make-sysinit-composable`
  # change. arrakis is x86_64-linux and its module set imports from a
  # derivation, so it cannot evaluate on the Darwin runner above at all.
  #
  # Evaluates, never builds. `hack/host-baseline.sh` enumerates the derivation
  # graph rather than realizing the closure, so this fits a runner that could
  # not hold one host system closure, let alone two.
  #
  # Unlike build-cache.yml's Cachix step, nothing here is gated on a secret.
  # A gate that reports green when a precondition is missing is worse than no
  # gate, and this one is read less often than a local check.
  baseline-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Record the arrakis baseline
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: ./hack/host-baseline.sh arrakis "${RUNNER_TEMP}/baseline"

      # Fail rather than skip when the committed baseline is absent. The first
      # run has nothing to compare against by construction, because only this
      # job can produce the arrakis side; it fails and names the artifact to
      # commit, which is the bootstrap rather than an error.
      - name: Compare against the committed baseline
        run: |
          committed="openspec/changes/make-sysinit-composable/baseline"
          if [ ! -f "${committed}/arrakis.drvset" ]; then
            echo "::error::No committed arrakis baseline. Download the artifact from this run and commit it to ${committed}/."
            exit 1
          fi
          diff -u "${committed}/arrakis.drvpath" "${RUNNER_TEMP}/baseline/arrakis.drvpath"
          diff -u "${committed}/arrakis.drvset" "${RUNNER_TEMP}/baseline/arrakis.drvset"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrakis-baseline
          path: ${{ runner.temp }}/baseline/
