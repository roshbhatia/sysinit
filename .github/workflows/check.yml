name: Check

# Runs `nix flake check` and builds the daily-driver host configuration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded PR runs, never main runs.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only.
permissions:
  contents: read

jobs:
  verify:
    # macos-latest is aarch64-darwin, the platform the daily-driver host targets.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # Same gate as build-cache: a pull request from a fork has no secret, so read from
      # the cache without pushing rather than failing the job.
      - name: Detect Cachix token
        id: cachix
        run: |
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CACHIX_AUTH_TOKEN not set; reading cache without pushing."
          fi

      - uses: cachix/cachix-action@v17
        if: steps.cachix.outputs.enabled == 'true'
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix fmt -- --check` is not reachable from `nix flake check`.
      - name: nix fmt -- --check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix fmt -- --check

      # Before `nix flake check`, so a lint failure is not masked by an
      # evaluation failure. `hack/lint.sh` is the same list `.githooks/pre-commit`
      # runs, over the whole tree rather than the staged paths.
      - name: Lint
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix develop --command bash hack/lint.sh --all

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs

      # Evaluate every host because the current runner cannot build Linux outputs.
      - name: Evaluate host configurations
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix eval --raw ".#darwinConfigurations.lv426.system.drvPath"
          nix eval --raw ".#nixosConfigurations.arrakis.config.system.build.toplevel.drvPath"

      - name: Evaluate standalone home configurations
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          for profile in dev minimal; do
            for system in aarch64-darwin x86_64-linux aarch64-linux; do
              nix eval --raw ".#homeConfigurations.${profile}-${system}.activationPackage.drvPath"
            done
          done
