name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-darwin:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'
        with:
          extra-conf: |
            fallback = true

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix fmt -- --check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix fmt -- --check

      - name: Lint
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix develop --command bash hack/lint.sh --all

      - name: Release policy tests
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix develop .#release --command node --test checks/releases.mjs checks/release-publishing.mjs

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs

      - name: Codex MCP discovery in the macOS user session
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          codex_path=$(nix build --no-link --print-out-paths .#darwinConfigurations.lv426.pkgs.codex)
          nix develop --command python3 checks/codex-mcp-capabilities.py "$codex_path/bin/codex"

  verify-linux:
    runs-on: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check --print-build-logs

  evaluate:
    strategy:
      fail-fast: false
      matrix:
        system: [aarch64-darwin, x86_64-linux, aarch64-linux]
    runs-on: ${{ matrix.system == 'aarch64-darwin' && 'macos-latest' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || 'ubuntu-latest') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'
      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate platform configurations
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
          SYSTEM: ${{ matrix.system }}
        run: nix eval --json ".#lib.configurationDerivations.$SYSTEM"

  verify:
    if: ${{ always() }}
    needs: [verify-darwin, verify-linux, evaluate]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<< "$RESULTS"

  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            fallback = true
      - name: Publish semantic version and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix develop .#release --command semantic-release
