name: Maintain dependency PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.user.login == 'dependabot[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'dependabot/')) ||
       (contains(fromJSON('["roshbhatia", "github-actions[bot]"]'), github.event.pull_request.user.login) &&
        github.event.pull_request.head.ref == 'automation/update-sources'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Fix formatting and Go vendor hashes
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(flake\.(nix|lock)|_sources/|overlays/)'; then
            ./hack/update-vendor-hash.sh
          fi
          nix fmt
      - name: Publish fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m 'chore(deps): fix formatting and vendor hashes'
          git push origin "HEAD:$HEAD_REF"

  auto-merge:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - name: Queue dependency PR for auto-merge
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash
