name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Squash + delete branch, queued behind the required checks.
      - name: Merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          echo "Queuing Dependabot PR #${pr} for auto-merge"
          gh pr merge "${pr}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --delete-branch
