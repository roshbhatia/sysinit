name: Arrakis runner

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, arrakis, nix]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner and tailnet
        run: |
          test "$(hostname)" = arrakis
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = x86_64-linux
          tailscale status --json | jq -e '.BackendState == "Running" and .Self.Online'
      - name: Build through the Nix daemon
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.github-runner-guard
