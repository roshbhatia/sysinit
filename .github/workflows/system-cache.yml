name: System cache

on:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "overlays/**"
      - "pkgs/**"
      - "_sources/**"
      - "modules/**"
      - "hosts/**"
      - ".github/workflows/system-cache.yml"
      - ".github/actions/cachix/**"
      - ".github/actions/cache-build/**"
  workflow_dispatch: {}

concurrency:
  group: system-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
            installable: darwinConfigurations.lv426.system
          - os: ubuntu-latest
            system: x86_64-linux
            installable: nixosConfigurations.arrakis.config.system.build.toplevel
    runs-on: ${{ matrix.system == 'x86_64-linux' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        if: runner.environment != 'self-hosted'
      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build system
        uses: ./.github/actions/cache-build
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          installables: .#${{ matrix.installable }}
