name: System cache

on:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "overlays/**"
      - "pkgs/**"
      - "_sources/**"
      - "modules/**"
      - "hosts/**"
      - ".github/workflows/system-cache.yml"
      - ".github/actions/cachix/**"
  workflow_dispatch: {}

concurrency:
  group: system-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
            installable: darwinConfigurations.lv426.system
          - os: ubuntu-latest
            system: x86_64-linux
            installable: nixosConfigurations.arrakis.config.system.build.toplevel
    runs-on: ${{ matrix.system == 'x86_64-linux' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'
      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build system
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          INSTALLABLE: ${{ matrix.installable }}
        run: |
          cache=()
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            cache=(cachix watch-exec --watch-mode post-build-hook roshbhatia)
          fi
          "${cache[@]}" nix build --out-link result --print-build-logs --keep-going ".#$INSTALLABLE"
      - name: Publish existing system output
        if: always() && runner.environment == 'self-hosted'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -e result ]; then
            nix path-info --recursive result | cachix push roshbhatia
          fi
