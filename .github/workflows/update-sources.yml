name: Update sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update nvfetcher sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix run nixpkgs#nvfetcher -- -c nvfetcher.toml -o _sources --keep-going

      - name: Update flake inputs
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix flake update

      - name: Update Go vendorHash values
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          ./hack/update-vendor-hash.sh

      - name: Update openspec
        run: |
          ./hack/update-openspec.sh

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT when available: a PR opened by GITHUB_TOKEN does not trigger
          # `on: pull_request`, so the required `verify` check would never run.
          token: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/update-sources
          delete-branch: true
          title: "chore: update nvfetcher sources and flake inputs"
          commit-message: "chore: update nvfetcher sources and flake inputs"
          body: |
            Automated update:
            - Regenerated `_sources/generated.nix` via nvfetcher
            - Updated `flake.lock` via `nix flake update`
            - Auto-updated Go `vendorHash` values
          labels: automated,dependencies

      # Queue the automation PR behind the required checks.
      - name: Merge automation PR
        if: steps.cpr.outputs.pull-request-operation != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          if [ -z "${pr}" ]; then
            echo "No PR number from create-pull-request step; nothing to merge."
            exit 0
          fi
          if [ -z "${{ secrets.WORKFLOWS_PAT }}" ]; then
            echo "::notice::WORKFLOWS_PAT unset, so the PR was opened by GITHUB_TOKEN"
            echo "::notice::and the check workflow will not run on it. Leaving PR #${pr} open."
            exit 0
          fi
          echo "Queuing PR #${pr} for auto-merge (operation: ${{ steps.cpr.outputs.pull-request-operation }})"
          gh pr merge "${pr}" --auto --squash --delete-branch
