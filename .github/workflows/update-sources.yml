name: Update sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sources
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  pending-update:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.pending.outputs.count }}
    steps:
      - name: Preserve the open update PR
        id: pending
        run: |
          count="$(gh pr list --repo "${{ github.repository }}" --head automation/update-sources --state open --json number --jq length)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

  update:
    needs: pending-update
    if: needs.pending-update.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update nvfetcher sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          nvfetcher_keyfile="$(mktemp)"
          trap 'rm -f "${nvfetcher_keyfile}"' EXIT
          printf '[keys]\ngithub = "%s"\n' "${GITHUB_TOKEN}" > "${nvfetcher_keyfile}"
          nix run nixpkgs#nvfetcher -- -k "${nvfetcher_keyfile}" -c nvfetcher.toml -o _sources
          nix develop --command nu --no-config-file hack/update-pi-types.nu

      - name: Update flake inputs
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix develop --command nu --no-config-file hack/test-update-flakes.nu \
            "$GITHUB_WORKSPACE/hack/update-flakes.nu" \
            "$GITHUB_WORKSPACE/hack/fixtures/update-flakes-command.nu"
          nix develop --command nu --no-config-file "$GITHUB_WORKSPACE/hack/update-flakes.nu"

      - name: Update Go vendorHash values
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          ./hack/update-vendor-hash.sh

      - name: Format and validate generated sources
        run: |
          nix fmt
          nix build --no-link .#checks.x86_64-linux.nvfetcher-sources

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/update-sources
          delete-branch: true
          title: "chore: update nvfetcher sources and flake inputs"
          commit-message: "chore: update nvfetcher sources and flake inputs"
          body: |
            Automated update:
            - Regenerated `_sources/generated.nix` via nvfetcher
            - Synchronized Pi extension type dependencies with the Pi release
            - Updated flake inputs via `nix develop --command nu --no-config-file hack/update-flakes.nu`
            - Auto-updated Go `vendorHash` values
          labels: automated,dependencies

      - name: Merge automation PR
        if: steps.cpr.outputs.pull-request-operation != ''
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pr="${{ steps.cpr.outputs.pull-request-number }}"
          if [ -z "${pr}" ]; then
            echo "No PR number from create-pull-request step; nothing to merge."
            exit 0
          fi
          if [ -z "${{ secrets.WORKFLOWS_PAT }}" ]; then
            echo "::notice::WORKFLOWS_PAT unset, so the PR was opened by GITHUB_TOKEN"
            echo "::notice::and the check workflow will not run on it. Leaving PR #${pr} open."
            exit 0
          fi
          echo "Queuing PR #${pr} for auto-merge (operation: ${{ steps.cpr.outputs.pull-request-operation }})"
          gh pr merge "${pr}" --auto --squash --delete-branch
