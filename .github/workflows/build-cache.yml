name: Build cache

# Builds every custom package for each supported system.

on:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "overlays/**"
      - "pkgs/**"
      - "_sources/**"
      - "nvfetcher.toml"
  workflow_dispatch: {}

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux runners lack space for the full custom-package closure.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@v22

      # Missing secrets disable uploads while preserving build verification.
      - name: Detect Cachix token
        id: cachix
        run: |
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CACHIX_AUTH_TOKEN not set; building without pushing."
          fi

      - uses: cachix/cachix-action@v17
        if: steps.cachix.outputs.enabled == 'true'
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build cache bundle (${{ matrix.system }})
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix build --print-build-logs ".#packages.${{ matrix.system }}.cacheBundle"
