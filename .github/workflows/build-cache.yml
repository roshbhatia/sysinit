name: Build cache

# Builds every custom package for each supported system.

on:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"
      - "lib/**"
      - "overlays/**"
      - "pkgs/**"
      - "_sources/**"
      - "nvfetcher.toml"
  workflow_dispatch: {}

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.system == 'x86_64-linux' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Linux runners lack space for the full custom-package closure.
      - name: Free disk space
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@v22
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build cache bundle (${{ matrix.system }})
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          # inputDerivation realises the dev shell dependencies. The shell
          # derivation itself refuses to build, so `nix build` cannot cache it.
          nix build --print-build-logs --keep-going --out-link result \
            ".#packages.${{ matrix.system }}.cacheBundle" \
            ".#packages.${{ matrix.system }}.cloudTools" \
            ".#devShells.${{ matrix.system }}.default.inputDerivation"

      # The daily-driver closure. Without this the laptop builds locally
      # whatever cache.nixos.org does not serve.
      - name: Build lv426 system closure
        if: matrix.system == 'aarch64-darwin'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix build --no-link --print-build-logs --keep-going ".#darwinConfigurations.lv426.system"

      - name: Build Arrakis system closure
        if: matrix.system == 'x86_64-linux'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix build --out-link result-arrakis --print-build-logs --keep-going ".#nixosConfigurations.arrakis.config.system.build.toplevel"

      - name: Publish Arrakis outputs
        if: runner.environment == 'self-hosted'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix path-info --recursive ./result* | cachix push roshbhatia
