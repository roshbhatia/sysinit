name: Build cache

# Builds the custom-package bundle (packages.<system>.cacheBundle) on each
# platform and pushes anything not already on cache.nixos.org to Cachix. The
# cachix-action post-build-hook only uploads paths built during the job, so the
# nixpkgs deps these packages pull are fetched (not re-uploaded) and the cache
# stays small — well within the free OSS tier.

on:
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "flake.nix"
      - "overlays/**"
      - "_sources/**"
      - "nvfetcher.toml"
  workflow_dispatch: {}

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            system: aarch64-darwin
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ubuntu runners ship with ~14GB free on /; building the whole custom
      # bundle from source overflows the Nix store. Reclaim the preinstalled
      # toolchains we don't use (~25GB) before building.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: DeterminateSystems/nix-installer-action@v22

      # Gate the push on the secret so the job still builds (green) before the
      # Cachix cache/token is set up, and on forks that lack the secret.
      - name: Detect Cachix token
        id: cachix
        run: |
          if [ -n "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CACHIX_AUTH_TOKEN not set — building without pushing."
          fi

      - uses: cachix/cachix-action@v15
        if: steps.cachix.outputs.enabled == 'true'
        with:
          name: roshbhatia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build cache bundle (${{ matrix.system }})
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix build --print-build-logs ".#packages.${{ matrix.system }}.cacheBundle"
