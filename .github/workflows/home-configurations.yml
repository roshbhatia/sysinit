name: Home configurations

# Builds every standalone home configuration: profile crossed with system.

on:
  # Weekly, not per push. The 6 builds below are the only source of these
  # closures in the cache, and a fresh box with no Nix builds them from source.
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch: {}

concurrency:
  group: home-configurations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every cell of profile crossed with system, not a sample of one.
  home:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - dev
          - minimal
        system:
          - aarch64-darwin
          - x86_64-linux
          - aarch64-linux
        # Each entry names a `system` that the cross above already produces, so
        include:
          - system: aarch64-darwin
            os: macos-latest
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.system == 'x86_64-linux' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.profile }}-${{ matrix.system }}
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix build --out-link result -L \
            ".#homeConfigurations.${{ matrix.profile }}-${{ matrix.system }}.activationPackage"

      - name: Publish Arrakis outputs
        if: runner.environment == 'self-hosted'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix path-info --recursive ./result | cachix push roshbhatia
