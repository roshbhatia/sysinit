name: Home configurations

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch: {}

concurrency:
  group: home-configurations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: targets
        name: Read standalone Home Manager targets
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          targets=$(nix eval --json .#lib.homeConfigurationTargets)
          matrix=$(jq -c '
            {
              "aarch64-darwin": "macos-latest",
              "x86_64-linux": "ubuntu-latest",
              "aarch64-linux": "ubuntu-24.04-arm"
            } as $runners |
            {include: [
              to_entries[] |
              .key as $system |
              .value[] |
              {
                target: .,
                system: $system,
                os: ($runners[$system] // error("Missing runner for " + $system))
              }
            ]}
          ' <<< "$targets")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  home:
    needs: inventory
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ${{ matrix.system == 'x86_64-linux' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "Linux", "X64", "arrakis", "nix"]') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.environment != 'self-hosted'

      - uses: ./.github/actions/cachix
        with:
          auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.target }}
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix build --out-link result -L \
            ".#homeConfigurations.${{ matrix.target }}.activationPackage"

      - name: Publish Arrakis outputs
        if: runner.environment == 'self-hosted'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix path-info --recursive ./result | cachix push roshbhatia
