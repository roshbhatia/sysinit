name: Home configurations

# Builds every standalone home configuration: profile crossed with system.

on:
  workflow_dispatch: {}

concurrency:
  group: home-configurations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every cell of profile crossed with system, not a sample of one.
  home:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - dev
          - minimal
        system:
          - aarch64-darwin
          - x86_64-linux
          - aarch64-linux
        # Each entry names a `system` that the cross above already produces, so
        include:
          - system: aarch64-darwin
            os: macos-latest
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build ${{ matrix.profile }}-${{ matrix.system }}
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.WORKFLOWS_PAT || secrets.GITHUB_TOKEN }}"
        run: |
          nix build --no-link -L \
            ".#homeConfigurations.${{ matrix.profile }}-${{ matrix.system }}.activationPackage"
