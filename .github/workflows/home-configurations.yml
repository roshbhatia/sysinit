name: Home configurations

# Builds every standalone home configuration: profile crossed with system.
#
# Deliberately NOT a required check and deliberately NOT on push. The Linux
# cells build a second toolchain graph, which takes tens of minutes, and
# check.yml's `verify` job is required on main. Run it when the profile split,
# the module tiers, or the package lists move:
#
#   gh workflow run home-configurations.yml
#
# This file is what survives `.github/workflows/closure-baseline.yml`. That
# workflow's `baseline` job diffed against a path inside the
# `make-sysinit-composable` change directory and could not outlive its archive.
# The `home` job below never referenced that directory and gates something the
# repository keeps, so it stays.

on:
  workflow_dispatch: {}

concurrency:
  group: home-configurations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every cell of profile crossed with system, not a sample of one. Which
  # modules are imported depends on both, so a `values` leaf read only by a
  # `dev` module is invisible to a `minimal` build and a leaf read only by a
  # Darwin module is invisible to a Linux build.
  #
  # Six cells, split two and four rather than three and three: `cacheSystems`
  # holds one Darwin system and two Linux ones. The two Darwin cells also build
  # locally on the owner's machine; the four Linux cells cannot, because the pi
  # harness pulls an x86_64-linux derivation through IFD.
  home:
    strategy:
      fail-fast: false
      matrix:
        profile:
          - dev
          - minimal
        system:
          - aarch64-darwin
          - x86_64-linux
          - aarch64-linux
        # Each entry names a `system` that the cross above already produces, so
        # the runner is merged into those cells rather than added as jobs of its
        # own. An include that shared no key with the matrix would append
        # standalone jobs instead, which is the trap here.
        include:
          - system: aarch64-darwin
            os: macos-latest
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build ${{ matrix.profile }}-${{ matrix.system }}
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix build --no-link -L \
            ".#homeConfigurations.${{ matrix.profile }}-${{ matrix.system }}.activationPackage"
