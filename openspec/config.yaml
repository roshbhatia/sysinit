schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Nix-flakes config for macOS (Apple Silicon) and NixOS via nix-darwin + home-manager.
  Single-user dotfiles; the owner is the only contributor and the only approver.
  Harnesses configured here: claude-code, codex, pi, opencode, gemini, amp, goose.
  Applied with `nh darwin switch` from the sysinit.laurel checkout, never from here.
  Conventions: conventional commits (title-only, no body, one concern per commit),
  no emojis in code or generated files, scripts in hack/ use `set -euo pipefail`
  and shfmt -i 2 -ci -sr -s.
  Gates: `nix flake check` and `nix build .#darwinConfigurations.lv426.system`
  must exit 0, and `specutil check` must pass, before a change is applied.
  `openspec/specs/` is history, not authority: nothing is promoted to it.

# Per-artifact rules, appended to each artifact's own template instruction and
rules:
  proposal:
    - "State the defect as observed behaviour, not as a missing feature: \"X is not enforced, measured by Y\" beats \"we should add X\"."
    - "Put acceptance criteria in the Behavior section. Nothing is promoted to openspec/specs/, so a criterion recorded anywhere else is lost."
    - "Every external-factual claim (pricing, availability, third-party API behaviour, a cited document) needs a citelock entry. An unpinned claim is a default-reject, not a footnote."
    - "Non-goals are load-bearing. List what a reader would reasonably expect this change to cover and it deliberately does not."
  citations:
    - "The lock is required even when nothing is cited. Write {\"records\": []} rather than leaving the file out: an absent lock cannot distinguish \"nothing to cite\" from \"nobody looked\"."
    - "Every record id must be referenced in prose as [cite: <id>], and every [cite: <id>] must name a real record. spec-preflight citations decides both directions."
    - "Name a record for what it backs (rfd576-responsibility), never by number (claim-3). The id is the thing the prose cites."
    - "Never hand-edit citations.lock to make the gate pass. The snapshot and its sha256 are the evidence; editing around them leaves a lock that verifies and proves nothing."
  review:
    - "Write the Recommendation before running any critic, and name the concrete risk critique would catch or state there is none. The owner must decide against an argument, not a blank."
    - "Never write the Owner decision section. Not-run is the owner's call, and silence is not consent."
    - "openspec marks this artifact done when the file exists, not when the decision is made. A review.md with a pending decision is not a completed review; spec-preflight review is what says so."
    - "Append rounds, never regenerate the file. The surviving-objection trend is the only thing that separates converging from churning."
  design:
    - "Record the options rejected and why, not only the option taken. A design that lists one approach has not been designed."
    - "Name the mechanism rather than the intent - which file, which hook, which assertion. \"Nix owns it\" is not a mechanism."
    - "Call out anything that cannot be verified deterministically, and say who judges it instead."
  tasks:
    - "Every phase declares a SHAPE marker and contains an adversarial-review task."
    - "A task that changes behaviour is followed by the command that proves it. Prefer a flake check over a manual step, and say so when no check is possible."
    - "Use STOP for a gate the owner must judge, and Confirm or Decide for a judgement that is theirs rather than the agent's."
    - "Order by dependency with deps markers, not by narrative. A task with no dependency must be genuinely runnable first."
