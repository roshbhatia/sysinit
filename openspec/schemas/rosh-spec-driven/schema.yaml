name: rosh-spec-driven
version: 1
description: Rosh's opinionated OpenSpec workflow - proposal → specs → design → tasks, with extra authoring rules
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Non-goals**: When the change touches more than one capability, fill in a `### Non-goals` block under `## What Changes` listing the work explicitly NOT included. This rule is enforced by the rosh-spec-driven schema; omit only for trivially-scoped single-capability changes.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      **rosh-spec-driven rules** (apply before writing the proposal):

      1. **Reuse existing patterns.** Before drafting "What Changes", survey the repo for prior
         implementations of similar capabilities. Reference the closest existing module/file by
         path in the proposal and explicitly note what is being reused vs. introduced. If no
         existing pattern fits, state that explicitly. Inventing parallel infrastructure when an
         established pattern would work is a default-reject.
      2. **Plan for progressive rollout.** Every change MUST be shaped so it can land
         incrementally. Scope the proposal so each capability can be reviewed, built, and
         verified independently. Avoid all-or-nothing changes that flip many surfaces at once.
         If the change is genuinely atomic (cannot be split), say so in `Impact` and explain why.
      3. **Flag impactful actions up front.** In `Impact`, enumerate every action that mutates
         shared state, is hard to reverse, or requires user confirmation: `nh os switch`,
         `openspec archive`, `git push`, network writes, schema migrations, system config
         changes, vendored-content updates, removal of public surfaces. These become explicit
         human-verification checkpoints in `tasks.md`.
      4. **Note the gating signal.** If the change has a natural feature flag, kill switch,
         config toggle, or staged-rollout sequence, name it in `Impact` so design.md can build
         on it. For dotfiles work this is typically `nh os build` (verify) before
         `nh os switch` (apply).
      5. **Anchor external-factual claims.** If the change asserts external-factual claims
         (pricing, availability, external API behavior, cited papers), it MUST carry a
         `citations.lock` next to its artifacts that passes `citelock`, and each claim MUST have
         an anchored record (verbatim quote present in a tool-captured snapshot). An unanchored
         external-factual claim is a default-reject. A bare version identifier that a sha256 or
         lockfile pin already provides (nvfetcher `_sources`, `flake.lock`, `vendorHash`) is
         excluded; prose asserting a fact about that version's behavior or history is not.
      6. **Write in the CLAUDE.md communication standard (applies to EVERY artifact).**
         Write proposal, specs, design, and tasks in Simplified Technical English per
         the Communication section of `~/.claude/CLAUDE.md`: one instruction per
         sentence, active voice, one term per concept, no em-dashes in prose, and no
         bolded first term in a bullet outside the format keywords (`WHEN`, `THEN`,
         `AND`, `POLARITY`, `SHAPE`, `STOP`, `MAX-ITERS`, `BREAKING`). `specutil check`
         enforces the mechanical parts (em-dashes, disallowed bolded bullet leads);
         the rest is checked in review.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.
      - **rosh-spec-driven rule**: Every requirement MUST include at least one negative scenario describing what happens when an unexpected condition occurs (`WHEN <unexpected condition> THEN <error/rejection>`). Positive scenarios alone are insufficient.
      - **rosh-spec-driven rule**: Each scenario MUST declare its polarity on a body line, `- **POLARITY** positive` or `- **POLARITY** negative`, as the first bullet under the `#### Scenario:` heading. Keep the heading canonical (`#### Scenario: <name>`); do NOT put the marker in the heading, because openspec's archive parser matches `#### Scenario:` strictly and a heading marker makes archive silently drop the scenario. `specutil check` reads this declared marker rather than inferring polarity from prose, so the negative-scenario rule is checked against a stated fact.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      #### Scenario: Export with malformed data
      - **WHEN** user data contains values that violate the CSV schema
      - **THEN** the system rejects the export and reports the offending row

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders. **rosh-spec-driven rule**: name the existing patterns/files being extended or paralleled. Cite paths. If introducing a new pattern, justify why the closest existing one was insufficient.
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). **rosh-spec-driven rule**: Each entry under Decisions MUST list at least one alternative considered and the explicit reason it was rejected, on a line beginning `- Alternative rejected:` so `specutil check` can read it as a stated fact. A decision without a recorded rejected alternative is not a decision; it's an assumption.
      - **Rollout & Gating**: **rosh-spec-driven rule**: REQUIRED section. Describe the sequenced rollout — which phase ships first, what gate must pass before the next phase (build green, manual smoke test, user confirmation, etc.), and where the kill switch is if something goes wrong. For dotfiles work, the default gate sequence is: edit → `nix flake check` → `nh os build` (no system change) → user spot-check → `nh os switch`. Deviations from this sequence MUST be called out. Name any feature flag, config toggle, or capability gate that scopes the rollout.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation. Risks that map to human-verification checkpoints in `tasks.md` MUST be flagged here.
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable). **rosh-spec-driven rule**: Every step that mutates shared state, is hard to reverse, or requires elevated permissions MUST be preceded by a verification step and followed by a confirmation step. Single-line "run X" entries for impactful actions are insufficient.
      - **Adversarial Review**: **rosh-spec-driven rule**: REQUIRED section. State the rubric the plan is reviewed against (the spec scenarios incl. negative ones, the `Decisions`, the `Rollout & Gating` gates, and the proposal `Non-goals`). Two halves: the deterministic `specutil check` lint is MANDATORY and runs on every phase; the LLM critic loop is default-on but OWNER-GATED — the `adversarial-review` skill elicits an approve/deny (default run), and the owner MAY waive the loop for a small phase, recorded as `Adversarial review: waived by owner`. When run, independent critics attempt to break the plan with a concrete failing scenario naming a violated rubric item, the author revises against surviving objections, and the loop repeats until it reaches a terminal state. The round cap is scaled by the skill (K=2 for one phase, K=4 for one capability, K=6 for a cross-capability or live-system change), and the loop also stops early on non-convergence or fix-induced churn. A cap hit is reported as open objections, never as a pass. Do not name the executor here; the `adversarial-review` skill routes it on what the review needs. This section names the methodology; the per-phase checkmarks live in `tasks.md`. Do not re-derive the methodology here; cite the skill.
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - **rosh-spec-driven rule**: When the change spans more than one capability, group tasks under explicit phase headings (`## 1. Phase name`, `## 2. Phase name`, ...). Each phase MUST correspond to a coherent phase that could in principle be reviewed or shipped independently.
      - **rosh-spec-driven rule — gate on judgment, not on distrust**: A human gate costs a context switch and trains the owner to click through, so it MUST earn its place. Apply this test, from Anthropic's own criterion that automated testing verifies functionality while human review verifies alignment with broader system requirements: gate where the failure mode is "every check passes and the wrong thing was built"; do NOT gate where the failure mode is "the code is broken", because a command already answers that.
        - An action is IMPACTFUL when it is irreversible, outward-facing, or mutates state the owner cannot reconstruct. These MUST carry an owner gate: `nh os switch` / `nh darwin switch`, `git push`, `openspec archive`, schema fork or migration, deletion outside scratch space, network writes, vendored-content updates.
        - An action is NOT impactful merely because it is a write. `git add`, `nix fmt`, and any formatter sweep are deterministic and revertible; gating them is ceremony. State them as ordinary tasks.
        - A precondition a command can decide is NOT a gate. `nix flake check`, `nh os build`, `specutil check`, and `openspec validate` all exit non-zero on their own. Name the command in the Apply task's own line, or let the pre-commit path run it. Do not spend a checkbox asking the owner to confirm a program's exit code.
        - Where a gate IS earned, the structure MUST be:
          - `- [ ] X.N Apply: <impactful action>, gated on <command that must exit 0 first>`
          - `- [ ] X.N+1 Confirm: <the judgment only a human can make, e.g. the owner spot-checks that the captured settings are the ones they meant to keep>`
        - A `Confirm:` task MUST state a judgment, not a re-run of a command. "Confirm the tests pass" is not a gate; "confirm the migrated values are the ones you intended to keep" is.
        - Prefer ONE confirmation per impactful action. A run of consecutive `Confirm:` tasks after a single action is a sign the author is enumerating observations rather than naming a decision.
        - A gate is a boundary between runs, not a pause inside one. If a phase needs owner sign-off partway through, split it into two phases so the boundary is visible and the first half can be re-run on its own.
      - **rosh-spec-driven rule — reuse first**: For each task that introduces a new module/file, the description SHOULD reference the existing pattern it follows (cite a file path) or explicitly note this is a new pattern (with justification carried from design.md).
      - **rosh-spec-driven rule — adversarial-review gate per phase**: Each phase (numbered phase) MUST end with an adversarial-review checkbox before its impactful-action/rollout tasks. The checkbox invokes the `adversarial-review` skill, which first runs the mandatory deterministic `specutil check` lint, then elicits the owner's approve/deny for the LLM critic loop (default: run). On approve, independent critics attempt to break the phase against the rubric (spec scenarios, design decisions, rollout gates, non-goals) with a concrete failing scenario; the author revises against surviving objections; the loop repeats until it reaches a terminal state. The round cap is scaled by the skill (K=2 for one phase, K=4 for one capability, K=6 for a cross-capability or live-system change), and the loop also stops early on non-convergence or fix-induced churn. A cap hit is reported as open objections, never as a pass. On deny, the loop is waived and the checkbox records `Adversarial review: waived by owner`. Either way the checkbox is present (a waiver is explicit, never a missing or silently-checked box), `specutil check` still passes, and the human-verification gate for impactful actions still applies. The skill picks the executor by what the review needs: fresh-context subagents by default, because a critic that shares the author's context inherits the author's reasoning. Do not name a mechanism here.
      - **rosh-spec-driven rule — model the work as a loop or a graph, not prose**: Prefer an explicit agentic shape over an implicit sequence. A phase whose work is gather-context, act, verify is a `loop` and MUST declare its `STOP` condition and `MAX-ITERS`; a phase whose work fans out into independent subtasks is a `graph` and MUST declare its `deps:` edges. When an agent drives the iteration itself, drive it with the `loop` skill (`/loop` with no interval, so the model self-paces one iteration per cycle) and end it with the loop's own stop control the moment the `STOP` condition holds. State machines with named states and one transition per condition are preferred over prose descriptions of control flow, because a named terminal state is checkable and "until it looks done" is not.
      - **rosh-spec-driven rule — phase shape**: Each non-Rollout phase MUST declare a shape as a marker bullet: `- **SHAPE** loop` or `- **SHAPE** graph` (a `## <n>. Rollout` phase is exempt). A `loop` phase models the gather-context, act, verify cycle and MUST also declare `- **STOP** <condition>` and `- **MAX-ITERS** <n>`; one iteration is the valid single-pass case. A `graph` phase models orchestrator-worker fan-out; each subtask MAY carry a trailing `` `deps:` <ids|none> ``, and every referenced id MUST name another subtask in the same phase. `specutil check` enforces these declared markers. When you PRESENT a plan or a shaped phase to the owner, render the shape as an inline ASCII diagram via the `diagram-mermaid-render` skill: a `loop` as a gather-to-act-to-verify cycle returning to the stop check, a `graph` as a subtask dependency DAG. This is for human understanding and is not enforced by `specutil check`.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure (follows `modules/home/programs/llm/skills/` layout)
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      - [ ] 2.3 Adversarial review (`adversarial-review` skill): critics attempt to break the export phase against its spec scenarios; revise until the loop reaches a terminal state (see the skill for the scaled round cap)

      ## 3. Rollout

      - [ ] 3.1 Apply: `nh os switch`, gated on `nix flake check` and `nh os build` exiting 0
      - [ ] 3.2 Confirm: the owner spot-checks that the exported columns are the ones they meant to expose
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable — you know when it's done.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
