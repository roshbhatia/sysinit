        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on whether the baseline captured is the right one, since every later STOP gate compares against it.'
    91861782fd0da87c:
