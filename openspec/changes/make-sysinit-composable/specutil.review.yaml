    870838cf37e01841:
        hash: 91ec5b39f6132cb4
        text: 'Act: emit `homeModules` and `homeConfigurations.<profile>-<system>` for `dev` and `minimal` across the three `cacheSystems` (`flake.nix:109-113`): `aarch64-darwin`, `x86_64-linux`, `aarch64-linux`. Six configurations, not eight. An earlier draft said "the four systems", which is the `formatter` list at `flake.nix:229-233` and adds `x86_64-darwin`. That would make these the only outputs on a system nothing else here builds for.'
    3722403cf5f7ef9f:
        hash: 7f044eb8b759b36e
        text: 'Act: add `modules/shared/options/paths.nix` owning every state path. Generate a JSON manifest from it that Go, shell, lua, python, and YAML read, so the five derivations become one. All five: an earlier draft named four and silently dropped `seshy/config.yaml:5`, which the proposal counts among the derivations. YAML cannot read a manifest at runtime, so generate that file from the manifest at build time instead. The manifest must supply an absolute path rather than a variable to expand, and it is produced from one checked-in layout template whose only substitution is `$HOME`. One producer matters at the phase boundary: 9.7 has to write this manifest on a box with no Nix, so without a template it would author the same paths a second time in shell, which makes the five derivations two rather than one and reintroduces the defect this phase removes. It would also fail 4.3''s check, because the template is a second producer of paths and carries no consumer''s documented default. 4.3 exempts it alongside `paths.nix`, and those two entries are its whole producer set. An earlier draft described that check as a two-file allowlist over every occurrence, which 4.3 replaced: the allowlist now covers unmarked occurrences only. Have 9.7 expand the template rather than author paths, and let 9.8 compare the expanded file against it. The absolute path is required because `repo.go:63-64` records that nvim launched from a mux server inherits no session variables, so `XDG_STATE_HOME` is unset exactly where the fallback runs. That comment is about nvim; treat it as the demonstrated case rather than as proof for every consumer, and confirm the same for the shell and python readers while implementing. Allow each consumer exactly one default marked with the bare token `sysinit:documented-default` in a comment on the same line or the line above, keyed to the manifest being absent, and no other. An earlier draft banned defaults outright and cited that same comment, which does not support the ban and contradicts this change''s own criterion that the agent runtime installs without Nix: phase 9 builds a box with `go install` and no Nix, so no manifest exists there and a consumer with no default cannot resolve a path at all. Task 9.7 owns installing it on that box; this task owns making the default reachable only when it is missing. Call this one the paths manifest everywhere, and leave "manifest" unqualified for `bootstrap/tools.toml`, which phase 9 already uses the word for. One word, one meaning is this change''s own rule, and an earlier draft had the word naming two artifacts across a phase boundary.'
    9932565a96b6e779:
        hash: d6d1c2b6c9b7ad40
        text: 'Act: make the Nix `minimal` package group read the manifest, so the manifest is the source. Preserve the current element order in the derived list. `home.packages` reaches `buildEnv`, whose `drvPath` changes when identical paths are reordered, so a re-ordering rewrite churns every host hash for no content change. 9.9 depends on this rather than being immune to it, which an earlier draft had backwards: the derivation-path set carries each `buildEnv`''s own derivation as an interior entry, and that entry''s hash is computed from the order of its `paths`. So a reordering rewrite fails 9.9 on a correct implementation. Preserve element order.'
