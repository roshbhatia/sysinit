    1da9921ec862d126:
        hash: a0d515659c61a9f5
        text: 'Verify: `go test ./...` passes under `pkgs/sysinit-agent` with all ten store-discipline tests of the writer still present and asserting the same behavior: `TestZeroByteStoreIsNotAbsorbing`, `TestMalformedStoreIsRefusedNotOverwritten`, `TestFailedProducerDoesNotPublish`, `TestSymlinkedStoreIsRefused`, `TestWriteIsRefusedWhileTheLockIsHeld`, `TestLockIsReleasedAfterEveryWrite`, `TestApplyRejectionsLeaveTheStoreByteIdentical`, `TestApplyRejectionDoesNotCreateAStore`, `TestConcurrentAddsLoseNoNote`, and `TestRelativePathResolvesThroughASymlinkedCwd`. An earlier draft gated on `./internal/store/...` alone. That package is kept byte for byte, so its tests cannot fail, and they assert the property exists rather than that the writer still uses it. Dropping the `Lock` call in 3.4 would have passed the old gate clean. A package rename may change their package clause, and 3.4 deletes `--no-open`, so the shared helper''s `t.Setenv("DIFFNOTE_NO_OPEN", "1")` at `diffnote_test.go:46` and its stale comment at `:44-45` go with it, as do two more comments the STOP pattern does not match: `:183` names `diffnote list`, which 3.4 renames, and `:464` names "a store the editor filters", whose editor half 3.7 deletes. Nothing else may change. Naming that exception matters because literal compliance would otherwise keep dead code that no STOP pattern matches.'
    2e18019a600ff1fc:
        hash: 5236cde656129f92
        text: 'Verify: the container run in the STOP gate passes; the manifest 9.7 wrote matches 4.1''s template with `$HOME` expanded, so the two producers are one; and `sysinit-agent note add` inside the container resolves its path from that manifest rather than from a default.'
    3aa93a2e7be8aec2:
        hash: 36766e9211aa2e10
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on the generator, where silent drift between the two lists is the failure this phase exists to prevent.'
    3de8faff53a21158:
        hash: 3ec8a3ca2683858c
        text: 'Confirm: owner runs the comparison. Every name `zmx list` reports under `ZMX_SESSION_PREFIX` is a name `sy list` reports. One direction, per 10.4, and scoped to the prefix. This is a Confirm and not a check because it needs a live daemon and real worktrees, which a sandboxed `checks/` build has neither of. Check the two joins by their output, not just the two lists. With two live sessions, `agent-sessions` emits each session exactly once, with no duplicate carrying `status: null`. Count entries rather than looking for a repeated name: on a split the two entries for one session carry DIFFERENT names, the record name in `$active` and the seshy name in `$idle`, so two live sessions show four entries. An owner watching for the same name twice finds none and passes. And the waybar badge excludes the selected session, which is what `desktop.nix:343` fails to do on the same divergence. This phase has no automated gate for name agreement, since the STOP covers 10.8 alone, so this Confirm is the only thing standing between a namespace split and two silently wrong displays. Nothing constrains a direct `zmx` invocation, and 10.2 puts `zmx` on `PATH`, so an owner naming a session by hand creates one that matches no seshy directory. An unscoped comparison would fail on an implementation that is correct in every way this change controls. Nothing else in the phase exercises the invariant 10.4 introduces, and an earlier draft asked 10.4 to "add the comparison" with no task running it. Create two sessions with `s` first and assert `zmx list` is non-empty before comparing. Subset-of holds trivially when the left side is empty, and on a box where no session has been entered that is the state the check finds, so without the non-empty assertion this task passes without testing anything.'
    4b82793418461e5d:
        hash: 1f1603421301c2dc
        text: 'Verify: a note carrying a multi-line rationale and an author, written with no `hunk` process running, is readable from the RECORD afterward with both fields intact. That half is unconditional. What `review` displays depends on 3.1: if the schema has no multi-line field, 3.5 permits the loss in the export, and then this task asserts only that the design says so. The record is the contract; the display is what the probe allows.'
    4bbcc1edec3334f7:
        hash: a47148742ea3177b
        text: 'Verify: the ten uncovered harnesses are recorded in the proposal as uncovered, with no scraping added.'
