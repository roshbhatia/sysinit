        text: 'Act: open the follow-on change `decompose-wezterm-ui`, which design.md section 8 sequences after this one.'
    ab71ec35a3e85d8c:
        hash: 466615e4db3c434f
        text: 'Act: stand the baseline up. Two deliverables, because the second is what produces half of the first: a committed baseline holding the two host drvPaths, one line per host carrying the attribute path and the drvPath, plus a sorted derivation-path file per host; and the CI job that evaluates the `x86_64-linux` half. This is Act and not Gather for that reason. The owner records `lv426` locally and takes the `arrakis` line from the job''s output. Commit the file rather than leaving it in the working tree, because the Linux half of every later gate runs in CI on a different machine, and CI can only compare against a referent that is in the repository. Record the attribute path and not just the hash. This is the only task in the change that names an attribute path, and the two shapes differ in a way an implementer will not guess; 2.12, 3.14, 6.5, 10.12, and 11.1 all say only "the two host drvPaths" and would otherwise reconstruct the command from memory. Task 3.10 sets the standard: a gate needs an artifact rather than a memory, and a hash with no attribute path beside it is exactly that. Two hosts, not three, and two different attribute paths, because `hosts/default.nix:47,49` defines exactly `lv426` and `arrakis`. An earlier draft said `nix eval --raw .#darwinConfigurations.lv426.system.drvPath` "and the same for `arrakis` and `nostromo`", which is wrong three ways: `nostromo` does not exist anywhere in this repository, `arrakis` is a `nixosConfiguration` and not a `darwinConfiguration`, and one attribute path cannot serve both. Use `.#darwinConfigurations.lv426.system.drvPath` and `.#nixosConfigurations.arrakis.config.system.build.toplevel.drvPath`. The third `darwinConfigurations` entry, `bootstrap` (`flake.nix:130`), is an installer configuration and not a host; leave it out of every gate. The `arrakis` half needs an `x86_64-linux` machine, and this task adds a CI job rather than making the owner configure a builder. On the owner''s `aarch64-darwin` machine the evaluation fails with "Required system: ''x86_64-linux''" before it prints a hash, because the module set imports from a derivation. State the evidence at its real strength, because an earlier draft said "the `arrakis` half runs in CI" in the present tense and nothing in CI touches `arrakis` today. `build-cache.yml:74` builds `.#packages.<system>.cacheBundle`, which is a `symlinkJoin` at `flake.nix:174`, and `check.yml:37-42` has exactly one job on `macos-latest`. What the evidence does establish is enough: a Linux runner is reachable and proven to install Nix, because `build-cache.yml:32-33` declares `os: ubuntu-latest` under `system: x86_64-linux` and the installer at `:51` runs on all three matrix cells. So no local builder is needed once this task adds the job. The job is new work, not an existing thing to point at. Put it in its own workflow, `.github/workflows/closure-baseline.yml`, on `workflow_dispatch` alone, with both hosts as a matrix. Do NOT add it to `check.yml`. An earlier implementation put the steps in the `verify` job and that was wrong in a way worth recording, because the reasoning for it was superficially good: `check.yml` deliberately carries no path filter, so it sees every change. But `verify` is the required check on main, and `update-sources.yml:5` opens a `nix flake update` PR on a six-hourly cron. Every such PR moves thousands of derivation paths, so none of them could ever go green, and `auto-merge-dependabot.yml:23-26` records that its `--auto` needs `verify` required on main. The gate would have stopped the repository''s dependency automation for eleven phases. It would also have made every intermediate commit of a multi-task phase red by construction, since phase 2 re-records only at 2.12. A change-scoped gate does not belong in a permanent required check. `workflow_dispatch` is what these gates actually are: per phase and owner-invoked, run with `gh workflow run closure-baseline.yml` at a phase boundary. Every gate that evaluates for `x86_64-linux` splits the same way, Darwin locally and Linux in CI: 2.12, 3.14, 6.5, 9.9, 10.12, and 11.1, plus 6.6, and 7.3, whose whole-closure form spans both hosts and is the only form reaching `nixos/desktop/greetd.nix` and `nixos/home/desktop.nix`, and also 8.3, which builds `.#homeConfigurations.dev-x86_64-linux` and is a Behavior criterion of its own. An earlier draft said "every drvPath gate", whose wording excludes 8.3. Task 8.4 already sends the owner to a Linux box for the switch, so phase 8 knows the boundary exists; 8.3 is the task CI takes off the owner''s machine. Each of those tasks carries the split in its own words rather than relying on this one, because a constraint stated once and read at eight sites is the memory this task''s own first paragraph refuses. No gate here realizes a host closure, and that is a decision rather than an accident. An earlier draft used `nix store diff-closures`, which needs two realized closures in one store. The `lv426` system closure measures 17.5 GiB and `check.yml:86-90` already records that a runner has roughly 14 GB free and that `nix build` of a host fails on disk there, so two of them fit on no runner, and holding both as GC roots across eleven phases is a 35 GiB charge on the owner''s machine for a comparison that never needed the bytes. Use `nix derivation show -r <attr>` instead, and compare the set of derivation paths in the graph excluding the root. That is pure evaluation: measured here at 7441 derivations and 3278 distinct names in 9.9 seconds for `lv426`, materializing nothing. It answers the question these gates actually ask, which package appeared or disappeared, and it beats `diff-closures` on two counts. It is NOT order-insensitive, and an earlier draft claimed it was on the reasoning that a set of paths has no order. The set has no order, but its membership changes, because a `buildEnv`''s own derivation is computed from the order of its `paths` and input-addressed hashes propagate upward. Verified: two graphs differing only in `paths = [hello jq]` versus `[jq hello]` hold 572 derivations each and differ on two, the root and the `-env.drv`, so excluding the root leaves the other. That node is interior in the real graph, not the root, which is why the class is present: 20 `-env.drv` entries for `lv426` and 70 for `arrakis`. So order preservation is a requirement on 6.2 and 9.4 rather than a nicety, stated in both. What the set does buy over a bare hash is a readable failure: only `-env.drv` nodes moving is a reorder, a missing package is a dropped module, and a hash cannot tell those apart. It covers build-time dependencies, which `diff-closures` cannot see. And it needs no GC root, so nothing in this change pins a closure. The cost is real and small: it compares identity, not size, so a package that changed size without changing identity reads as unchanged. Task 6.6 keeps `nix path-info -S` for the one place a number is the point. Two things about the CI job itself, both because the file it joins establishes the opposite convention. It must fail rather than skip when a precondition is missing. `build-cache.yml:53-63` gates its push on a secret so the job stays green without one, and `:28` sets `fail-fast: false`; that skip-when-absent shape is what 3.13 moved a check out of the pre-commit hook to avoid, and it is worse here because the owner looks at CI less often. And it runs at every phase boundary, not once at the end, for the same reason the last paragraph of this task gives. `check.yml:42` stays on `macos-latest` and is not the place for this; its comment records why, that `nix flake check` builds only the current system''s checks and Darwin is what the owner experiences. Accept the cost this imposes and name it here rather than leaving an implementer to meet it at the first phase boundary. A gate that lives in CI cannot be run before committing. Passing 3.14 means pushing a branch, waiting on a runner, and reading a result, eleven times. That inverts the property 3.13 and the phase 10 STOP were written to protect. It is accepted because the alternative is a second machine the owner maintains out of band, which is the same defect phase 4 exists to remove, a fact held somewhere other than the repository. The Darwin half of every gate still runs locally in about ten seconds, so the wait applies to the `arrakis` half alone. Building on `arrakis` itself at pull time was the other option and is not a substitute. These gates are per phase and exist to catch a module silently dropped during the refactor, so a check that runs after all eleven phases land reports the loss with no signal about which phase caused it. Keep it as a final confirmation, not as the gate. An earlier draft offered a second branch, recording that `arrakis` is ungated and that every gate covers one host. Three tasks refuse it: 6.5 checks "the two drvPaths", 9.9 requires "an empty diff for both hosts", and 11.1 compares "the two host drvPaths". Under that branch all three name a referent nothing recorded. It also quietly changes what this change proves: `arrakis` is the only Linux host and the only consumer of `modules/nixos/`, so dropping it removes Linux from the profile split, from theming, and from standalone home configurations. Phase 7 is the sharpest case, since `nixos/desktop/greetd.nix` and `nixos/home/desktop.nix` are two of the twenty modules 7.2 guards and neither is reachable without it. Ungating Linux is a scope decision for the owner and a proposal edit, not a footnote in this task. Record the derivation-path set beside each host''s drvPath, as a sorted file per host from `nix derivation show -r <attr>` with the root drv removed. Those two files are what 2.12, 3.14, 6.5, 7.3, 9.9, 10.12, and 11.1 compare against, and they are text, so they commit and diff like text. An earlier draft instead built each host with `nix build --out-link`, named `-o result-lv426` and `-o result-arrakis` so the second would not drop the first host''s GC root, and recorded the output paths. Every line of that is now dead: no gate realizes a closure, so there is no root to hold, no `./result` collision to avoid, and no store path worth recording. It was also unbuildable for `arrakis`, whose out-link would have named a path in a runner''s store that ceases to exist with the job. Task 3.10 already sets the standard this follows, that a gate needs an artifact rather than a memory, and a committed text file meets it where a GC root did not. This is the baseline for 11.1''s enumeration clause alone. An earlier draft called it the baseline for phases 6, 7, and 8, which three tasks contradict: 3.14 says "Phases 6 through 9 compare against this recording, not against 1.1", 6.5 says the same in its own words, and 9.9 diffs against the 3.14 build. No phase from 6 to 9 anchors here. It is NOT a whole-change gate. Phases 2 and 3 change the closure on purpose, because they delete and rename packaged code, so an equality gate spanning them can only fail. Each of those two phases re-records the baseline as its last step, and states in one line what moved and why it was intended. Capture `owner-wezterm-sites.txt` here too, which task 2.9 compares against: the literal output of `rg --sort path --no-line-number ''"wezterm"|wezterm cli''` over `modules/home/programs/neovim/config` with `-g ''!**/doc/**''`, minus the four lines phase 2 removes. Run it without line numbers, and with `--sort path`, which is load-bearing rather than tidy. `rg` walks files in parallel and does not order its output otherwise: five consecutive runs of the unsorted command here produced five different checksums, so 2.9 would compare a committed file against a differently ordered live capture and fail on every correct implementation. Both sides must use the same command. 2.8 deletes 41 lines above `wezterm_terminal.lua:100`, which shifts five surviving sites in that file, so a positional artifact fails on a correct implementation. The set is `path:matched-text` pairs. 31 lines today, minus 1 for `doc/`, minus 4 for the removed lines, is 26. It has to be recorded before the edits, or the gate compares the edited tree against a snapshot of itself.'
    ab46046d94b919a7:
        hash: b3fbdaaab5f2e602
        text: 'Act: add the hunk-shaped export as a derived file the writer maintains, not as a one-shot command. Every `add`, `apply`, and `clear` republishes it inside the same store lock that publishes the record, so the two cannot disagree. Its path derives from the repo root by the same digest as `repo.NoteFile`, so it has an address both ends compute and two `review` runs in two panes share one file. An earlier draft made it a command `review` ran once, which froze the viewer''s input at start: a note written afterward changed our record and never reached the file hunk re-reads, so the "recoverable by re-read" argument that justified deleting the mirror was false. This is still not a push. The writer writes files and nobody calls the viewer. Preserve structure across the boundary: `rationale` keeps its newlines through `store.Clean` if the schema has a multi-line field, and if it has none, record that loss in the design rather than flattening into a one-line field, because `store.go:182` records that a newline there once forged an extra row. Keep `author` a field if the schema has one. `--replace` matches on our record and not on the export, so its match key is unaffected. Four things the lock does not give, which this task states rather than implies. Two renames cannot be atomic together, so one file leads, and the rule is the harm rather than the direction of a size change. Never fabricate: the export must not show a note the record never had. Record first satisfies that for every verb, because it only ever leaves the export holding notes the record used to have, which is staleness the rebuild verb repairs. So record first, with one exception. `clear` publishes the export first, because there the harm is not fabrication but a documented kill switch appearing not to have taken effect: record-first would empty the record and leave every note on display (`diffnote.go:656-657`).'
    ac5989922ab21e3e:
        hash: 52be36997f9ac50c
        text: 'Act: add `bootstrap/bootstrap.sh` that sparse-checks-out, symlinks the neovim and zsh configs, runs `mise install`, and `go install ./pkgs/sysinit-agent`.'
    ace4b1ee1f8dcd20:
        hash: 2b4c5f89e07935fb
        text: 'Verify: every list in 4.4''s enumeration now reads from the registry, checked site by site against that file rather than against a count. Then test the property the lists existed to hold: add a throwaway harness to the registry alone, build, and confirm it appears in every surface the enumeration named, with no other file edited. Also confirm the registry and `neovim/config/lua/harness/registry.lua` agree, which they do not today.'
    aded12defecb1e50:
        hash: e1959e47dce46374
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on the claim that no behavior was lost silently, on the derived export as an artifact that can go stale against its record, and on the loopback daemon as an unauthenticated local listener.'
    af367014cd80b7c9:
        hash: ec39333bea9c98de
        text: 'Verify: re-record the two host drvPaths and the two derivation-path files, as 1.1 does, because 3.14 compares against this recording. This phase changes them on purpose, so name each difference and its cause by diffing the derivation-path sets against 1.1''s, rather than the hashes alone. Name the referent: an earlier draft said only "name each difference", and a diff whose second operand is unstated cannot be checked by a reviewer. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds, which is where every gate from here on gets its Linux side.'
    b04e7e5cef906ff8:
        hash: 46a4ec472461cb93
        text: 'Act: make every zmx session that `s` creates carry a seshy session name, and use `ZMX_SESSION_PREFIX` for the namespace rather than encoding it in each name, which is what the variable is for. State the invariant in one direction only. An earlier draft asked that `sy list` and `zmx list` "name the same things", which cannot be set equality: a seshy session is a worktree directory under `~/.local/state/seshy/sessions` and exists with no process running, while a zmx session is a live process, so a session created and not yet entered is in `sy list` alone. Do not trust `seshy/config.yaml`''s comment on where the `sy` gate lives while working here: it says the gate is a shell wrapper in `zsh/integrations/seshy-wezterm.zsh`, and that file defines `s`, `sl`, `si`, `wezcopy`, `weznot`, and `wezmon` and no `sy`. The gate is real but is a generated binary wrapper, `runtime/default.nix:255` reading `sy-gate.sh`. Correct the comment while here.'
    b5e994d78cee5ecb:
        hash: 842ff551c9e34508
        text: 'Act: delete `internal/nvimlink` and the `neovim/go-client` dependency, then re-vendor. Keep `internal/repo`. An earlier draft deleted it on the true premise that its callers are all in the note writer and the false conclusion that the writer dies: 3.4 keeps the writer, and with it `repo.Root` and `repo.NoteFile` at `diffnote.go:171-183` and `repo.RelativeToRoot` at `:256`, `:371`, `:570`, and `:672`. It is not a path-derivation package a manifest can replace. `Root` scrubs `GIT_DIR`, `GIT_WORK_TREE`, and `GIT_INDEX_FILE` so a hook-invoked agent does not inherit the triggering repository, and `RelativeToRoot` is a containment check that resolves symlinks because macOS `/tmp` is one. The phase 4 manifest owns the `agents/diff-notes/` prefix; `repo` owns the per-repo digest under it. Correct the stale references in the package comment at `repo.go:3-6`, which names `lua/harness/diffnote.lua` that 3.7 deletes, and in the `StateHome` comment at `repo.go:63` while here, or the phase STOP gate cannot go green.'
    b8a3ebe62143b727:
        hash: 854b416de6a1c2a4
        text: 'Act: add a `checks/` assertion that the export schema still matches what `hunk diff --agent-context` accepts, using the accepted and rejected fixtures 3.1 produces. Put it in `checks/` and not in `.githooks/pre-commit`, which an earlier draft chose. That hook''s established idiom is skip-when-absent (`:11`, `:22`, `:31`), so a branch written in it is a no-op on any box without `hunk`, and `hunk` is not installed on this one. A guard that silently skips is the failure the task exists to catch. `nix flake check` is already in the phase STOP and 3.2 makes `hunk` a flake input, so under `checks/` the tool is present by construction and the check cannot skip. Scope it by system. `flake.nix:181-187` instantiates checks over `cacheSystems` (`:109-113`), which is `aarch64-darwin`, `x86_64-linux`, and `aarch64-linux`, so a `nativeBuildInputs = [ pkgs.hunk ]` forces that attribute at eval on both Linux systems. If hunk''s flake does not provide them, `nix flake check` fails at eval, and that is the phase STOP''s first clause. 3.2''s own reason for pinning, that hunk''s build enumerates `perSystem.x86_64-darwin`, is evidence its system coverage is unusual, and `cacheSystems` does not include `x86_64-darwin` at all. Restrict the check to the systems 3.1 records hunk as providing, or have 3.2 gate the overlay entry the way the other platform-specific entries are gated. The `mise.toml` generator in phase 9 guards the same shape of drift. Republishing on every write makes a schema mismatch silent and continuous rather than surfacing once: the writer keeps producing a file hunk ignores, and `review` shows empty context with no error on either side. Do not pin the watch behavior in the same assertion. An earlier draft did, and it contradicts 3.10, which states that "a miss at 5 seconds is not an absence: re-observe at 60 seconds and after a focus change before concluding". No automated check has a focus or 60 seconds per run, so a shorter bound fails on a change that is correct. Assert the `hunk` node''s `locked.rev` in `flake.lock` instead, which is a deterministic string, and re-run 3.10 by hand when it moves. It is in the lock and not in `flake.nix`: `878f78300^:flake.nix:108-111` pins hunk''s nixpkgs and leaves `url = "github:modem-dev/hunk"` unpinned. The risk is the same one: an input bump can turn a poll into a file watch silently. Also assert that the replacement review skill appears in a rendered harness instruction block: `hunk skill path` resolves at runtime while the skill tree renders at build time, and the design''s claim that it reaches all eleven harnesses through existing machinery has no verify today. Name the route for that clause, because a rendered block lives inside an evaluated home configuration and `checks/` receives only `{ lib, system, pkgs }` (`flake.nix:181-187`), so it has no handle on `self` or on any configuration. Assert two things, not one, because the skill reaches the eleven harnesses two different ways. Only codex gets an inlined list: `instructions.nix:93` includes the `skills` section only for a harness in `harnessesWithoutSkillLoader`, and that list is codex alone (`:32-34`). So assert three things, enumerated by destination rather than by harness, because `rg` over `llm/default.nix` for a skills destination returns a closed list of four roots. One: the skill name appears in the block `makeInstructions` returns for codex. Two: the `allSkills` render installs the file at `.claude/skills/` (`render.nix:197`, `llm/default.nix:12`), which is also the root the six harnesses with no copy of their own read through `skillsRoot` (`instructions.nix:40`, `gemini/default.nix:63`, `cursor/default.nix:37`). Three: the `ampSkills` render installs it at the three roots it feeds, `.config/amp/skills/` (`llm/default.nix:95`), `.config/devin/skills/` (`:111`), and `.copilot/skills/` (`:127`). Three is a separate assertion because `renderSkillsFor "amp"` (`render.nix:193`) is a separate evaluation that can fail on its own, and an assertion on `.claude/skills/` alone stays green while amp, devin, and copilot lose the skill. Two earlier drafts got this wrong in opposite directions: one asserted the block for all eleven when only codex has it, and one asserted one file path for ten when the answer is one root for six, another for three, and a block for one. `nix flake check` is this phase''s first STOP clause, so a wrong grouping fails on correct code. The check imports `skills/render.nix` for `localSkillDescriptions` (`render.nix:195`, exported at `:210`), which is a required argument of `makeInstructions` (`instructions.nix:37-42`) and has no other producer, and passes it in. What it must not do is assert against `render.nix`''s output alone, which an earlier draft did: that proves membership in the description set, not presence in a rendered block. The clause was written for the pre-commit hook, which could grep the store, and it did not survive the move unchanged.'
    b8c39ed8e5029505:
        hash: d6ffa38a585825df
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on the generated manifest, where a consumer silently falling back to a hardcoded path defeats the whole phase, and on whether 4.7''s liveness bound can be stated without a clock the readers disagree about.'
    b71efc5ea8359f16:
        hash: c55b13f8796dfb59
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on whether 2.2''s self-report line is a real distinction or a rationalization, on whether 2.4 leaves any agent path to a pane, and on whether 2.7 leaves any agent route into `harness.api`, and on the `$EDITOR` shim kept in 2.8.'
    bc094b4bcf455b4b:
        hash: 81e08bcc1204718b
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on the gating, where a mis-scoped `optionals` silently drops a module from every profile.'
    bf37924e39371119:
        hash: 6fa0c3ae8466ac75
        text: 'Gather: probe the `hunk` binary, not its README. It is not installed on this machine and 3.2, which installs it, depends on this task, so probe it with `nix run github:modem-dev/hunk -- ...`, which needs no repo change. An earlier draft said "the installed binary" and was completable only by a route it did not name. Record the schema `hunk diff --agent-context` expects, with a file it accepts and one it rejects, AND which systems its flake provides packages for, since 3.13''s check is instantiated on three, AND what it does with a path that does not exist, AND whether `--watch` re-reads that file when it is REPLACED BY RENAME, which is how it will actually change. An in-place append is a false positive: `store.Publish` writes a temp, fsyncs, and calls `os.Rename` (`store.go:124-144`), installing a new inode, so a viewer holding a descriptor keeps the old one and a viewer watching the file rather than its directory loses the watch. The renderer being deleted knew this and watched the directory (`diffnote.lua:286`, `:298`). If a directory watch is what it takes, name the directory. Task 3.10 asks the same question through the real writer, so where they disagree, 3.10 governs. The second half is the live workflow: if `--watch` only re-diffs the working tree, then the way to see a new note is to re-run `review`, and the design must say that rather than claim a watch covers it. This is the load-bearing probe and an earlier draft omitted both halves. If that flag expects hunk''s own `filePath`/`newLine` vocabulary, then "the note file is ours" is only true with an explicit adapter, and the adapter has to be named. Also record, for `session comment add`, `apply`, `list`, `clear`, and `session get`, every accepted flag and whether a comment carries any field beyond a file, one line selector, and a summary. Record the result in the change folder, because decision 2 rests on it.'
    c1e745808e744fea:
        hash: 8b57dde6910a0cba
        text: 'Act: give the pane record a written schema and a version field. Its own comment at `agentstate.go:33-34` already calls it "a published interface", and it has neither. Three readers exist today and phase 5 adds more, each reproducing rules nothing states: `pane` is a JSON number when numeric and a string otherwise (`agentstate.go:247-252`), and `|` is stripped from the reason for a field separator that only the OSC form uses. Publish the schema next to the writer, keep the `|` rule since 2.2 keeps the OSC channel, and make the readers cite it. Do not describe `ui.lua` as a user-var reader only. It is both: `pane_agent_state` at `:333-339` reads `p:get_user_vars()`, and `read_pane_git` at `:294-296` opens the record file, so the authority table must give it two rows or it describes half the file. 10.7 depends on that second half being there. A fact with several readers and no owner is the same defect this phase exists to fix. Two encodings now carry one fact: base64 of a pipe-delimited line at `agentstate.go:86-89` and JSON at `:95-107`, with `ui.lua:333-339` preferring the first and `agent-sessions.sh:63-70` reading only the second. Derive both from one value in one place and add a test that they agree, or two surfaces can show different statuses for one pane with nothing comparing them. The two also differ in lifetime, which the schema must state: the user var dies with its pane and needs no liveness rule, the file outlives it and needs 4.7, and they disagree precisely inside the window 4.7 covers. Say which is authoritative for which reader, since `ui.lua:333-339` prefers the var and `agent-sessions.sh:63-70` reads only the file.'
    c1f906d433c504ce:
        hash: 6b92ffbebcd95c6e
        text: 'Act: cut the agent''s route into the editor''s pane-driving code, and leave the owner''s. An earlier draft deleted the wezterm control surface in `harness/preview.lua`, `utils/wezterm_terminal.lua`, `harness/adapters/claudecode.lua`, and `harness/lifecycle.lua` outright. That was wrong by this phase''s own rule. `plugins/harness.lua:13-27` binds fourteen keymaps the owner presses, and ten of them reach the code that draft deleted: `<leader>ja`, `jc`, `jf`, `jr`, `jb`, and `js` through the send path, `jj`, `jx`, and `jJ` through spawn and kill, and `jp` through preview. An owner pressing a key is asking. The rule is who initiates. An earlier draft then claimed that after 2.6 and 3.6 nothing in this repository lets an agent call `harness.api` at all, and made proving that the whole remaining work. The claim is false, and `doc/agent-ide-integration.md:51-55` says so: deleting `control.lua` removes the op handler, not the channel. `nvim --server <sock> --remote-expr ''luaeval(...)''` reaches any lua module in the running editor, and the repository hands the agent the socket two ways. Close both. Route two is `harness/instance.lua`, which publishes the socket to `$XDG_STATE_HOME/nvim/harness/instances/*.json` (`:6`). Its only reader in the repository is `bin/nvim-ctl:30`, which 2.6 deletes, so delete `harness/instance.lua` and its `require("harness.instance").setup()` call at `api.lua:198` with it. Route one is the environment export, which 2.8 closes. The rest of the task is the enumeration, and it must be complete or the module stays alive behind the parts that are removed. Fourteen sites drive wezterm from this tree: `harness/preview.lua:61`, `:74`, `:211`, `:237`; `harness/adapters/claudecode.lua:170`; and `utils/wezterm_terminal.lua:5`, `:31`, `:35`, `:53`, `:57`, `:104`, `:138`, `:165`, `:169`. Nine of those are the argv-table form (`vim.fn.jobstart({ "wezterm", "cli", ... })`), which no `wezterm cli` string grep can see. An earlier draft called the total thirteen and then listed fourteen, which matters because 2.9 compares line for line. Name the consumers too, since deleting functions and leaving callers leaves a live control module: `harness/lifecycle.lua:22` and `:25-64`, `harness/adapters/opencode.lua:17`, `plugins/claudecode.lua:18`, and `plugins/opencode.lua:15`. Confirm each entry point is owner-initiated and delete any that is not. Do not record the surviving set here, which two earlier drafts tried in this task and in 2.8. Task 1.1 owns it, because an expectation sampled after the edits cannot fail when an edit is wrong.'
    c5c7a8cbe2f7cf04:
        hash: faa07ea23b1ccb51
        text: 'Act: add a `mkHome` builder supplying the specialArgs the home tree expects without going through nix-darwin. Name them, because a missing one fails only in the modules that read it, which is the failure 8.5 describes and cannot catch. `modules/darwin/home-manager.nix:13-15` and `modules/nixos/home-manager.nix:14-16` both pass `inherit utils values inputs`. Supply `values` and `inputs` and drop `utils`: no `.nix` file dereferences it, confirmed by a `utils.` search over `modules`, `lib`, `hosts`, and `flake.nix` returning nothing, and the proposal already counts its removal. `values` is the hard one, because it is read by path. Derive the list from the tree by command rather than writing it by hand, in 4.4''s shape, and scope the search to `.nix`. It is fourteen paths today, from `values.darwin` through `values.user.username`. Unscoped it returns sixteen, because `neovim/config/after/lsp/helm_ls.lua:14-15` holds `values.yaml` and `values.lint.yaml`, which are Helm filenames in a lua string and not this specialArg. Five of the fourteen are not leaves and the schema has to say so, or it describes the wrong shape. `values.git`, `values.llm`, and `values.theme` (`darwin/home-manager.nix:34,35,38`), `values.darwin` (`home/colima.nix:9`), and `values.environment` (`home/default.nix:48`) are open attrsets that the consumer either indexes further or forwards whole. Treating them as leaves pins a shape their consumers do not agree to. Then say which paths `mkHome` defaults and which it takes as arguments. `values.hostname` and `values.user.username` have no standalone answer. Read that from `lib/builders.nix:40-44`, not from `hosts/default.nix`. The builder injects `hostname`, `user.username`, and `isDesktop` on top of the host''s own `values`, taking `hostname` from the attribute name and `username` and `desktop` from host fields that sit beside `values` rather than inside it. `hosts/default.nix` supplies exactly two top-level keys under `values`, `git` for both hosts and `theme` for `arrakis` alone. Say top-level keys and not paths, because this task counts fourteen deep paths elsewhere and the same word in both senses reads as a contradiction; the same two keys are six leaves counted deeply. That is also why the three have no standalone answer: `mkHome` has no `hostConfig` and no attribute name to inherit from.'
    c60a2c3915b18198:
        hash: ce270f17c817d34a
        text: 'Act: set every host in `hosts/` to `workstation`.'
    cab3120c649009a2:
        hash: 65e84e54e46431dc
        text: 'Act: delete the dead `utils` specialArg from all thirteen sites, nine threaded and four forwarding into `extraSpecialArgs`, plus `mkUtils` in `templates/discrete/flake.nix:53`, which is a published flake output, and the unused `sysinit = ../..` arg.'
    cc5284e3a9ea73d5:
        hash: 91e5de86670cab8f
        text: 'Act: add `sysinit-agent watch`, which renders a wtrun log, the agent-state bus, or a transcript, and tails it. It reads its paths from the phase 4 manifest. Name the resolution key per source rather than saying it resolves from the current directory, which an earlier draft did and which works for one source of three. The agent-state bus does key by directory, since the record carries `Repo` and `Worktree` (`agentstate.go:36-39`). wtrun keys by pane: `skills/wtrun/wtrun.sh:12-13` sets `session="${WTRUN_SESSION:-pane-${WEZTERM_PANE}}"` and nothing under that directory records a repository, so a viewer spawned into a new pane by 5.2 resolves its own empty directory. The transcript keys by harness session id, per 5.3''s `<harness>/<session>.jsonl`. Take the wtrun name from `WTRUN_SESSION` or an explicit argument, and have 5.3 record the repository next to the session so the transcript is reachable by directory; 5.3 carries that clause in its own body, since an implementer working 5.3 does not read 5.1. The phase is called one viewer, one contract, and the contract is what this task writes down. Reading the agent-state bus makes this the first Go reader of it, which lands the hole 4.7 records as vacuous today: answering pane existence from Go means forking `wezterm cli list`, and 2.9 removed exactly that fork. Do not reintroduce it. Show the record''s own state and mark it unverified when this command cannot answer liveness, rather than guessing. 4.7 leaves one half answerable without a fork: the record''s `mux` field is a pid, so Go can signal it with 0 and rule out a dead mux. That is weaker than pane existence, since a live mux says nothing about one pane in it. Use it to reject, never to confirm.'
    cd0ef7342d56e9fd:
        hash: 44a7ff4ac66652bf
        text: 'Act: generate `bootstrap/mise.toml` from the same manifest, with a pre-commit assertion that the checked-in file matches.'
    d2f712ea3e1af33c:
        hash: 43599c3153ee4662
        text: 'Verify: `wtrun` still passes its own contract unchanged, since 2.4 changes who may call it and not what it does. `wtrun -w 0 ''false''` exits 1, `wtrun -w 1 ''sleep 5''` exits 75, and the `sleep` is still running when it does.'
    d2829df207ad595b:
        hash: 78dfc7325a52ee1f
        text: 'Act: in `runtime/agent-prompt.sh`, delete the `Accept)` and `Deny)` arms of the `case` at `:125`, the `send-text` block at `:135-137`, the `approve_keys` and `reject_keys` tables at `:50-59`, and `--actions "Accept,Deny"` at `:115`. Do not delete by line range: `:128-132` is the `@CONTENTCLICKED` focus branch and `:133` is the `esac`, both of which stay, so a range delete leaves an unterminated `case`. Re-gate the rich alerter at `:64-70`, which currently keys on `approve_keys` being non-empty and would otherwise be decided by a table that no longer exists. The agent deck stays. The notification says an agent needs you, and clicking it puts you in the pane, where you answer.'
    d34872343e1ada9c:
        hash: 21d2683f6a3d201f
        text: 'Verify: the `XDG_STATE_HOME` divergence at `ui.lua:296`, `:312`, `:564`, and `:1735` is fixed, decided by launching wezterm itself with `XDG_STATE_HOME` set to a non-default value and seeing the status bar read the record `agent-state` wrote there. Exporting the variable in a shell proves nothing: `modules/home/default.nix:34` sets it as a home-manager session variable, which reaches shells and not GUI processes, and `repo.go:62-65` records that a process launched from a mux server inherits no session variables at all. The pair that actually diverges is `agentstate.go:65`, which honours the variable, against `ui.lua:296`, which does not. An earlier draft cited `ui.lua:187` as the other half; that line writes a different file in the same process and cannot diverge from `:296`.'
    dd6752ba8405f63e:
        hash: e07340605bd0d98a
        text: 'Act: replace `skills/diffnote/` with a skill that wraps `hunk skill path` for reading, and documents `sysinit-agent note add` for writing. Update the five `diffnote` allowlist entries at `llm/lib/allowlist.nix:202-204` and `:208-209`, and the registration in `pkgs/sysinit-agent/main.go`. The pi extension needs more than its prompt rewritten: `diff-review.ts:32` sets `VIEWER_COMMAND = ["nvim", "-c", "CodeDiff"]`, one line above the range an earlier draft named, and after 3.7 that view renders no notes, so pi would open an editor that cannot show the notes its prompt then asks for. Point it at `review` and rewrite the premise at `:34-35` that the CodeDiff view watches the file. Four more sites in that file are stale for the same two reasons and an earlier draft named none of them: `:4` and `:117` name neovim as the viewer, which stops being true when this task re-points it; `:120-121` repeats the false premise of `:35`, that the editor watches for notes, which stops being true after 3.7; and `:7` is the `wezterm cli split-pane` prose that task 2.9 hands to this task by name. A fifth sits inside the prompt range: `:37` says "A neovim CodeDiff review of the working tree is now open beside this session", which names the viewer this task re-points and which the `:36-44` rule below does not reach, because that rule is about command names. Rewrite all five. Verify the new allowlist entries match what the new skill tells agents to type, character for character. That check belongs to the skill alone, where both sides are literal. Do not extend it to the pi prompt, which an earlier draft did: `allowlist.nix:208-209` are globs (`"diffnote add *"`) and `diff-review.ts:36-44` is prose joined with spaces at `:44`, so there is nothing to compare character for character. The stated consequence is also false for pi, which consults no allowlist at all: `harnesses/pi/default.nix:487` sets `yoloMode = true` and `allowlist.nix:289-290` then emits no entries. A stale command name there is not a downgrade to a prompt, it is a command that does not exist. Check the pi prompt against the rule that applies instead: every command name in `:36-44` must be a subcommand `sysinit-agent note` provides after 3.4. For the skill, a mismatch fails nothing and silently downgrades every note write to a prompt, which reads as friction rather than as a defect.'
    e71ba4091e5fd6a1:
        hash: bfaa64adb5b45368
        text: 'Verify: the CI job 1.1 adds re-evaluates the `lv426` line and its output matches what the owner recorded locally. Exercise the job here, against an answer already known, rather than letting 2.12 be the first thing that runs it. Nine gates depend on this job and none of them tests it, so a failure at 2.12 would be ambiguous between "phase 2 dropped a module" and "the job is wrong", which is the exact signal phase 1 exists to make unambiguous. Task 9.2 states this repository''s rule for it: write the gate before the thing it judges, so the gate is not authored by the thing it judges. Use `lv426` and not `arrakis` because only `lv426` has an independently known answer; this proves the checkout, the installer, the attribute path, and the output format end to end, and costs one runner minute.'
    e349d0f52314be0d:
        hash: 7f66f44ef66476ce
        text: 'Verify: re-record the two host drvPaths and the two derivation-path files, as 1.1 does, since 9.9 compares against this recording across phases 4 through 9. This phase changes them on purpose, so name each difference and its cause against the 2.12 recording, by diffing the derivation-path sets rather than the hashes alone. Phases 6 through 9 compare against this recording, not against 1.1. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds.'
    e860b3e0ffe2ce61:
        hash: 300a4ea7edb18128
        text: 'Verify: a command still running after a detach is still running after a reattach, decided by starting a `sleep` in a zmx session, closing the wezterm pane, opening a new one, and reattaching. This is the property zmx is here for, and nothing else in the change tests it.'
    e8785eb9911a8bca:
        hash: 9311bf3b37ac5ef3
        text: 'Act: add the `hunk` flake input back, pinned to its own nixpkgs. Do not make it follow ours: its build enumerates `perSystem.x86_64-darwin`, which nixpkgs-unstable dropped. Restore `programs/hunk.nix` from `878f78300^` and re-derive its theme from stylix, but do NOT restore its `core.pager` setting. `archive/2026-08-06-quiet-pi-sidebar-and-diff-review` removed that deliberately, and routing every `git diff` and `git log` through a reviewer is a second decision this change is not making. Also restore the `hunk` line in `overlays/inputs.nix`, which `878f78300^:overlays/inputs.nix:20` had and today''s does not. Neither the input nor `programs/hunk.nix` puts `hunk` into the overlaid package set: the home module supplies its own package (`878f78300^:modules/home/programs/hunk.nix:44`), and `flake.nix:181-187` passes checks only `{ lib, system, pkgs }` with no `inputs` and no `self`. So without the overlay entry there is no route to `hunk` from `checks/`, and 3.13 cannot be written.'
    ea8c8b6722cf4cc8:
        hash: 3f6affa42aa98ac5
        text: 'Verify: with the flag true, every theme file the guarded modules generate is byte-identical to today, with the file list derived from 7.1''s enumeration rather than named here. Simplest sufficient form: compare the whole derivation-path set with the flag true against the 3.14 recording, which is the value in force at the end of phase 6, since 6.5 asserts equality against it and phase 6 makes no recording of its own. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds, which is what reaches the two `nixos/` modules below. An earlier draft said "the phase 6 recording", which names nothing. It covers all twenty at once in 6.5''s shape. An earlier draft named wezterm and neovim and stopped, gating two of the twenty modules 7.2 guards. The proposal''s Behavior criterion is unscoped and says theme files, and several unguarded-by-this-gate modules generate them: `sketchybar/default.nix`, `omp.nix`, `fastfetch.nix`, `fzf.nix`, `firefox.nix`, `zoxide.nix:34-38`, `llm/harnesses/pi/default.nix:104-106` with `:518`, `nixos/desktop/greetd.nix`, and `nixos/home/desktop.nix`. That list is illustrative and the gate does not depend on it, which is why it is worth stating what an earlier draft got wrong in both directions: `helix.nix:4` and `vivid.nix:4` were listed and generate nothing, each being a single line toggling a stylix target and consuming no colors, while `zoxide.nix` and the pi harness both read `config.lib.stylix.colors` and were missing. `borders.nix` and `zsh/default.nix` produce service arguments and environment variables rather than files, so they are excluded here. A guard at the wrong nesting level in any of them changes the true branch, which is what the owner looks at daily, and the old gate passed. Handing the residue to 7.5 is not a substitute: 4.3 already states this repository''s position, that a critic asking about it is not a gate.'
    eb5f6b9fdfd1d379:
        hash: 29df56c561d10b63
        text: 'Act: stop exposing `wtrun` to agents. Remove it from the rendered skill set so it is an owner command only. Do not reimplement it as a child process. `skills/wtrun/SKILL.md:47-56` documents five guarantees, and a child of an agent''s tool call keeps none of them. It also loses four properties, and those are not all in one section: a tty for `nh darwin switch` to prompt on and queueing through the worker shell are under Notes at `:58-66`, a lifetime past the tool call with a later `.rc` read is at `:40-42`, and something to watch is not documented as a guarantee anywhere. An earlier draft cited `:58-70` for all four, which overruns a 66-line file. The defect was never the pane. It was an agent opening one.'
    ee606db28f32609a:
        hash: 75cf8574138ca904
        text: 'Verify: the derivation-path set matches the 3.14 recording exactly, for both hosts, with an empty diff each way. Do NOT compare drvPath hashes here, which an earlier draft did. `drvPath` is order-sensitive: building `buildEnv` with `[hello jq]` and with `[jq hello]` yields different hashes, confirmed by running it. Task 9.4 replaces a literal package list with one derived from `bootstrap/tools.toml`, so unless the derived order matches the literal one element for element, every host hash moves while installing exactly the same packages, and the gate fails first on a correct implementation. Task 8.1 carries a smaller version of the same risk depending on whether `mkHome` shares the darwin specialArg plumbing or sits beside it, which 8.1 does not say. The set is not blind to a reordering, so 9.4 must preserve element order and says so; what the set adds over a hash is that it names which derivations moved, so a reorder reads as `-env.drv` entries changing while a dropped package reads as an entry disappearing. 2.12, 3.14, and 10.12 already use it. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds. This closes a three-phase hole. The temporal comparison tasks are 6.5, which checks against 3.14, and 11.1, which checks against phase 10''s re-record. "Temporal" because 6.6 also compares drvPaths, `minimal` against `workstation`, which is cross-profile rather than against a recording. Between them, phases 7, 8, and 9 have none. An earlier draft argued this by quoting what `grep -n ''drvPath'' tasks.md` returns, which was wrong when written and rots on every edit: it names nine tasks, not six, including 6.6, 9.4, and this task itself. Name the comparison tasks instead, since a re-record is not a check. The phase that matters is 9. Task 9.4 makes the `minimal` package group read the manifest, and every host installs it because `workstation` contains `minimal`, so a package dropped there is a silent loss on both hosts. Without this task that loss is re-recorded as the new baseline by 10.12 and then confirmed correct by 11.1, which is the failure 1.1 exists to prevent. Phases 7 and 8 are covered because covering them is free, not because they are equally exposed. 7.2 adds `sysinit.theme.enable` defaulting to true, and 8.1 and 8.2 add a builder attribute and new flake outputs that hosts do not evaluate through, because nix attrsets are lazy and an unforced `mkHome` never enters a host closure. An earlier draft of this task said in one sentence that hosts evaluate through `mkHome` and in another that they do not; the second is correct. If any of the three phases moves the closure contents, that is the finding, not a reason to waive.'
    f3adb4fff37c5c07:
        hash: 29afa1a9cb9bc7f5
        text: 'Act: add `modules/shared/options/profiles.nix` defining `sysinit.profiles.<minimal|dev|workstation>.enable`, each implying the one below.'
    f9b7041757bd694e:
        hash: 857d33932b6711be
        text: 'Act: delete `neovim/config/lua/harness/diffnote.lua` and its callers in `plugins/codediff.lua`. Delete the five `harness.diffnote` call sites at `:69-71`, `:87`, `:102`, `:121`, and `:128`, and the two keymap entries that contain them. Do not delete `:69-128` as a span: the file is 142 lines, that range ends inside the `<leader>dN` entry and leaves an orphan `end,` tail, and it also swallows the `CodeDiffFileSelect` wrapper, the `CodeDiffClose` restore, and the `<leader>dd` and `<leader>dH` keymaps, none of which is diffnote. This removes inline virtual text, the `<leader>dn` quickfix list, the `<leader>dN` float, and the fs watcher. That loss is the decision, not an oversight.'
    f80c73d18d189c67:
        hash: 00b4462c59d84ac4
        text: 'Verify: re-record the two host drvPaths. This phase adds a package on purpose, so name each difference by diffing the derivation-path sets against the 3.14 recording. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds.'
    fb9b571b87887951:
        hash: 16e5792314785536
        text: 'Act: delete `neovim/config/lua/harness/control.lua` and `neovim/config/bin/nvim-ctl`. In `harness/api.lua`, delete only the `harness.control` line at `:199`. Do not delete `:196-201`: that range is the whole of `M.setup`, and removing it breaks `harness.completion`, `harness.instance`, and the `harness.spec_watch` that 2.5 is editing in this same phase. Do NOT delete `config/doc/agent-ide-integration.md`, which an earlier draft did. `:51-55` is the only place in the repository that documents the two ways an agent discovers the editor socket, and deleting it in the same phase that decides what to do about those routes destroys the evidence the decision rests on. Rewrite it instead to describe what survives 2.7 and 2.8. Decided in design.md section 9: the entry point is a hand-placed skill this repository does not generate. The strongest reason is `ops.command` at `control.lua:297`, which runs an arbitrary `vim.cmd` on request.'
