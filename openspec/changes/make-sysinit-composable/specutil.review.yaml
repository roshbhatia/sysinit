    6fa9dd9549936d7a:
        hash: 2ffe47aec30cec42
        text: 'Verify: no agent-reachable path drives a terminal or an editor, EXCEPT the one this phase does not own, which is named below rather than left for a reader to notice. The second clause is a grep for a named set and NOT for zero, and an earlier draft made it zero: it required any nvim socket or msgpack reference under `pkgs/` to return nothing. No correct implementation of phase 2 can satisfy that, because the reference that remains is `internal/nvimlink`, and deleting it is task 3.6 in the next phase. `diffnote.go:195` calls `nvimlink.ShowNotes(root)` and `diffnote` is a subcommand agents run, so this genuinely is an agent-reachable path into the owner''s editor and it is genuinely still open when phase 2 ends. Say that plainly. Phase 3 owns it because nvimlink dies as part of the diffnote responsibility split, not as a coupling fix, and 3.4 removes the call sites before 3.6 removes the package. So the clause is: `rg -l` for `nvim\.Dial|go-client/nvim|nvimlink` over `pkgs` must return exactly three files, `internal/nvimlink/nvimlink.go`, `internal/nvimlink/nvimlink_test.go`, and `internal/diffnote/diffnote.go`. A fourth hit is a NEW socket route and fails the gate. After 3.6 the same command returns nothing, and that is where the zero form belongs. The first clause is a grep for a named set, not for zero. `rg -n ''cli send-text|cli activate-pane|cli split-pane''` over `modules/home/programs/llm pkgs` must return exactly three files: `skills/wtrun/wtrun.sh` (`:102`, `:107`, `:128`), which 2.4 makes an owner command; `runtime/agent-focus.sh` (`:20`, `:31`), which is the `$focus_exe` the owner-clicked branch calls and which 2.1 keeps; and the prose comment at `harnesses/pi/extensions/diff-review.ts:7`, which 3.8 rewrites in the next phase. Any fourth hit fails the gate. An earlier draft named `agent-prompt.sh` in the surviving set and read its `@CONTENTCLICKED` branch as the reason. That branch holds no `cli activate-pane`: it calls `"$focus_exe" "$pane" "$session"` at `:128-132`, and the file''s only hit is `:136`, which 2.1 deletes. So the old form demanded a hit that a correct implementation removes. Note the pattern is `cli send-text` and not `wezterm cli`: `agent-prompt.sh:136` invokes it as `"$wz" cli send-text`, so a `wezterm cli` pattern does not see the phase''s headline removal. The third clause cannot be a grep for nothing, and an earlier draft made it one. It required `rg ''wezterm cli|send-text'' modules/home/programs/neovim/config` to return nothing, which was written for the draft of 2.7 that deleted the wezterm control surface. 2.7 now keeps it on purpose, so that command returns hits in files the phase decides to keep and the gate could never go green. A gate that cannot pass gets waived, and a waived gate gates nothing. Replace it with a comparison against an expectation derived BEFORE the edits, not after them. Task 1.1 records `owner-wezterm-sites.txt` from `rg --no-line-number ''"wezterm"|wezterm cli''` over `modules/home/programs/neovim/config` with `-g ''!**/doc/**''`, minus the four lines this phase removes (`bin/nvim-ctl:140` and `:142` by 2.6, `utils/wezterm_terminal.lua:53` and `:57` by 2.8). 31 lines today, minus 1 for `doc/`, minus 4 removed, is 26. An earlier draft said 27, subtracting the removed lines but not the `doc/` line the same sentence excludes. Exclude `doc/` because 2.6 rewrites `agent-ide-integration.md` and its new text is not predictable inside an exact comparison. Run it without line numbers: 2.8 removes 41 lines above `wezterm_terminal.lua:100` and five surviving sites in that file sit below the cut, so a positional artifact fails on a correct implementation. Two earlier drafts also had the recording inside the phase: 2.7''s was written before 2.8 edited two of its lines, so it could never match, and 2.8''s snapshotted the post-edit tree and compared it to itself, so a site left behind would be recorded as correct and the gate could not fail. Run it from the repository root, with the tree as an argument, exactly as 1.1 writes it. This is not pedantry: `rg` prefixes each line with the path as given, so running the same pattern from inside `modules/home/programs/neovim/config` emits `./lua/harness/preview.lua` where the baseline holds `modules/home/programs/neovim/config/lua/harness/preview.lua`. All 26 matched texts are then identical and all 26 lines still differ, so the gate fails on a correct implementation and the diff reads as total drift. Observed while running this gate. At 2.9 the live command must equal that 26-entry set exactly. That fails when a site is left behind and it fails when a new one appears, which a grep for nothing does neither of once the answer is not zero. It must match the argv-table form, since nine of the fourteen sites are written that way and only five are string-form: `wezterm_terminal.lua:53`, `:57`, `:104`, `:165`, and `preview.lua:61`. An earlier draft said the old pattern saw four, a number left over from the draft that called the total thirteen; it returns eight lines over the config. The fifth clause is `rg -n ''"wezterm"'' pkgs/sysinit-agent` returning nothing, which is what proves 2.2 deleted the per-tool-call fork. Clause one cannot see it: the fork was `exec.Command("wezterm", "cli", "list", "--format", "json")`, so no `wezterm cli` string pattern matches it, and an earlier draft left the fork with no clause at all. Match the quoted word and not the bare word. An earlier draft required `rg -n ''wezterm'' pkgs/sysinit-agent` to return nothing, which no correct implementation can satisfy, because 2.2 KEEPS the OSC `SetUserVar` write and that code says in its own doc comment which terminal reads it. Eight prose hits survive a correct 2.2: `agentstate.go:1`, `:6`, `:26`, `:232`, the four comment lines where the removed fork is explained, and `agentstate_test.go:141`. A gate that cannot pass gets waived, which this task says twice about other clauses. The quoted form is the executable one: Go spells the argv head as a string literal, so `"wezterm"` matches the fork and no comment. The fourth clause is that the config still loads: `nvim --headless -c ''lua require("harness.api").setup()'' -c qa` exits 0. It must call `setup()` and not merely require the module: every reference to the affected modules sits inside a function body (`harness.control` at `api.lua:181` and `:199`, `harness.instance` at `:198`, `harness.spec_watch` at `:200`), so a bare require loads the file and runs none of them, and a missed edit throws on every editor start while the gate reads green. Nothing else in this phase would catch a lua file broken by 2.5, 2.6, 2.7, or 2.8. The neovim config is an out-of-store symlink, so nix never evaluates it and the derivation-path comparison at 2.12 cannot see it. Two earlier forms of this gate could not pass. One grepped for strings that miss `agentstate.go:329`, which forks `wezterm cli list` on every tool call. That fork must go, but NOT by substituting `WEZTERM_PANE`: it sits inside `paneWorkspace` and returns the pane''s workspace, not its id, and the id is already in hand at `:60`. The workspace becomes `id.session` at `:296` for every pane outside a seshy session directory, and `agent-sessions.sh:66` groups the whole rollup by that field, so dropping it collapses the deck to `default`. Do not cache it in the record either: a cached workspace is a per-pane fact under a bare pane id, so a reused id serves the previous occupant''s value, and `ui.lua` reads the workspace live on every tick (`:357`, `:731`) while `agent-sessions.sh` would group by the cached one, giving one pane two session names with nothing comparing them. Stop resolving the workspace in `agent-state` altogether. The record carries the pane id and the seshy-derived session when the directory supplies it (`agentstate.go:292-295`), and a reader that needs the workspace fallback resolves it live, which `ui.lua` already does and `agent-sessions.sh` can do from the `wezterm cli list` it already runs at `:38`. That removes the fork rather than amortizing it. The other spanned `modules` whole, which matches `zsh/integrations/seshy-wezterm.zsh:57`, `plugins/smart-splits.lua:2`, and `utils/terminal.lua:78`, none of which is agent-reachable and none of which this change touches. Each command is scoped to a tree this phase owns, so "reachable from an agent" is no longer a human judgment. This is the STOP gate for the phase.'
    6fbd7250287a8d70:
        hash: 5b0ee745ca916b7e
        text: 'Act: gate the 34 imports in `programs/default.nix` on the profile. The selector must NOT be the option 6.1 declares. `imports` is resolved before `config` exists, so reading `config.sysinit.profiles.*.enable` from an `imports` list is infinite recursion, and `lib.mkIf` inside each module still evaluates it and defeats the point. Pass the profile through `specialArgs` and `home-manager.extraSpecialArgs` instead, and let 6.1''s option read from it so a host still sets one value in one place.'
    7dadd6ca93d8b1e6:
        hash: dd02bc1d09ff233b
        text: 'Confirm: owner runs `home-manager switch --flake .#dev-x86_64-linux` on a Linux box or container and reports whether the shell and editor come up.'
    7f9ddb09bdae8a99:
        hash: d8ea10e252fd97ed
        text: 'Act: write the spec deltas this change owes. `agent-state-emission` keeps its OSC requirement because 2.2 reverses the deletion, so that one needs no delta. The behaviors with no spec today and a spec-worthy contract after this change are the note file and its derived export, and `review` as the reader. Add them rather than leaving a change that ships behavior no spec describes.'
    7f26868d48b4f45d:
        hash: c4335c95e262d6b0
        text: 'Act: leave `pane_agent_state` at `wezterm/lua/sysinit/pkg/ui.lua` alone. An earlier draft deleted `:330-348` as "the user-var path". That range is the whole function, and `:342-346` is the agent-deck fallback, which is the only status source for the seven harnesses that fire no hooks.'
    8e40dc578aec14d8:
        hash: 2aa97d087dfa6445
        text: 'Act: add `sysinit.theme.enable`, default true, guarding each.'
    8eeb560b2d77962d:
        hash: 725d03b21bac6cdc
        text: 'Verify: the two drvPaths are unchanged against the baseline as re-recorded at the end of phase 3, not against 1.1. Phases 2 and 3 moved it on purpose. This phase must not move it at all: it only reorganizes which module is selected, so any difference is a module silently dropped from a profile. This task covers phases 4, 5, and 6, since 3.14 is the last recording before it, and 9.9 leans on that span. The diagnosis above names a phase-6 cause because that is the likely one, not the only one: if phase 4 or 5 moved the closure, this is where it surfaces. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds.'
    9cbb625ee7282a92:
        hash: c766af02f12e1dac
        text: 'Act: make `spec_watch.lua` opt-in by deleting the unconditional auto-start at `spec_watch.lua:123`. The `:HarnessSpecWatch` command already exists at `:120-122` with its toggle at `:106-117`. That is not the whole edit, and an earlier draft said it was. `:124-130` registers a `DirChanged` autocmd whose callback is `M.stop()` then `M.start()` with no guard, so deleting `:123` alone means the watcher restarts itself on the first directory change, including one the owner toggled off. Gate that callback on `M.is_active()` (`:58-60`) so it restarts only what was running. The criterion in the proposal cannot catch this on its own: a fresh editor that never changed directory passes with the defect present. An earlier draft also cited `:19-27`, which is the `watchable(path)` filename predicate and not the watcher.'
    9d877999fe7d918e:
        hash: 2b39a7814b2880bb
        text: 'Act: give the pane record a liveness rule at read time, and do not make it a time bound. The archived change chose user vars partly because a file "reintroduces exactly the stale-entry pruning problem" (`archive/2026-07-08-surface-agent-session-state/design.md:49-59`), and claude and pi wire `agent-state ... exit` and codex and opencode do not, so a crashed or exited codex reads `working` forever. But an age bound reaps the wrong records first. `since` is republished on every tool call, so it is a heartbeat only while tool calls happen, and `waiting` and `done` are turn-terminal: nothing rewrites them until the owner acts. A bound would expire the two states the deck exists to show while a long `working` build kept refreshing. Do not record the writer''s pid either. `agent-state` is a one-shot: `agentstate.go:104-108` publishes and returns, so its pid is dead microseconds later and every record would read absent. That fails closed on the common path, which is worse than the stale record it replaces. The parent pid is no better, being a transient shell for claude and codex and the long-lived runtime for opencode and pi, so the field would mean two things.'
    9eb96b51aedcc7d3:
        hash: 4dfdb7e58b9250b8
        text: 'Verify: build all six configurations 8.2 emits, not one, each at `.#homeConfigurations.<profile>-<system>.activationPackage`, which is the buildable attribute and the one the proposal names as deciding its Behavior criterion. A missing `values` leaf fails per module, and which modules are imported depends on the profile and the system, so a leaf read only by a `dev` module is invisible to a `minimal` build and a leaf read only by a Darwin module is invisible to a Linux build. Profile crossed with system is where the 8.5 failure hides, and an earlier draft sampled one cell of six. It is a loop over an attribute list and no new mechanism; the three `aarch64-darwin` cells build natively and the three Linux cells build on the CI runners per 1.1.'
    10ca3b2b10cc27ec:
        hash: 8ffad86d15e2acb4
        text: 'Verify: the `agent-identity.sh` fork does not run when a cheaper source answers. Put a stub named `wezterm` first on `PATH` that appends to a marker file and exits non-zero, set `ZMX_SESSION`, source the file, call `agent_identity` with a non-empty pane argument, and assert it resolves the session AND the marker file is absent. Then unset both earlier sources, call it again, and assert the marker file now exists. Source and call; do not run the file. An earlier draft said "run the script" and there is no script: `agent-identity.sh` defines two functions and nothing else, so executing it defines them and exits, producing no marker in either half and passing half one for the wrong reason. Both halves are needed: the first proves the gate is there, the second proves the gate did not become a deletion, which would take the fallback away from the readers 10.6 says must keep it. This is a behavioral check because the property is control flow and the gated call has the same text as the ungated one, so no grep distinguishes them. Source `agent-identity.sh` directly in the test shell. Do NOT put the stub on the `PATH` of `agent-notify` or `agent-prompt` and run those: the stub is unreachable there and both halves of the check break in opposite directions. `agent-identity.sh` is never installed as a program. `rg -n ''agent-identity''` returns one hit outside `openspec`, `runtime/default.nix:103`, which reads it into a string that is concatenated into two `writeShellApplication`s, and both list `pkgs.wezterm` in `runtimeInputs` (`:132`, `:157`). `writeShellApplication` prepends `runtimeInputs` to `PATH` ahead of the inherited one, so `command -v wezterm` at `:4` returns the store binary and the stub never runs. Half one would then find the marker absent because the stub was unreachable rather than because the gate worked, which is a pass on the exact defect it targets; half two would find the marker missing forever and fail on a correct implementation. Sourcing the file works because it is a function library with no top-level side effects, so `:4` executes as written and `PATH` decides. Overriding `runtimeInputs` in a test derivation is the other correct form. Pass a non-empty pane argument in both halves, or `ai_workspace` returns at `:3` and the second half asserts a marker that could never appear. Run the test shell without `errexit` and `pipefail`, to match production. Only two applications embed this file, `agent-notify` and `agent-prompt`, and both set `bashOptions = [ ]` (`runtime/default.nix:134` and `:160`; the embeds are `:135` and `:167`). An earlier draft cited five sites, which is every `bashOptions = [ ]` in the file and three more than the claim needs. The stub exits non-zero, so a harness with those options aborts the caller at the pipeline on `:6-8`. The marker assertion would still hold, since the stub writes before it exits, but nothing after the pipeline would run.'
    10cf93db5f2224ba:
        hash: b49ed96f27885d9b
        text: 'Act: decide what the workspace rollup and its renderers display, not what key the rollup groups by. Say "rollup" and not "agent deck": `agent-deck` is a third-party wezterm plugin loaded at `ui.lua:84` through `plugin_loader.load`, patched here by `wezterm/patches/agent-deck-idle-detection.patch`, and its API is `get_all_agent_states` (`:153`, `:203`, `:353`, `:724`). The code this task edits is the sysinit-owned rollup at `:350-405`, which consumes the plugin''s output at `:353`. An earlier draft said "agent deck", which points an implementer at vendored upstream code the repo rule forbids editing. The record keeps one name field, `session`, which is the one fact its writer owns. The workspace stays a reader-side fact each surface resolves for itself. An earlier draft added a second `workspace` field to the record so each surface could read the one it wanted. That field has no writer. `agentstate.go` is the sole producer, with the record directory at `:65`, and 2.2 deletes `paneWorkspace` at `:321-346`, its call at `:288`, and the fallback at `:296-298`, which were the only way it could learn a workspace. `design.md:69` already says why nothing cheaper exists: no environment variable carries the workspace. So the writer would emit an empty field on every record, and filling it means restoring the fork, which fails 2.9''s fifth clause. The readers already have their own answer: `ui.lua` takes it from the mux at `:357`, and `agent-sessions.sh` runs `wezterm cli list` at `:38` anyway. What to change. the rollup at `:350-405` groups by `win:get_workspace()` at `:378` and `:389` and never reads the record''s `session`. An earlier draft cited `:377` and `:388`, which are a closing brace and an `if`. Keep the grouping and make the group display the session names of the panes in it, so a deck group named for a workspace still shows which zmx sessions are inside it. This does not require the `ui.lua` restructuring the non-goals forbid, and the reason is worth naming so an implementer does not reach for one. The function already builds a flat `panes` array at `:365-377` carrying one entry per pane with `workspace` on it at `:369`, alongside the collapsed `sessions` table, so the grouping structure needs no change. The session name is not there yet, and an earlier draft said it nearly was. That draft cited `:369` for the `repo` derivation, which is `:370`, and called it the same mechanism as reading the record, which it is not: `pane_repo` at `:276` resolves from the pane in memory, while `read_pane_git` at `:294` opens the record file. This function makes no per-pane file read at all today, and says so in a comment at `:371`. So the edit is one more field on that constructor plus a per-pane `read_pane_git` call plus a render change. Why display and not key. Three surfaces read the record''s `session` and two are not wezterm. The sketchybar widget `agent_sessions.lua:14-16` shells out to `agent-sessions` for the macOS menu bar, and `desktop.nix:333-338` wires it as a waybar module. A workspace key is defensible for a workspace-scoped display, and a global menu bar is not one. Leaving the deck to show only a workspace name ships a screen where the tab bar says `default` and the menu bar says the zmx session name, for the same agent, at the same moment. That is still not the rewrite the non-goals forbid, and there is a working shape to copy: `session_tree` at `:723` already does this exact read at `:768-769`, the only call site besides the definition, and `rollup_cache` at `:407-414` already throttles the rollup that would carry the cost. Name all four sites, because the producer is not enough. `panes` reaches one consumer of three: `:1288` destructures `local sessions, panes`, while `:848` and `:889` take the first return only. The collapsed entry at `:389-394` is `{status, reason, since, rank}`, its four fields on `:390-393`, and carries no name, so the tab bar at `:889`, which reads `sessions[entry.name]` at `:898`, cannot see a field added to `panes`. The tab bar is this task''s own example of the defect, so either add a names field to the collapsed entry at `:389-394` or change `:889` to take both returns. An earlier draft said the edit was one field plus a render change and named neither renderer.'
    21edbdc25906adfa:
        hash: 0552f5e4d2828c57
        text: 'Act: ship `review`, a command that runs `hunk diff --agent-context <notes>` for the current repository. Do not ship a wrapper named `hunk`. An earlier draft did, and it broke the change''s own non-goal at `proposal.md:187-188`: a script named `hunk` that wraps `hunk` is one name for two things, it collides with `pkgs.hunk` on `bin/hunk` in a single home profile, and it leaves `which hunk` unable to say which ran. A separate verb composes instead of shadowing. `review` passes its arguments through, so `review --watch` reaches `hunk` with the context flag still applied. It fails loudly when `sysinit-agent` is missing, because silence there is indistinguishable from "no notes" and that is the ordinary case on the non-Nix path phase 9 builds. It must fail the same way when the record exists and the export does not, naming 3.5''s rebuild verb in the message. That state is not hypothetical: it is the state every box is already in the moment this change lands, because a record written before it has no export. Nothing calls the rebuild on its own, and the phase STOP does not catch this, because its clause writes a note first and writing a note republishes the export. A repository that never had a note is a different case and must not fail. There is neither record nor export, and that is the ordinary state of a clean repository, so `review` shows the diff with no context and exits 0. That matches the repository''s own precedent: `cmdList` (`diffnote.go:549-561`) treats an absent store as success and prints an empty document. `review` distinguishes the two cases by stating our own files, which it can do without help. What 3.1''s probe of a nonexistent path decides is how the no-notes branch is implemented: pass the missing path through, omit `--agent-context`, or synthesize an empty export.'
    22ac23d3e1538eb6:
        hash: 158b1fef05435de6
        text: 'Verify: the two host drvPaths still match the phase 10 re-recording, which is the last one, since phase 10 adds a package and phases 4 through 9 are closure-neutral. Separately, enumerate what phases 2, 3, and 10 changed by diffing the derivation-path sets against 1.1''s, and confirm every entry is named in a task of one of those three phases. A `drvPath` is one opaque hash: it answers equal or unequal and cannot be diffed into a list, so an earlier draft asked for an enumeration the named artifact cannot produce. The `lv426` half runs locally and the `arrakis` half runs in the CI job 1.1 adds. An unexplained entry is a silent loss.'
    25d496c4980eba74:
        hash: bc63c58f9522fda1
        text: 'Act: split `packages.nix` into named groups behind the profiles, keeping every current package.'
    25eca985d82cf1d4:
        hash: 659fe3375458d0ad
        text: 'Act: enumerate the hand-kept lists first, and write the enumeration into the change as a file with one `path:line` per list. The proposal''s count of fourteen is an estimate, so the enumeration replaces it and the enumeration is what the next task tests. A list qualifies when adding a harness requires editing it; a site that branches on one harness name does not qualify. Start from what `rg -n ''"(claude|codex|opencode|crush|goose|gemini|cursor|devin|amp)"''` reports over `modules/`, and record for each site which of the two it is. Do not carry a count into this task: an earlier draft said 24 sites in nine files and the command returns 127 matches across 31 files, which is the point of enumerating rather than counting. Then add one harness registry replacing the qualifying lists, and delete the seven `throw` assertions that existed to police them (`llm/default.nix:190` and `:192`, `runtime/default.nix:64`, `:73`, `:75`, `lib/instructions.nix:145`, `harnesses/pi/default.nix:75`).'
    27fff53ff2502243:
        hash: 5cc0549d65298332
        text: 'Confirm: owner uses an agent for one session and reports whether anything they relied on is now missing. The owner directed on 2026-08-08 that this be tested mechanically instead, so record what was and was NOT covered rather than claiming the session happened. Exercised: the whole `lv426` system builds; the full neovim config starts with no error; all 13 surviving harness keymaps resolve and `<leader>jC` is gone; the three deleted lua modules no longer resolve and the seven kept ones still load; `spec_watch` is off at startup and a `DirChanged` does not resurrect it; `agent-state` writes a record and `agent-sessions` groups it under the live workspace with no fork; the OSC user var still decodes to `status|reason|since|agent`; an alerter answering `Accept` drives no pane and `--actions` is no longer passed; click-to-focus still fires; `gemini` now reaches the rich alerter that the deleted keystroke table used to gate; the built system ships the `wtrun` binary and no `wtrun` skill. NOT covered, and this is the residue the owner still carries: whether daily use turns up something none of those probes name. That surfaces on the next `nh darwin switch`, not here. Record, rather than claim absence, that agent paths to a pane survive this phase. `wtrun` stays on `PATH` by construction because 2.4 makes it an owner command (`skill-tools.nix:31-34`, independent of `skills/render.nix`), and what 2.4 removes is the description and the `allowed-tools` grant at `skills/wtrun/SKILL.md:3`. The allowlist default is ask, not deny (`lib/allowlist.nix:296`, `:300`, `:305`), so an agent that types it gets a prompt. Under pi it gets nothing: `harnesses/pi/default.nix:487` sets `yoloMode = true` and `lib/allowlist.nix:289-290` emits no entries at all. And any harness with a Bash tool can call `wezterm cli split-pane` directly, which this repository cannot prevent. Removing the advertisement is the largest reduction available and it is not a fence.'
    51b75ac14185cee9:
        hash: 5b313fde66e3f766
        text: 'Act: write the paths manifest during bootstrap by expanding `$HOME` into 4.1''s layout template, so a box with no Nix resolves state paths from the same source every other consumer reads. Do not author the paths here: a second producer in a second language is the defect phase 4 removes, and 4.3''s check would fail on this script. Task 4.1 allows each consumer one documented default keyed to the manifest being absent and hands the installing to this task; without it that default is the permanent path on every non-Nix box and 4.3''s check has nothing to prove. This is the paths manifest, not `bootstrap/tools.toml`, which the rest of this phase calls the manifest.'
    63dcc2ff447cc0a8:
        hash: bd7f2b0e2197c36c
        text: 'Act: fix the orphan and decide the `$EDITOR` shim. `plugins/harness.lua:25` binds `<leader>jC` to `harness.api.walkthrough_clear()`, which calls into the `control.lua` that 2.6 deletes, so that keymap and its api entry go too. Separately, `utils/wezterm_terminal.lua:54`, inside the `EDITOR_WRAPPER` heredoc at `:46-58`, runs `nvim --server ... --remote-expr` naming a lua module inside the running editor. That is the same construct as `internal/nvimlink`, which this change deletes and design.md calls Feature Envy across a process boundary. An earlier draft kept it, on the reason that the owner runs `git commit` and the shim is what makes it open in their existing neovim. That reason does not survive its own evidence. The owner''s shell never sees the shim: `modules/home/default.nix:41` sets `EDITOR = "nvim"` for the whole home configuration, and the shim is installed only by `editor_env` at `wezterm_terminal.lua:72-87`, which `_spawn` merges into every pane it creates at `:96`. Every path through `_spawn` spawns an agent CLI into a new pane, so the shim reaches agent panes and nothing else. An earlier draft said every caller is a harness adapter or `harness/lifecycle.lua`, which is false and contradicts 2.7''s own consumer list: `plugins/claudecode.lua:26` and `plugins/opencode.lua:17` are neither. `harness/preview.lua` never reaches `_spawn` at all, having its own inline split at `:61`, so `<leader>jp` never gets the shim. There is no owner path to it. It is a pure agent route, and it is the composite this phase exists to remove: `:53` activates the owner''s pane, `:54` drives the owner''s editor, and `:55` blocks the caller until the owner writes the buffer. Delete `EDITOR_WRAPPER` at `:46-58`, `editor_wrapper_path`, `editor_env`, and the merge at `:96`. Also delete `utils/remote_editor.lua`, whose only caller is that heredoc. Record the consequence rather than hiding it: an agent that runs `git commit` with no `-m` now opens nvim nested inside its own pane, which is worse for the agent and is the point, because the cost lands on the process that chose to open an editor. Record the decision in `design.md`.'
    66e1cff3b8882193:
        hash: c36bc606360522f2
        text: 'Act: write `bootstrap/verify-container.sh`, the script this phase''s STOP gate runs. Write it before the bootstrap it verifies, so the gate is not authored by the thing it judges.'
    80fdb74c829cc73a:
        hash: b9f1623421c605d0
        text: 'Act: make `ZMX_SESSION` the session key wherever a fork is what it replaces. Two files, and they are not symmetric, because phase 2 already changed one of them. In `agentstate.go`, `identify` resolves the seshy directory and then `ZMX_SESSION`, and stops. There is no workspace branch to sit behind: 2.2 deleted `paneWorkspace`, its call at `:288`, and the fallback at `:296-298`, and moved that resolution to the readers. An earlier draft described this file as it is today, said "do not delete the workspace fallback", and would have had an implementer restore `exec.Command("wezterm", "cli", "list", ...)` into `pkgs/sysinit-agent`, failing 2.9''s fifth clause and reversing the phase 2 removal the proposal calls the one that matters. In `runtime/agent-identity.sh` all three sources stay, because that file has readers with no other way to answer. Order them seshy directory, `ZMX_SESSION`, then workspace, and move the `ai_workspace` call at `:16` so it runs only when both earlier sources are empty. The line a test has to beat is `:4`, `ai_wz=$(command -v wezterm ...)`, which is where the binary is resolved. That fork at `:6-7` is `"$ai_wz" cli list --format json` at `:6`, piped through `jq` to `:8`, the shell twin of the Go fork 2.2 deletes, and today it runs on every call made from inside wezterm. Not on every call without qualification: `ai_workspace` returns at `:3` when the pane argument is empty, and both callers pass `${WEZTERM_PANE:-}` (`agent-prompt.sh:61`, `agent-notify.sh:22`), so outside wezterm it already does nothing. Moving the call is safe for consumers, which is worth stating because deferring a variable usually is not: `AI_WORKSPACE` has no reader outside this file, only the fallback at `:26-27`. No clause of 2.9 can see it: clause one''s pattern is `cli send-text|cli activate-pane|cli split-pane` and clause five is scoped to `pkgs/sysinit-agent`. Do not widen 2.9 to cover it. An earlier draft of this task said to add a clause whose pattern includes `cli list`, and that is wrong twice over. `cli list` matches six files under `modules/home/programs/llm`, and five of them fork it correctly and on purpose: `skills/wtrun/wtrun.sh:21` and its `SKILL.md:47`, which 2.4 keeps as an owner command, `runtime/agent-sessions.sh:38`, which 2.2''s repair depends on, `runtime/agent-review.sh:117`, and `runtime/agent-focus.sh:26`, which 2.1 keeps. So the pattern is not a signal of the defect, and adding it turns clause one from a three-file set into an eight-file set, which is dilution rather than coverage. The deeper error is the instrument: what 10.6 changes is when the fork runs, and that is control flow. No grep can see it, because the gated call and the ungated call have identical text. Task 10.9 checks it by behavior instead.'
    88cdf7ff001ff195:
        hash: 8100e586c4378baf
        text: 'Verify: `neovim/config/lua/` has no remaining reference to any sysinit binary or state path, so the config is standalone. Scope this to the whole lua tree, not `harness/` alone: 3.7 edits `plugins/codediff.lua`, which an earlier draft''s scope excluded, and three of its call sites sit inside `pcall` (`:68-72`, `:86-88`, `:101-103`), so a missed one fails silently on every CodeDiff open rather than throwing. Load the config headlessly here, since no other gate in the phase does.'
    91b41c9e4d335201:
        hash: 2d46c29242826290
        text: 'Act: mirror the native transcript into `agents/transcripts/<harness>/<session>.jsonl` for claude only. Claude is the one harness whose hook payload carries `transcript_path`. An earlier draft named four, which the evidence does not support: opencode''s payload is typed `{ type, properties: { sessionID, status } }` (`plugins/sysinit-notify.ts:28-35`), pi''s handlers carry `toolName` and `input` and no transcript reference (`extensions/sysinit-notify.ts:31-53`), and codex''s three hooks are fixed argv that read no stdin (`harnesses/codex.nix:151-186`). Codex, pi, and opencode join the uncovered set, making it ten of eleven. If that is worth changing, the fix is a probe in the shape of 3.1: run codex with a hook that dumps its stdin and record what is actually there. Do not assert it. Record the repository next to the session, so 5.1''s viewer can resolve a transcript from the current directory. Without it the transcript is reachable only by harness session id, which the owner does not know.'
    96e6971ec58b3935:
        hash: d3fc4240131fee8c
        text: 'Act: reconcile the namespace the two joins share. This is a key decision and lives apart from 10.7, which decides display. An earlier draft merged them, and 10.5 could then draw no correct edge: it needs this half and not the other, and the merged task''s own first line says it decides display and not key. There are three name producers today: `selected.json` holds `mux.get_active_workspace()` (`ui.lua:183`, written at `:192`, read at `agent-sessions.sh:19`), a wezterm workspace name; the record''s `.session` (`agent-sessions.sh:66-67`, defaulting to `default`), which this phase changes to a zmx name; and `sy list` (`agent-sessions.sh:78`), seshy names. Two joins consume them. `agent-sessions.sh:98` computes `$names - ($active | map(.name))`, seshy names minus record names, so if the two namespaces diverge the subtraction removes nothing and every live session is emitted twice, once in `$active` and once in `$idle` with `status: null`. `desktop.nix:343` computes `.name != $sel`, a record name against a workspace name, so on divergence the selected session fails to exclude itself from the `+N` badge. Decide which producer wins, and settle both joins with that one decision. They do not share a producer pair: `:98` joins producer 3 against producer 2, while `desktop.nix:343` joins producer 2 against producer 1, the workspace name in `selected.json`. So reconciling `:98` alone leaves `:343` still comparing a session name against a workspace name, and the selected session still fails to exclude itself from the `+N` badge, which is a thing 10.5 asserts directly. A set difference across two namespaces is meaningless whatever it returns, and so is an inequality test. Land the second half in `agent-sessions.sh` and not in `desktop.nix`. `desktop.nix:342` binds `$sel` from `.selected` in the payload it is handed, so it consumes the name and cannot resolve it. The value is built at `agent-sessions.sh:19` from `selected.json`, which `ui.lua:192` writes, so those two are the only places the reconciliation can go. `agent-sessions.sh` is the better of them, because the sketchybar widget reads the same `selected` field from the same payload (`agent_sessions.lua:30`), so one edit there settles both surfaces where an edit in `desktop.nix` would settle one. An earlier draft named both joins and instructed on one, and a later one offered `desktop.nix:343` as a place to resolve `$sel`, which sends an implementer to a consumer.'
    156a26319cd78690:
        hash: 384048be6f8331cd
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on 8.1''s split between the paths `mkHome` defaults and the paths it takes as arguments. Point them there and not at a missing specialArg, which 8.3 now catches mechanically across all six cells. The six builds exercise the defaults only, so a wrong default fails the build and a wrong argument does not. What is left is a judgment: which facts a standalone home configuration may invent about a machine it has never seen.'
    295b992e16a7a22e:
        hash: 4cddfdf9936b5f09
        text: 'Adversarial review (`adversarial-review` skill): run deterministic lint. Critics are NOT run: the owner directed on 2026-08-08 that the apply proceed on deterministic lint alone, so every task in this list reaches the `not run` terminal state the skill defines and records the open questions rather than refuting them. The questions below are what critics WOULD have been asked, kept because they name where this phase is weakest on the whole diff, asking what a profile smaller than `workstation` silently loses that nothing asserts.'
    394e187b6c1f1819:
        hash: e3e76e86b3c36a45
        text: 'Gather: probe the installed `zmx`, not its README, in the shape of 3.1. Record the environment variables it sets, and specifically whether a child process spawned inside a session inherits `ZMX_SESSION`. Also record whether `ZMX_SESSION` carries the `ZMX_SESSION_PREFIX` that 10.4 sets, since that string shape decides 10.8: if the variable is prefixed and `sy list` names are not, the two sides of `agent-sessions.sh:98` still differ by a prefix after both are drawn from the seshy namespace, and 10.5''s scoped-to-the-prefix comparison needs the same fact. Also record whether `mise` can install zmx, which 10.2 needs to choose a package group: decision 6 makes `minimal` and the non-Nix manifest the same list, so a `minimal` member has to be installable without Nix. The whole argument for the dependency is that this key is readable with no fork and no terminal, and an earlier draft asserted it from documentation. zmx is the only third-party dependency in this change with no probe, which is the standard 3.1 sets for the other one.'
    483af23337d532d7:
        hash: 12e6a1259296fd06
        text: 'Act: remove the gate scaffolding in the same commit that archives the change. Delete `.github/workflows/closure-baseline.yml`, `hack/host-baseline.sh`, and `openspec/changes/make-sysinit-composable/baseline/`. This is its own task because nothing else closes the loop: archiving moves the change directory under `openspec/changes/archive/`, and the workflow diffs against paths inside it, so the job breaks on the archive commit. Same commit, not a follow-up, or there is a window where the workflow points at a path that no longer exists. 11.1 is the last consumer of the baseline, which is why this depends on it rather than running earlier. Keep `hack/host-baseline.sh` only if something outside this change has adopted it by then; check before deleting.'
    534cb567ffce7559:
        hash: c5a4ff938eec7ff1
        text: 'Verify: with the flag false the home modules evaluate without the stylix module present.'
    767ee7db08d9a2f2:
        hash: a86cf65cbc85917e
        text: 'Act: rename `internal/diffnote` to `internal/note` and remove only the neovim paths from it. Keep `add`, `apply`, `list`, `clear`, and `path`, and keep `--rationale`, `--author`, and `--replace`: task 3.1 establishes that hunk has no field for them, so deleting them loses data. Delete `--no-open` and every call into `nvimlink`. Keep `internal/store` byte for byte.'
    863e98c306019ecf:
        hash: 729d5279285e859b
        text: 'Act: keep the OSC `SetUserVar` write in `internal/agentstate`. An earlier draft deleted it. That was wrong twice over: a program reporting its own status to its own terminal is self-report, not remote control, and `archive/2026-07-08-surface-agent-session-state/design.md:49-59` already chose it over a per-pane file for a reason this change does not answer. A user var dies with its pane. A file does not. Claude wires `agent-state ... exit` (`claude/default.nix:236`) and so does pi, through `state("exit")` on `session_shutdown` (`pi/extensions/sysinit-notify.ts:51-53` into `:26-28`). Codex and opencode do not, so they leave a record reading `working` forever, and a crash does the same for all four. Record the reversal in `design.md`. In the same file, delete the workspace lookup: `paneWorkspace` (`agentstate.go:321-346`), its call at `:288`, and the workspace fallback at `:296-298`. That is the per-tool-call fork of `wezterm cli list`, which the proposal calls the terminal coupling that matters, and an earlier draft left it in 2.9''s justification prose with no Act task and no edge, so it could survive the phase with the gate green. Repair the reader in the same task rather than leaving it to a later one: `agent-sessions.sh:63-66` falls back to `sess="default"` on an empty session, so removing the writer''s workspace without changing the reader collapses the deck to one group. Resolve it live there from the `wezterm cli list` the script already runs at `:38`. `ui.lua` already resolves it live (`:357`, `:731`) and needs nothing. `deps:` 1.1'
    1386a98c7eca8f90:
        hash: e9c1dfc973d5b6c0
        text: 'Act: add `zmx` to the `dev` package group and a `modules/home/programs/zmx/` module owning `ZMX_SESSION_PREFIX` and `ZMX_DIR`. Name the group, and give the reason from decision 6 rather than from a later task. An earlier draft said to pick `dev` "because 10.3''s fallback argument depends on it", which chooses a group to keep an argument true and is circular: 10.3''s fallback holds on its own terms, since any box without zmx needs `s` to keep working. The real constraint runs the other way. Decision 6 makes `minimal` and the non-Nix manifest the same list, so anything in `minimal` must be installable by `mise` on a box with no Nix. 10.1 answers that; read its result here. If zmx turns out to be `mise`-installable, `minimal` is the better group, and 10.3''s fallback is unaffected either way. State the taxonomy cost plainly. Decision 6 defines `dev` as `minimal` plus language toolchains and their servers and formatters, and a session manager is not one, so `dev` is a poor fit by category. It is not a shell-group fit either: `packages.nix:66-70`, which decision 6 calls the shell group, is `bash-language-server`, `shellcheck`, `shfmt`, `gum`, and `grc`, which is shell tooling rather than session tooling. So put zmx in `dev` and widen that group''s stated meaning in `design.md` to "toolchains plus session tooling". Only the wording is open. An earlier draft also offered adding a fourth group, and that option is not reachable from here: 6.1 authors `sysinit.profiles.<minimal|dev|workstation>.enable` with each implying the one below, so a new group edits that option and its implication chain, and phase 6 closed behind two drvPath gates at 6.5 and 6.6 that nothing re-runs. Offering a branch that costs a reopened phase invites an implementer to take it. Do not leave the taxonomy widened silently, which is how a profile stops meaning anything and is the failure 11.4 asks a critic to look for. It is in nixpkgs at 0.6.0 and evaluates against this repository''s pinned nixpkgs, so it needs no flake input and no overlay entry. The phase 4 paths manifest owns the zmx state directory and this module reads it from there; the module owns both variables. An earlier draft put both in the manifest and gave one reason for it, that `ZMX_DIR` is a state path, which is not true of a namespace string. Design decision 4 already draws this line: the manifest owns the prefix, the consumer owns the identity under it.'
    3256e48db638900e:
        hash: a5bded800e10bce4
        text: 'Verify: a note written AFTER `review --watch` is already running either reaches the viewer within 5 seconds or does not. Run it as an experiment, not as a disjunction an edit to `design.md` can satisfy: confirm the note is absent in the running viewer first, write it without touching any tracked file so a working-tree re-diff cannot be mistaken for a context re-read, and bound the wait. A miss at 5 seconds is not an absence: re-observe at 60 seconds and after a focus change before concluding, or a poller on a long interval gets recorded as never and the design tells the owner to re-run `review` for nothing. Write the outcome to a file in the change folder, because the phase STOP cites it and a STOP clause needs an artifact rather than a memory. Make `design.md` match. Every earlier draft wrote the note before the viewer started, so the one property the no-push decision rests on was asserted in prose and checked nowhere.'
    5415ae64d993cea8:
        hash: 6e9466ac99126f1d
        text: 'Act: make `s` in `zsh/integrations/seshy-wezterm.zsh:20-34` attach a zmx session named for the seshy session, rather than only `cd` into its directory at `:33`. Edit `s` alone. An earlier draft named `si` as a second site; `si` (`:40-48`) is an fzf picker that resolves a name and calls `s` at `:47`, so it inherits the change and editing both would attach twice. Keep the `cd` as the path taken when `zmx` is absent, because phase 9 builds a box that has neither zmx nor Nix and `s` has to keep working there.'
    7293f1204c5765b0:
        hash: f2f706f7b207630d
        text: 'Verify: `nix path-info -S` on `minimal` is smaller than on `workstation`, and the `minimal` and `workstation` drvPaths differ from each other. Both clauses are the STOP gate, not 6.5 alone. `drvPath` is input-addressed, so a gate that only checks `workstation` equality passes when the profile layer was never wired: an `optionals` expression that yields the same list for every profile is identical to no profile layer, and 6.5 cannot tell them apart. This is the one gate that keeps `nix path-info -S`, because a size is the point here rather than a set of names, and it is also the one gate that needs realized paths. Run both profiles for `lv426` locally, where the closures already exist.'
    69177f9d23193118:
        hash: a3a04d94989e8e69
        text: 'Verify: the surfaces agree by name. There are two keys and three surfaces, and an earlier draft said two of each. `agent-sessions` is one producer with three consumers: itself, the sketchybar widget, and the waybar module, all inheriting the record''s `session`; the wezterm deck is the one surface on the workspace key, which it resolves itself. Run two agents in two zmx sessions in one wezterm workspace and assert that `agent-sessions` and the sketchybar widget both report two entries under the zmx session names, and that the deck shows one group named for the workspace containing both of those same session names. An earlier draft checked cardinality per surface without comparing names across them, which passes while two displays disagree. Also confirm an agent in a pane with no `ZMX_SESSION` still resolves, through the readers 2.2 moved that fallback to.'
    79395f47d2989035:
        hash: 6452969bc02c62b3
        text: 'Act: add `bootstrap/tools.toml` as the `minimal` profile''s own manifest, naming each tool once with its nixpkgs attribute and its mise identifier. Decided in design.md section 6: the ephemeral-box set and the `minimal` profile are the same list, so there is no second list to drift from.'
    97880f50952ba9e8:
        hash: eb950bf0e5480019
        text: 'Verify: the behavior this phase promises is that one place owns each state path, decided by a check that fails when `.local/state` appears outside the paths module. 4.2 covers `ui.lua` alone, and the promise has no other gate, which leaves the phase''s own stated failure mode undetectable. Add the check as a pre-commit assertion over the whole tree, counting occurrences per file rather than banning the string outside two files. One occurrence carrying the `sysinit:documented-default` token 4.1 defines passes; a second in the same file, or any unmarked occurrence, fails. An earlier draft said "the documented-default marker" and no task made one, so the check could not be built as specified. The token is bare rather than a comment form because 4.1 spans five languages whose comment syntax differs, `//` in Go, `#` in shell, python, and YAML, `--` in lua. The token survives into generated scripts, and the one placement that loses it is worth stating. `modules/lib/shell.nix:3-12` is `stripHeaders`: `:9` builds `isHeaderLine` from the two prefixes, then `:10` filters with the negation, so it removes the shebang line and the `shellcheck disable` line and keeps every other line, ordinary comments included. An earlier draft read `:9` alone and said the function keeps those two, which inverts what it does and sends an implementer looking for a stripping hazard that is not there. The real residual is narrow: a token written on a line that begins with `# shellcheck disable` goes with that whole line. Put the token on its own line or at the end of the code line, never appended to a shellcheck directive. A two-file allowlist cannot work, and an earlier draft used one. Task 4.1 requires each consumer to keep "exactly one documented default, keyed to the manifest being absent", because phase 9 builds a box with `go install` and no Nix where a consumer with no default cannot resolve a path at all, and 9.7 depends on that clause. So the check would fire on all twenty-four consumers this task lists, every one of them correct. 4.1 is load-bearing and cannot be the side that moves. The allowlist survives for unmarked occurrences only, and its two entries are `modules/shared/options/paths.nix` and the layout template 4.1 defines, which 9.7 expands on a box with no Nix. Those two are the producer; everything else is a consumer. Derive the site list from the tree rather than from a hand-written set: an earlier draft named eight and the real count is over twenty. A literal grep for `.local/state` outside tests and outside the `ui.lua` sites 4.2 owns returns `modules/home/default.nix:24`, `seshy/config.yaml:5`, `skills/wtrun/wtrun.sh:13`, `config/render-skills.sh:6`, `worklog-hook.py:253` and `:327`, `runtime/agent-identity.sh:18`, `agent-review-suffix.sh:7`, `sy-gate.sh:43`, `agent-busy-panes.sh:6`, `agent-notify.sh:73` and `:83`, `agent-sessions.sh:1`, `agent-refine.sh:1` and `:2`, `worklog-query.sh:4`, and `bin/nvim-ctl:30`, which 2.6 deletes. `worklog-query.sh:4` is executable code and belongs in the site list even though `:17` in the same file is prose. The Go sites do not match that literal at all, because they build the path with `filepath.Join(os.Getenv("HOME"), ".local", "state")`: `agentstate.go:51` and `:292`, `repo.go:71`, and `statusline.go:104`. The check must catch both forms or it misses every Go consumer, which is the half the proposal''s divergence claim rests on. Give the check a scope that excludes prose, or it fires on documentation describing a default: `skills/worklog/SKILL.md:25` and `:129`, `skills/feature-based-session-manager/SKILL.md:20` and `:74`, the usage text at `worklog-query.sh:17`, and the comment at `repo.go:61`. A consumer that keeps its hardcoded fallback is otherwise invisible, and 4.9 asking a critic to argue about it is not a gate.'
    547189fe84ab42a8:
        hash: 54fd4234d1293f73
