version: 2
change: move-wtrun-to-sysinit-agent
decision: approved
note: 'Re-fingerprint of the owner''s instruction of 2026-08-11, verbatim: ''push, and implement and everything''. NOT a new approval: no task text changed (every item hash is identical), so the approved scope is intact. What moved since the fingerprint cc8ce7dd85602834 is evidence and state, which that instruction produces: 1.8, 2.1, 2.9, 2.2, and 2.3 marked done with their implementation notes, and the proposal Impact corrected to name skills/worker/ and to retract a claim that agent-sessions.sh holds a duplicated manifest reader, which it does not. The round-4 critics are still unreported and remain follow-up work against a shipped phase.'
