version: 1
change: agent-session-review-path
decision: approved
note: 'Round 1 of the phase-1 adversarial review: three defects fixed, four objections recorded as open tasks 1.8 to 1.11. Not a clean pass.'
change_hash: f46fe1d1d6f77c6d
base_commit: c6833bec6fddf239f82efd0f62e2689d18965794
items:
    0bd8c92c94aba443:
        hash: b3a33103634add62
        text: Add the agent-state check, intersecting state files with the live pane set and skipping the input entirely when that set is unknown
    2b60b04574ac572d:
        hash: da6b246a0466599e
        text: 'Apply: `nh darwin switch`'
    2eb93689be692837:
        hash: 84d837b443663de7
        text: Make the gate permissive when the report cannot run, so a session can never become undeletable
    7b44656bac0e0dd2:
        hash: 3f87fd91c54177d3
        text: 'Adversarial review (`adversarial-review` skill), round 1 of K=2: two critics, correctness and test-hollowness lenses. NOT clean. Fixed and verified: the `sy` gate aborted under `errexit` on an unresolvable session name and deleted nothing while printing nothing; a detached HEAD reported `HEAD` as its branch and took the no-upstream carve-out to exit 0; the liveness intersection was extracted to `agent-busy-panes.sh` so it can be driven with a fixed live set. Surviving objections are listed in 1.8 to 1.11; run round 2 after they close'
    8a4c3315df64e5b6:
        hash: de252e711c7700a8
        text: Name `--force` in the refusal message itself
    9e92ebda5649a71e:
        hash: 71ca7309d97bb854
        text: Author `config/agent-review.sh` reporting per repository the branch, the uncommitted file count, and the unpushed commit count (follows the state-file read in `config/agent-focus.sh`)
    009d3074e7fb4615:
        hash: 0769872d97275e49
        text: 'Confirm: the owner approves the staged diff before any commit'
    31e56d731f13b1c1:
        hash: 00d2b710bfa27807
        text: 'Verify: `nix flake check` and `nh darwin build` are green; review the diff'
    38e121a4711fff5d:
        hash: a82cf445735dfb8b
        text: A configured upstream that no longer resolves, which `fetch.prune` makes routine, is laundered into the permissive no-upstream branch and exits 0. Distinguish `branch.<n>.merge` unset from configured-but-unresolvable
    85eecfad4ec2e7fc:
        hash: b9610909e3d7a278
        text: Treat a branch with no upstream as "no upstream", never as zero unpushed commits
    309e673af643ee99:
        hash: ead048565bb7266c
        text: 'Verify: `nix fmt -- --check` is clean and `git diff` is reviewed'
    357e572fb71942b8:
        hash: 05e0637f876484a8
        text: 'Spike result: seshy passes hook environment variables, confirmed by a string scan of the installed binary: `SESHY_EVENT`, `SESHY_SESSION`, `SESHY_SESSION_PATH`, `SESHY_REPOS`, `SESHY_REPO_COUNT`'
    5913c9ef2b81ea0e:
        hash: b57e823e77a4095a
        text: 'Gate `sy delete` in the zsh `sy` wrapper, not in seshy''s `preDelete` hook. Testing showed seshy runs that hook advisorily: a non-zero exit logs a warning and deletes anyway, with or without `--force`'
    51496f1b0e47ec6c:
        hash: f9435438089a905c
        text: 'Confirm: verified against a real `sy new` session. The report named the branch `dev/rshnbhatia/review-probe/sysinit` and `no upstream`, which matched `git status` and `rev-parse` exactly'
    78199c7e5c30b1ff:
        hash: edfe3957fb993d03
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until the loop reaches a terminal state'
    206755c6389e5a3e:
        hash: e09dfd7319c31ae5
        text: 'Add the `agent-review-readiness` flake check: fixture repositories for ready, dirty, unpushed, no-upstream, a state file with no live pane set, a path that is not a directory, and a directory holding no repository. Every case asserts the exit code, because that code is what `sy delete` gates on. Mutation tested against five defects, each caught by its own assertion and not by a dependency failure: always-ready, ignore-dirty, ignore-unpushed, dropping the no-upstream note, and a bad path returning success'
    a8a31a42a8f59cb2:
        hash: 3492236d6904261d
        text: 'Two of the new assertions do not catch their mutation: removing the detached-HEAD block, and removing the session-key filter in `agent-busy-panes.sh`, both leave the check green. Diagnose and close before claiming either behaviour is covered'
    a2430e63677c67fd:
        hash: 2ea34642ad981780
        text: 'A repo mid-rebase, mid-merge, or mid-cherry-pick reports clean: the sequencer state lives in the gitdir and `status --porcelain` says nothing. Read `rev-parse --git-path rebase-merge`, `MERGE_HEAD`, `CHERRY_PICK_HEAD`'
    ad262d94a0cc5adc:
        hash: 0602935a591a47e6
        text: 'Repository discovery walks upward: run from a repo root and every top-level directory reports as its own repo with the same dirty count. Accept a directory only when `rev-parse --show-toplevel` equals it'
    b294f7740875cb42:
        hash: 8695b17fb0f0ae1d
        text: 'Confirm: all four paths verified in real WezTerm panes. Unfinished refuses and the session survives; `--force` deletes; a clean, pushed session reports ready and deletes; a bad path exits 2 and is permissive'
    c1ec81bdf8e3b538:
        hash: 64ee44eca76bb615
        text: 'Apply: stage the change and propose a commit message per the `writing-commit-message` skill'
    d9996223e67e2ca2:
        hash: 09d64c515c48462f
        text: 'Verify: `nix flake check` and `nh darwin build` are green; the report was exercised against fixture repositories covering clean, dirty, unpushed, no-upstream, bad-path, and all-clean, with the right exit code in every case'
    ef1b5f757ad9610d:
        hash: f499b43944df2b57
        text: 'Verify: `openspec validate agent-session-review-path` passes and `specutil check` reports no finding'
    f00f50e82a6a1237:
        hash: da6b246a0466599e
        text: 'Apply: `nh darwin switch`'
    f031d18c8f472677:
        hash: 70c4e3be475e609b
        text: Build it through `notify.nix` so it shares the identity resolver, and install it on PATH
