    357e572fb71942b8:
        hash: 05e0637f876484a8
        text: 'Spike result: seshy passes hook environment variables, confirmed by a string scan of the installed binary: `SESHY_EVENT`, `SESHY_SESSION`, `SESHY_SESSION_PATH`, `SESHY_REPOS`, `SESHY_REPO_COUNT`'
    5913c9ef2b81ea0e:
        hash: b57e823e77a4095a
        text: 'Gate `sy delete` in the zsh `sy` wrapper, not in seshy''s `preDelete` hook. Testing showed seshy runs that hook advisorily: a non-zero exit logs a warning and deletes anyway, with or without `--force`'
    51496f1b0e47ec6c:
        hash: f9435438089a905c
        text: 'Confirm: verified against a real `sy new` session. The report named the branch `dev/rshnbhatia/review-probe/sysinit` and `no upstream`, which matched `git status` and `rev-parse` exactly'
    78199c7e5c30b1ff:
        hash: edfe3957fb993d03
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until the loop reaches a terminal state'
    206755c6389e5a3e:
        hash: e09dfd7319c31ae5
        text: 'Add the `agent-review-readiness` flake check: fixture repositories for ready, dirty, unpushed, no-upstream, a state file with no live pane set, a path that is not a directory, and a directory holding no repository. Every case asserts the exit code, because that code is what `sy delete` gates on. Mutation tested against five defects, each caught by its own assertion and not by a dependency failure: always-ready, ignore-dirty, ignore-unpushed, dropping the no-upstream note, and a bad path returning success'
    abf56866ee2e8446:
        hash: edfe3957fb993d03
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until the loop reaches a terminal state'
    b294f7740875cb42:
        hash: 8695b17fb0f0ae1d
        text: 'Confirm: all four paths verified in real WezTerm panes. Unfinished refuses and the session survives; `--force` deletes; a clean, pushed session reports ready and deletes; a bad path exits 2 and is permissive'
    c1ec81bdf8e3b538:
