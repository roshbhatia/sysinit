version: 1
change: wezterm-command-console
decision: approved
note: Owner authorized clearing the standing review gate for these three changes in the 2026-08-03 session, without a fresh critic pass.
change_hash: 9b675861276cb9df
base_commit: 2fa0a2b4ff06018c7596e52854bae0f9120a407a
items:
    0e00c2753a3682ec:
        hash: bec4756d3ad22b5e
        text: 'Confirm: quit and relaunch WezTerm so pane ids are reassigned, then start a session. Confirm `agent-run` does not adopt an unrelated pane holding a recycled id.'
    1e786e8bc4bf14ea:
        hash: f2d8b25d319a6a96
        text: 'Confirm: queue a job, kill WezTerm before it completes, relaunch so the pane id is reused, and start a session. Confirm the stale job is discarded and does not execute. Use a harmless marker command, never a `git push`.'
    2aac94079e86ec6d:
        hash: 6f675600aa8d4a2e
        text: Stamp the `.console` record with the WezTerm instance identity, and discard a record whose stamp does not match. WezTerm reuses pane ids after a restart.
    2b73c8f430b80064:
        hash: 762d8da909992cc0
        text: 'Verify: `nix flake check` and `nh darwin build` are green. Review `git diff`.'
    2f6b298171f8f488:
        hash: bde9cd1556c81aac
        text: 'Add the fail-open path to `agent-run.sh`: `exec` the command when `WEZTERM_PANE` is unset, `wezterm cli` is unreachable, the split fails, the spool write fails, the heartbeat is stale, the instance stamp mismatches, the depth marker is set, a live `held` marker exists, or the interpreter is unset or unusable. Every wait must be bounded.'
    3fe8fcafea2d7a0b:
        hash: 518e95e2b9e4b69b
        text: 'Act: exempt a bare `cd` from the rewrite. Compound commands containing `cd` stay rewritten.'
    5e5a1b115729beea:
        hash: d14ce2bd0de71d74
        text: 'Confirm: kill the console pane, then run `agent-run` again. It must fall back within its bounded wait, not hang. This is the failure the FIFO design could not detect.'
    05ef49fdcb4bc917:
        hash: 10e46db8ecd2ef78
        text: 'Verify: `nix flake check` and `nh darwin build` are green. Review `git diff`. Re-run the deny-set checks from 3.7 against the built config.'
    6fa6229b137c152d:
        hash: 20d4955926e88d0a
        text: 'Confirm: the owner runs a full working session. A long build detaches and reaps. Ctrl+C returns a non-zero code. A bare `cd` still moves the agent''s working directory.'
    7a8b85a05873ab49:
        hash: 1e7cb4bc379b66a9
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this slice against its spec scenarios, the design decisions, and the rollout gates. Press hardest on whether any `agent-run` failure mode can block a command instead of falling through to direct execution.'
    8b265e21020ad9a2:
        hash: 69ceacc3e1eebdb7
        text: Add the circuit breaker to `agent-run.sh`. Two consecutive infrastructure failures write the breaker flag. Enforce a hard cap of five console-pane creations per session, so an alternating success-and-failure sequence cannot accumulate orphan panes.
    8fa385f4b9f02c9b:
        hash: da97c60ce8f48263
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this slice against its spec scenarios, the design decisions, and the rollout gates. Press hardest on whether the deny path can be bypassed by the rewrite path under any input.'
    9be8bc244aa6366d:
        hash: 709c9fcf93704ede
        text: Carry the agent's `PATH`, `XDG_STATE_HOME`, and interpreter in the job file, and apply them in `agent-console`. The runner is spawned by the WezTerm mux and inherits its environment, so a Dock-launched WezTerm gives every nix command exit 127 while the console reports itself healthy. Create the spool root, pane spools, and job directories `0700` under `umask 077`.
    9ddc913c3525b756:
        hash: a42bde318239bd6d
        text: 'Confirm: the owner spot-checks the bottom split at 35 percent and the focus flicker. Measurement in `design.md` predicts both panes keep full width.'
    22ab9960b4a7d282:
        hash: 5c7ac6124db8dc3a
        text: Add output sanitization to `agent-run.sh`. Strip ANSI sequences, carriage returns, and the leading EOT and backspace bytes that `script(1)` writes into its typescript.
    42cb410a24f801d9:
        hash: 03bb68f3b3b04516
        text: Add the heartbeat to `agent-console.sh` and the staleness check to `agent-run.sh`. The heartbeat must keep ticking while a job runs, from a background ticker. Pin the interval and the staleness threshold as stated values. Liveness is the heartbeat, not `wezterm cli list`.
    43dfe2104e8089f6:
        hash: c1c8a19ed501db06
        text: Package both scripts in `modules/home/programs/llm/config/notify.nix` and add them to `home.packages` in `modules/home/programs/llm/default.nix`. This follows the existing `agent-state` and `agent-notify` packaging, not a new pattern.
    44cba3839bc29a80:
        hash: ae68f39d7938b3fa
        text: 'Run each job in its own process group in `agent-console.sh`, using shell job control, and trap `SIGINT` in the runner. Measured: without job control the job shares the runner''s pgid, so Ctrl+C kills the runner.'
    61b987a9e5ad7470:
        hash: cfe4e8d49c78dbf5
        text: 'Gather: measure the real per-command overhead of the console on a trivial command, and confirm it is acceptable at every-command scale.'
    63c01c66ee025f67:
        hash: e51a97a90b5f77a1
        text: 'Apply: flip the `SYSINIT_AGENT_CONSOLE` stage flag default to `1` in `claude.nix`, then run `nh darwin switch`.'
    97fb3fb2955c6531:
        hash: eb10fe786e81d5be
        text: 'Act: skip the rewrite when `${XDG_STATE_HOME:-$HOME/.local/state}/agents/console.disabled` exists, and emit no `updatedInput` when the rewrite cannot be built.'
    104d5b7ce0674eb0:
        hash: 81b0df646192686e
        text: Honor the `${XDG_STATE_HOME:-$HOME/.local/state}/agents/console.disabled` file in `agent-run.sh` as an immediate pass-through, read fresh on every invocation.
    325ef84e7dc5a0bc:
        hash: 9e424eaedb9055b1
        text: 'Stamp every published job with the RUNNER instance identity, and have a starting `agent-console` discard jobs that are not its own. Do not scope the stamp to the WezTerm instance: closing the console pane forces a replacement runner inside the same instance, where a terminal-scoped stamp still matches and the stale `git push origin main` still runs.'
    715cb8a898dedd3a:
        hash: 3da0c7a80b6fb382
        text: 'Gather: re-read `modules/home/programs/llm/config/claude-bash-guard.sh` and the deny patterns it encodes. Confirm the deny set matches `openspec/specs/cross-harness-destructive-command-guard/spec.md`.'
    0924c4e7b370673b:
        hash: 433f45852e8c8ed5
        text: 'Apply: `nh darwin switch`.'
    1009b38bbbd720d5:
        hash: 9e72efc6ebe39647
        text: 'Confirm: detach a long job, then run `/clear`. Confirm the job keeps running, its log survives, and a later reap in that pane resolves the job id.'
    3607e38b5799e7c1:
        hash: 448af1f7f092716a
        text: 'Confirm: mid-turn, the owner creates the disable file from a second pane. The session''s next Bash command runs directly, with no restart. This is the only rollback case a real incident produces.'
    4237c90df507df99:
        hash: 2e2041566efbc5be
        text: 'Update `design.md` with the resolved values for the remaining open questions: whether background Bash gets its own pane, and whether the single ordered queue is a bottleneck under subagent-heavy turns.'
    6041c386fa995468:
        hash: 149dda1bf3fd8559
        text: 'Confirm: the owner starts a session with the shipped `SYSINIT_AGENT_CONSOLE` default and observes no console pane and no behavior change.'
    7903f905ebc94c57:
        hash: 66d28902895ff219
        text: Add stale-console recovery to `agent-run.sh`. On a stale heartbeat, discard the pane id and create a replacement. Never block waiting on a dead console.
    9583bec3f62b4b80:
        hash: 2e78939a95885516
        text: 'Confirm: press Ctrl+C during a job. The job dies, `agent-console` survives, and the next job still runs.'
    30208fdaba4f2979:
        hash: e45257d1c948f2fc
        text: 'Confirm: relaunch WezTerm from the Dock, not from a shell, and repeat 2.3. This is the launchd-`PATH` case, which a terminal-launched WezTerm hides.'
    33663ce5652e71a6:
        hash: 273195034426bd99
        text: 'Confirm: run `agent-run` with `WEZTERM_PANE` unset. The command executes directly and the exit code is unchanged.'
    37473d9bde7b766d:
        hash: eead15f6a524ca72
        text: 'Keep a detached job on the console pane, and make `agent-run` fall open to direct execution while the console is held. Do not run two jobs concurrently on one pane: a pty has one foreground process group, so the second job either steals Ctrl+C or takes `SIGTTIN` and stops. Signal the hold with a `held` marker carrying the holding runner''s identity, and add it to the unavailable list. A fresh `agent-run` has no memory of the detach and every other signal reads healthy. A stale marker must neither trip the breaker nor hold forever.'
    511100aa3f10806e:
        hash: 8cd36f7cbcc0cb15
        text: 'Confirm: the owner removes the disable file and confirms the next command routes to the console again. The kill switch is global and nothing removes it automatically, so leaving it set here would silently disable every later gate in slices 5 and 6 and make them pass for the wrong reason.'
    831866be265716d7:
        hash: 1bcec1764a561934
        text: 'Write `modules/home/programs/llm/config/agent-console.sh`. Follow the helper contract in `modules/home/programs/llm/config/agent-state.sh`: keyed on the agent pane id, best-effort, never fails the caller. It polls the spool for published job directories, runs each job under `script -q -e -F` with the agent''s own interpreter, passed in by the guard rather than read from `$SHELL` in the console pane, and writes `<job>/rc` atomically. It uses no named pipes and does not use `sh -c`. The fail-open path in `agent-run` must use the same interpreter, or the same command returns different results depending on console health.'
    8078927bcf5fc196:
        hash: 98f14e506ac9753f
        text: 'Act: add the `agent-run --reap <job>` invocation that returns a detached job''s final output and exit code.'
    58268825ea9d88cd:
        hash: 23988aa84982a439
        text: 'Act: add the rewrite branch. Emit `permissionDecision: "allow"` paired with `hookSpecificOutput.updatedInput.command` invoking `agent-run --cwd-b64 <b64> --cmd-b64 <b64>`. Both values must be base64-encoded, and each encoding must be unwrapped with `| tr -d ''\n''` as `agent-state.sh` already does. GNU `base64` wraps at 76 columns, which is 57 input bytes, so an unwrapped encoding corrupts most real commands. A trailing `-- <original>` form is destructive: Claude''s shell re-parses it, and rebuilding the string from argv turns a quoted `&&` into a shell operator.'
    a0bb5b7e54cee967:
        hash: c708c3b37c32d57f
        text: 'Act: in `modules/home/programs/llm/config/claude.nix`, confirm the Bash `PreToolUse` guard entry is synchronous, and set the `SYSINIT_AGENT_CONSOLE` stage flag default to `0`. Do not ship the kill-switch file from nix: a nix-managed `console.disabled` either survives its own removal or collides with the owner''s `touch` and blocks activation.'
    a0f35a1cd18ada26:
        hash: 1fc1d406afe17230
        text: 'Write `modules/home/programs/llm/config/agent-run.sh`. Follow the same contract as `agent-state.sh`. It resolves or creates the console pane, stages the job directory under `.staging/`, writes the command and `cwd`, publishes by atomic rename into a name carrying a monotonic counter, polls for `<job>/rc`, sanitizes the log, and exits with the job''s code. Allocate the counter atomically, by `O_EXCL` create or `mkdir` of the target name, with retry: rename makes publication atomic, not allocation exclusive, and two subagents that both read-then-increment nest one job inside the other.'
    a982bfcfcfbddc60:
        hash: 433f45852e8c8ed5
        text: 'Apply: `nh darwin switch`.'
    a990701ebed857df:
        hash: c302764c7f0a801d
        text: 'Verify: test whether `updatedInput` is applied without an accompanying `permissionDecision`. If it is, drop the `allow`. Pairing them spends the `allow`-tier fallback that `claude.nix` documents as load-bearing if `dangerouslySkipPermissions` is ever set to `false`.'
    aa460128dd1009f8:
        hash: e17196d4496cd014
        text: 'Act: extend `claude-bash-guard.sh` so the deny set evaluates first and returns before any rewrite code runs.'
    ae38031a506ea2be:
        hash: 78df9cb6e0ab0709
        text: Format both scripts with `nix fmt`, then confirm with `nix fmt -- --check`.
    b61d20048c099a45:
        hash: 5b91a9e1f8e3f5c5
        text: 'Confirm: run `/clear` five times in one agent pane. Confirm exactly one console pane exists afterward, and that the agent pane has not been shrunk by repeated splits.'
    c1a6e4483cc96dbc:
        hash: 649f48569453ba7f
        text: 'Act: add the `agent-run` timeout, set below the Bash tool''s 120 second default. On expiry, return partial output and the console pane id, and leave the job running.'
    c28ab57b5e4ba8ef:
        hash: 260aee174a1ba915
        text: 'Verify: run a job longer than the timeout. `agent-run` returns partial output and names the pane. A later reap returns the final result. Iterate 5.2 and 5.3 if not.'
    c882c8262a0435ec:
        hash: 515765f3b683fc05
        text: 'Act: skip the rewrite when the command''s first word is `agent-run`. This prevents an `agent-run --reap` call from nesting and deadlocking the queue.'
    cf53be3bcc89a7be:
        hash: bdd98da70b28671f
        text: 'Give `agent-console` its own lifetime. It exits and prunes its spool only when its agent pane is confirmed absent from `wezterm cli list`. A query error, timeout, or empty result is unknown, not absence, and must not prune: every other path fails open on an unreachable `wezterm cli`, and `nh darwin switch` replaces that binary mid-rollout. Prune a completed job only after it is reaped or a stated minimum retention elapses.'
    d63dbe79f663e93f:
        hash: a77b36d186e95698
        text: Export the depth marker from `agent-console.sh` into each job's environment, and honor it in `agent-run.sh` as an immediate direct execution. This is the load-bearing half of the re-entrancy block.
    d9264da925e93d02:
        hash: 45cb7f46503c7967
        text: 'Act: skip the rewrite when `tool_input.run_in_background` is true. A background process would hold the ordered queue for its lifetime.'
    ddf1bc7e4872e959:
        hash: c7e9c0b64a0cf0c3
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this slice against its spec scenarios, the design decisions, and the rollout gates.'
    dff1b10c8b75f394:
        hash: 11bad496781fd394
        text: 'Confirm: the owner verifies the mid-session rollback path last, after every other gate. Create the kill-switch file from a second pane during a live turn, confirm the next Bash command runs with no console pane and no restart, then remove the file and confirm the console returns. This runs last because leaving it set would invalidate every gate after it.'
    e69be239a866fa20:
        hash: 133022051d43f896
        text: 'Confirm: the owner starts a session with `SYSINIT_AGENT_CONSOLE=1`. Ordinary commands route to the console. Every deny-set form is still denied.'
    e852664b7b4646f4:
        hash: 0903d30b89f11cce
        text: 'Confirm: in a WezTerm pane, run `agent-run` on a command that needs the nix profile, such as `nh --version` or `rg --version`, not `sleep` or `echo`. The console pane appears, focus returns to the original pane, output streams live, and the exit code is `0`. A `/bin`-only command passes even when the runner has the mux''s `PATH`, so it cannot detect the missing-environment bug.'
    e9493505ff970ef5:
        hash: 1ee9d2e211cceae0
        text: 'Verify: `nix flake check` and `nh darwin build` are green. Review `git diff`. Confirm slices 1 and 2 are still working.'
    f02f7938fc4e473d:
        hash: 3afb207c51cc3cfb
        text: Namespace job ids per pane. Validate a `--reap` id against `[A-Za-z0-9._-]+`, then resolve the path and confirm containment under the calling pane's spool. Directory namespacing alone does not stop `../12/<job>` or an absolute path. Include the job id in the detach message.
    f9b67b416895725a:
        hash: 1a3cd3f3996f85cb
        text: Claim each job exclusively before running it, by atomic rename into a per-runner in-progress directory. A stale heartbeat is evidence, not proof, so a stalled runner and its replacement can both poll one spool and run the same `nh darwin switch` twice.
    f29d4c0c522edff3:
        hash: 8224b377315a6917
        text: 'Verify: feed the guard each deny-set form on stdin. Every form still returns a deny with no `updatedInput`. Feed it `nh darwin build` and confirm the `updatedInput` invokes `agent-run` with base64 arguments. Feed it `cd modules/home`, `agent-run --reap <job>`, and a payload with `run_in_background` true, and confirm none produces an `updatedInput`. Feed it `rg ''foo && rm -rf build'' .` and confirm the decoded command is byte-identical to the original. Feed it a command longer than 57 bytes and confirm the emitted `updatedInput.command` is a single line: GNU `base64` wraps at 76 columns, and a wrapped encoding is parsed as two commands. Iterate 3.2 through 3.8 if any check fails.'
    f42e28f347333b45:
        hash: bd1b4ec46440c18e
        text: 'Add the `SessionEnd` cleanup that removes only this pane''s failure counter and breaker flag. It must not touch the spool directory or the `.console` record: `SessionEnd` fires on `/clear`, and removing them would destroy a detached job''s log and orphan its console pane. Extend the existing `SessionEnd` wiring in `modules/home/programs/llm/config/claude.nix`.'
    f684212633a51d6e:
        hash: f56602ec8e37269a
        text: Add the `script(1)` capability probe to `agent-console.sh`. Fall back to direct execution when the BSD `-q -e -F` flag set is absent, per the macOS-versus-Linux risk in `design.md`.
    fe391d4049d263ad:
        hash: ef1d6e34e7913d17
        text: Surface a set kill switch in the statusline, beside the existing agent-state chips. The file is global and nothing removes it, so without a signal an owner who sets it during an incident disables the console everywhere, forever, silently.
    ffe9ad6abb2728d4:
        hash: 005a5b4fec020caa
        text: 'Verify: press Ctrl+C in the console during a job. `agent-run` exits non-zero and the returned text states that the owner interrupted the command.'
