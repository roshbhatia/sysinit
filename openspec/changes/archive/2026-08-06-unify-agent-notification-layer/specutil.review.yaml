        text: Author `config/extensions/sysinit-notify.ts` for pi, wiring `session_start`, `tool_call`, `agent_settled`, and `session_shutdown` to `agent-state` and `agent-notify` (follows `config/extensions/openspec-status.ts`)
    6e2e0b34f4c37dcf:
