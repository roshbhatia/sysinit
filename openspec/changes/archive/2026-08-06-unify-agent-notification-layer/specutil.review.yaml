        text: Replace the notification group with `agent:<pane-id>` in `agent-notify.sh` and `agent-prompt.sh`, falling back to the existing `agent-notify:<agent>:<context>` form when `WEZTERM_PANE` is empty; ssh does not forward it and the notifier still runs (follows the existing group construction at `agent-notify.sh:162`)
    052419782b80e4b8:
