items:
    00bde2a78e456b8b:
        hash: ff1a6eb6f71b9ea5
        text: 'Spike result: OpenCode DOES expose a usable surface. The plugin `event` hook exists alongside `tool.execute.before/after` and `chat.*`, and the bus carries `session.idle` and `session.error`. A probe plugin confirmed the load path: OpenCode loads `.ts` from BOTH `~/.config/opencode/plugin/` and `~/.config/opencode/plugins/`, so the earlier audit claim that `plugins/` is a stale name was wrong and is corrected in the modernize change'
    1b82cca1801d569a:
        hash: 4d6c07ec02b04020
        text: Set `notifications.enabled = false` in the agent-deck block of `ui.lua`, keeping every scraping option unchanged
    1ba4c74e0a98fa2f:
        hash: da6b246a0466599e
        text: 'Apply: `nh darwin switch`'
    2abe2dadac60837c:
        hash: 6db6a7933f98115b
        text: Add a `nix flake check` derivation covering all four defects, each assertion failing when its fix is reverted (follows the hermetic `pkgs.runCommand` checks at `flake.nix:229`). The group assertion executes `agent_group` rather than grepping for the call, because a call that passes an empty pane reproduces the defect with the call still present
    2e2c0b18a7ad4275:
        hash: e772fb73fbd07d79
        text: 'Verify: `nix flake check` green (16 checks), host build green, `nix fmt -- --check` clean, all four defect assertions negative-tested'
    05f146743a0e14f7:
        hash: 951f1fbf9ca0457e
        text: 'Confirm: `agent-state pi done "your move"` writes a correct state file with the right agent, status, and repo, which is the exact call shape the pi bridge makes. A live toast from each harness still needs the owner: it requires a real interactive turn'
    6ac6b0d333d572ab:
