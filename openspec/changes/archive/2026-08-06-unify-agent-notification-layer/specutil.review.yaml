    9e3b86a5afdbb578:
        hash: 9280166305bfadb4
        text: Split the fields on `\u0001`, not on tab. Tab is an IFS whitespace character, so bash collapses runs of them and an empty field shifts every later value left; a repo with no branch read the timestamp as its branch
    009d3074e7fb4615:
        hash: 0769872d97275e49
        text: 'Confirm: the owner approves the staged diff before any commit'
    17e2f5ae92cead3a:
        hash: 6c7426797ec79705
        text: Add a build assertion that a producer may be turned off only when the same harness is bridged, keying on the bridge artifact itself (the `customExtensionFiles` entry for pi, the plugin path for OpenCode) rather than on the coverage-set label, so editing the label alone cannot defeat the guard
    26f371943d96637c:
        hash: 62f96315eda85ad9
        text: Add a build assertion that fails when a configured harness reaches no notifier, and when a covered name is not configured. Forced from the `icons` derivation, following `config/cursor.nix:43`, consumed at `config/cursor.nix:58`. Both directions negative-tested
    27d6c99d650d416f:
        hash: df739965d751d929
        text: 'Add icon fetches to `notify.nix` for opencode, pi, and copilot (follows the pinned-hash block at `notify.nix:24`). amp, crush, goose, and devin are listed as intentionally generic instead: simpleicons has no crush or goose entry, and its "AMP" icon sources from amp.dev, which is Google Accelerated Mobile Pages, not Sourcegraph Amp'
    33d8225aa54d74d4:
        hash: d66c81c6ebea8d4a
        text: Add agent-deck detection patterns for gemini, devin, and pi, and bridge every agent-deck transition into `agent-notify`, skipping panes that emit their own `agent_state` so a hook-bridged harness is never announced twice
    40a8fdf53d4da914:
        hash: c1389bff72961541
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until no surviving objection or K=4 rounds'
    67e6db6fa306a803:
        hash: 4097285c6c2286d2
        text: 'Confirm: an approval toast dismisses on click; two idle panes of one harness both notify; a pi toast carries the pi icon and an amp toast carries the generic glyph. The paneless case is already confirmed on the live system: two sessions with no `WEZTERM_PANE` produced the distinct dedup keys `ctx4120745486_idle` and `ctx4143571985_idle`. The remaining items need a human to click a notification.'
    68c6302e85057ca0:
        hash: 356aebe6bc03ce2e
        text: Move OpenCode to bridged and add `attention.notifications = false` to the TUI config attribute set created by `modernize-opencode-and-pi-config` phase 1, both in the same commit as 3.6, and only when 3.6 produced a working plugin
    73aee1185e9e01a1:
        hash: 921210075551d5d5
        text: 'Replace the presence-greps in `notify-defect-regressions` with fixture assertions over the composer: all fields, an empty branch, minute and hour rollover, a missing file, an unparseable file, and clock skew. Mutation tested: reverting the separator reproduces `sysinit · 0`, where the empty branch collapses and the timestamp is read as the branch name'
    85ee49a13ab26bf9:
        hash: e0a3e05fbd3a0c00
        text: 'Confirm: verified in a real WezTerm pane with a patched notifier. The captured toast read `finished its turn — sysinit · main ✱ — 1s`, subtitle `sysinit`, group `agent:17`'
    309e673af643ee99:
        hash: ead048565bb7266c
        text: 'Verify: `nix fmt -- --check` is clean and `git diff` is reviewed'
    967c2db4f0f82f8b:
        hash: edab2732b6b5c9de
        text: Build the coverage set in `notify.nix` naming all eleven configured harnesses as hook-bridged or scrape-bridged. Reasons are comments, not Nix string values; the data is only which set a harness is in
    52998b7441d8733a:
