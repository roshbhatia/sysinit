    77979ada5f594822:
        hash: 04a868b323c12f37
        text: Move pi from deferred to bridged in the coverage set, and remove `notify` from the vendored extension list in `pi.nix`, both in the same commit as 3.4, so pi is never left with no producer
    96385c3ceb69f352:
