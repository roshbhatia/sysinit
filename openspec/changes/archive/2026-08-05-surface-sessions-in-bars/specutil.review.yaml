version: 1
change: surface-sessions-in-bars
decision: approved
note: Chip verified rendering on the live bar. Four sketchybar faults fixed; the cause was sbar.exec auto-decoding JSON into a table with errors swallowed.
change_hash: 847345b9ca1b16ab
base_commit: 8d17b7c0e7115d723c8cbabe442e8d0cda58c7a6
items:
    0e9d9983a799956d:
        hash: 332a4586db08ab9a
        text: Add the sketchybar widget (follows `sketchybar/lua/sysinit/pkg/widgets/front_app.lua`), shown only while WezTerm is the front app, dimming a stale selection with `foreground_muted`
    2a7f7ced1d09ad17:
        hash: 2335c165b89a0044
        text: 'Apply: `nh darwin switch` from `sysinit.laurel`, gated on `nix flake check` and `nh darwin build` exiting 0'
    2bfb7157d26fd1a9:
        hash: 5a00602991c6d787
        text: Verify the waybar module evaluates into arrakis's config and its jq program produces correct output for both fresh and stale, run against real command output rather than read
    04ed81374231cfc4:
        hash: 08b806433580619a
        text: 'Fix what that verification found: jq resolved `.selected` against the session object instead of the root, so the exclude-the-selected filter never matched; and the widget named a nonexistent colour key behind an `or` fallback, which would have rendered stale identically to fresh'
    5af05dd68231b4db:
        hash: 4e40c1eb1d20cf23
        text: Four faults were fixed before it rendered, and only the last was the cause. launchd's PATH carries a literal unexpanded `$USER`; an item created `drawing = false` never receives `routine` so it cannot show itself; a cached front-app flag made the chip depend on callback ordering; and `sbar.exec` auto-decodes JSON stdout into a Lua table, so a callback written for a string raised, and sbarLua swallows a raise inside that callback
    6bfceb4c316d19cd:
        hash: c5d66023931c36a6
        text: 'Mutation test the check. Two mutations: flipping `fresh` to `stale` was caught; replacing the rank sort with a name sort was NOT, because the fixture''s waiting session was named `beta`, first either way. Renamed it `zulu`, which sorts last alphabetically and first by rank, and the mutation now fails'
    30ff08fcc98a360e:
        hash: ab5a8049de0d1d3d
        text: Publish the selection with a heartbeat from `ui.lua`'s existing `update-status` tick, so a reader can tell a live mux from a dead one
    81d9c1a0d2345a1e:
        hash: 9273c11ce6e86d20
        text: Add the waybar `custom/agent-sessions` module reading the same command, with a `.stale` CSS rule so Linux dims the same state the same way
    91a43ce21e927975:
        hash: 972bdafebc44c497
        text: Run `nix flake check` and confirm arrakis still evaluates
    260f131d1c623598:
        hash: 40d0b7cc988a75ac
        text: Run `nix flake check` and confirm it exits 0
    3116be29c4f4bc9a:
        hash: c7c6c587ed638b80
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the bar consumers against the proposal `Behavior` criteria and D3, asking what input makes the chip lie and whether any check would notice; revise until the loop reaches a terminal state (see the skill for the scaled round cap)'
    6270d9b72fe5ec2f:
        hash: 40c9bc22ea416a3d
        text: Build it in `runtime/default.nix` beside `agent-review`, and install it via `llm/default.nix`
    101379ed3df3ebfb:
        hash: 185763ef6684c327
        text: 'Method note: five switches went to hypotheses before instrumenting. A marker line appended from inside the shell command, then from inside the callback, located it in one switch. Prefer instrumenting a silent failure over predicting it; the swallowed error made every prediction unfalsifiable'
    ab7087e1e205fce3:
        hash: 03b0058ab6281b94
        text: 'Build only: `nh darwin build` from `sysinit.laurel`, which writes no system change'
    b832a0d9367edb8d:
        hash: 002e0f946930c807
        text: 'Add `checks/agent-sessions-rollup.nix`: fixture-driven, asserting the three selection states and the worst-wins ordering by content rather than by exit code'
    c62c8ba0ea2950cc:
        hash: 04b3a8637071af12
        text: Register it in `sketchybar/lua/sysinit/init.lua`
    da4b552e64b195f2:
        hash: 11589537823e00eb
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the command against the proposal `Behavior` criteria and D2 and D4; revise until the loop reaches a terminal state (see the skill for the scaled round cap). Adversarial review: waived by owner for this phase, on the grounds that the fixture check asserts each Behavior criterion by content and both mutations were exercised'
    fa93f0cf495ec2e1:
        hash: c47e51e28d81f691
        text: "Confirm: the chip renders. `sketchybar --query agent_sessions` reports `drawing=on`, icon `\U000F018D`, label `default`, which is the selected session"
    fb0ec6bbb7c98c74:
        hash: d6c1b1c41355a437
        text: 'Add `runtime/agent-sessions.sh`: read the per-pane state bus and `sy list`, roll up worst-wins per session, print JSON, always exit 0 (follows `runtime/agent-review.sh`, the existing read-only reporting command)'
