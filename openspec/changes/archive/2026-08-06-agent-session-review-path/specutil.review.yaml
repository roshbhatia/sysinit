version: 1
change: agent-session-review-path
decision: approved
change_hash: 7a3d959e1a9ed9d3
base_commit: 1927846cdcc2a1bc42977c58e34920ac5727c4a8
items:
    0bd8c92c94aba443:
        hash: b3a33103634add62
        text: Add the agent-state check, intersecting state files with the live pane set and skipping the input entirely when that set is unknown
    1f7b78db9c02fe1c:
        hash: d0f4d5bd2208bb6a
        text: 'Adversarial review (`adversarial-review` skill), rounds 1 and 2 of K=2. Terminal state CAPPED with zero surviving objections: ten defects found across two rounds, all closed and mutation tested, but no round returned clean on its first pass, so this is not reported as a clean review. One defect was caused by a round-1 fix. The round-2 finding that mattered: commits reachable from no other ref exited 0, and the new predicate found real work at risk in two live sessions'
    2b60b04574ac572d:
        hash: da6b246a0466599e
        text: 'Apply: `nh darwin switch`'
    2eb93689be692837:
        hash: 84d837b443663de7
        text: Make the gate permissive when the report cannot run, so a session can never become undeletable
    8a4c3315df64e5b6:
        hash: de252e711c7700a8
        text: Name `--force` in the refusal message itself
    9e92ebda5649a71e:
        hash: 71ca7309d97bb854
        text: Author `config/agent-review.sh` reporting per repository the branch, the uncommitted file count, and the unpushed commit count (follows the state-file read in `config/agent-focus.sh`)
    31e56d731f13b1c1:
        hash: 00d2b710bfa27807
        text: 'Verify: `nix flake check` and `nh darwin build` are green; review the diff'
    81b8f92b47490105:
        hash: 81bb5fb5bfc8aae8
        text: A configured upstream that no longer resolves now blocks as `upstream gone` instead of taking the benign no-upstream carve-out. `branch.<n>.merge` being set distinguishes it from the seshy default the carve-out was written for. Global `fetch.prune` makes this routine after a merge-and-delete, and the local commits may exist nowhere else
    85eecfad4ec2e7fc:
        hash: b9610909e3d7a278
        text: Treat a branch with no upstream as "no upstream", never as zero unpushed commits
    357e572fb71942b8:
        hash: 05e0637f876484a8
        text: 'Spike result: seshy passes hook environment variables, confirmed by a string scan of the installed binary: `SESHY_EVENT`, `SESHY_SESSION`, `SESHY_SESSION_PATH`, `SESHY_REPOS`, `SESHY_REPO_COUNT`'
    776ac1a9f8a42e64:
        hash: bb8c8e9e953a652c
        text: 'Confirm: the owner reviews the landed work. This is the judgment the rollout exists for: the change altered a gate that deletes sessions, and the report now refuses two live sessions it previously called ready'
    5913c9ef2b81ea0e:
        hash: b57e823e77a4095a
        text: 'Gate `sy delete` in the zsh `sy` wrapper, not in seshy''s `preDelete` hook. Testing showed seshy runs that hook advisorily: a non-zero exit logs a warning and deletes anyway, with or without `--force`'
    12011badb932d167:
        hash: 64207ed79ceea19d
        text: 'Verify: `openspec validate agent-session-review-path` reports valid and `specutil check` passes for every change'
    51496f1b0e47ec6c:
        hash: f9435438089a905c
        text: 'Confirm: verified against a real `sy new` session. The report named the branch `dev/rshnbhatia/review-probe/sysinit` and `no upstream`, which matched `git status` and `rev-parse` exactly'
    78199c7e5c30b1ff:
        hash: edfe3957fb993d03
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until the loop reaches a terminal state'
    206755c6389e5a3e:
        hash: e09dfd7319c31ae5
        text: 'Add the `agent-review-readiness` flake check: fixture repositories for ready, dirty, unpushed, no-upstream, a state file with no live pane set, a path that is not a directory, and a directory holding no repository. Every case asserts the exit code, because that code is what `sy delete` gates on. Mutation tested against five defects, each caught by its own assertion and not by a dependency failure: always-ready, ignore-dirty, ignore-unpushed, dropping the no-upstream note, and a bad path returning success'
    873866668c7ae3cf:
        hash: ee8a2e4bcb336677
        text: 'Apply: staged and committed across the session, one concern per commit, per the standing instruction to commit and push as needed'
    "1351066732633066":
        hash: 8ab4f1e7464ca506
        text: 'Verify: `nix fmt -- --check` is clean, after formatting `overlays/meat.nix`; `nix flake check` reports no failure'
    a23ac3e07633d88c:
        hash: a0b9048d27d494da
        text: 'Both round-2 objections closed. A linked-worktree fixture now covers the shape seshy actually creates: discovery, a local-only commit, a paused rebase whose markers live under the worktree gitdir, and a dirty tree. Mutation tested: breaking relative marker resolution fails the standalone cases and leaves the worktree ones green, so the two exercise different code paths. The spec now carries the reachability scenario, so it no longer authorises the exit 0 that lost work'
    b294f7740875cb42:
        hash: 8695b17fb0f0ae1d
        text: 'Confirm: all four paths verified in real WezTerm panes. Unfinished refuses and the session survives; `--force` deletes; a clean, pushed session reports ready and deletes; a bad path exits 2 and is permissive'
    cda67799ed4d5531:
        hash: 782767112f532048
        text: A paused rebase, merge, cherry-pick, revert, or bisect now blocks and is named. The sequencer state lives in the gitdir, where `status --porcelain` reports nothing, so a stopped rebase read as clean and deleting the worktree would have discarded every commit it had applied. Fixtures cover a paused rebase and a conflicted merge; mutation tested
    d50199a8ea6ba8c0:
        hash: 577cff7bf4c33e6c
        text: 'Discovery accepts a repository root only: `rev-parse --show-toplevel` must equal the directory. `--git-dir` walks upward, so running the report from a repo root previously reported every top-level directory as its own repository carrying the same dirty count'
    d9996223e67e2ca2:
        hash: 09d64c515c48462f
        text: 'Verify: `nix flake check` and `nh darwin build` are green; the report was exercised against fixture repositories covering clean, dirty, unpushed, no-upstream, bad-path, and all-clean, with the right exit code in every case'
    f00f50e82a6a1237:
        hash: da6b246a0466599e
        text: 'Apply: `nh darwin switch`'
    f031d18c8f472677:
        hash: 70c4e3be475e609b
        text: Build it through `notify.nix` so it shares the identity resolver, and install it on PATH
    f047fd4d2fb4407c:
        hash: 0306500998fc06d1
        text: 'Both assertions do catch their mutation. The earlier negative result was a bad method: deleting a line leaves its variable unused, shellcheck fails the `agent-review` package build, and the check derivation never runs, so a dependency failure reads as zero assertion failures. A mutation must be shellcheck-clean to test an assertion at all. Confirmed with `[ "$detached" -eq 999 ]` and a session-key comparison that keeps both variables referenced: one and two assertions fire respectively'
