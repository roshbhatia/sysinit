        text: Add a build assertion that a generated theme file is selected by a declared setting
    a54fdbe4de731ec7:
        hash: 7030f966126191f9
        text: 'Confirm: the live main config carries none of `theme`, `keybinds`, or `tui` after the switch, and `tui.json` carries all three'
    a923362cd68af9f9:
        hash: ca5dc1fa0c1b8514
        text: 'Fixed twice. The first attempt asserted FORMATTING, not the property it named, and round 2 broke it two ways: a backslash-continuation prefix passed the line-count gate while bash read it as one command with `eval` as an argument, and a correct semicolon-separated one-liner was rejected. The prefix now lives in `config/pi-shell-prefix.sh` and the `pi-shell-prefix-loads-aliases` check RUNS it against fixture alias files, asserting an alias resolves from both `~/.zshrc` and `~/.config/zsh`. Mutation tested with the backslash form the old assertion passed: caught, with bash reporting `shopt: eval: invalid shell option name`'
    b959ad93e33805fb:
        hash: 91ddf6ea87c9cdb5
        text: Move `theme`, `keybinds`, and `tui.scroll_acceleration` out of the main config attribute set into a TUI config attribute set
    ba359ae969bacf0d:
        hash: 5106ca346d7cb0b3
        text: 'Confirm: started OpenCode twice; the migration-artifact count stayed at 1 (the pre-existing March file) and the main config stayed clean'
    bdb1b11e930d8cbd:
        hash: c1389bff72961541
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until no surviving objection or K=4 rounds'
    bebe61c26c49b872:
        hash: 56c9bbe994a5c328
        text: Add an activation-time validation of the real merged file that fails `nh darwin switch`; the build-time layer alone cannot see a key OpenCode wrote at runtime
    c1ec81bdf8e3b538:
        hash: 64ee44eca76bb615
        text: 'Apply: stage the change and propose a commit message per the `writing-commit-message` skill'
    c2f3dcf0524fda4a:
        hash: ffc3a4bc91c191bf
        text: 'Adversarial review (`adversarial-review` skill): terminal state `CLEAN`, 0 open, within the K=2 cap for a one-phase review. Round 1 returned 6 surviving objections, all fixed and negative-tested: the check validated only 10 of 17 rendered keys; the retired-key filter and the merge pipeline existed as two hand-copies that could drift, and an unquotable key would have failed only at switch time; deletion reached depth one only, so a stale `provider.ollama` survived forever; nothing asserted the localized schema kept `additionalProperties: false`; the `$ref` walk dropped sibling constraints; `tui.json` had no retired mechanism and no merged fixture. Ordering deviation: 1.11 ran before this task. The review then forced a rework and a second switch.'
    cb516a545ac1e5de:
        hash: 3ccf6d595f387b23
        text: Fixed. `quietStartup` moved to `ownerPreference`. It is display-only, neither policy nor Nix-derived, and its peer `hideThinkingBlock` was already held back for that reason. Enforcing it would have reverted an owner who turns the startup header back on from `/settings`, which the blanket `enforce = piKeys.declared` made a real regression rather than a style question
    d3d65af592669127:
        hash: 3135fd0804e822bb
        text: 'Confirm: OpenCode starts and loses no configured plugin or tool'
    d9900b5969fdeb31:
        hash: a5cb351ab9101edd
        text: 'Verify: `openspec validate modernize-opencode-and-pi-config` passes and `specutil check` reports no finding'
    e2e091c37109d39e:
        hash: 1cb0790a3b431206
        text: 'Decided without needing the owner: `defaultProvider` and `defaultModel` stay undeclared per the Non-goals. Nix takes over `theme`, `defaultThinkingLevel`, `hideThinkingBlock`, `shellCommandPrefix`, and `enableInstallTelemetry`. `lastChangelogVersion` stays runtime-owned'
    e6dfd8789cb743ad:
        hash: fc7c13fcd0a3ce1d
        text: Declare `shell`, `default_agent`, `subagent_depth`, `compaction`, and `tool_output` in the main config
    ed145c653a4d5a37:
        hash: 3cb16b9bc2a9a6d3
        text: 'Verify: `nix flake check`, `nh darwin build`, and `./hack/update-pi.sh` all behave as expected'
    ee7375a40b6348ba:
        hash: 0b370f359182cbfb
        text: 'Both halves fixed. The rollback prose in `proposal.md` and `design.md` said an unrelated switch "re-imposes every declared key" without naming the mechanism, and told the operator to edit a list by its old name. It now states that declared keys are ENFORCED, which is why restoring the captured file first is wrong, and it names `retire`, adding that undeclaring alone cannot remove a key because the merge preserves a base-absent key on purpose. The `pi-settings-keys-exist` check now also asserts every `ownerPreference` key is still a documented pi setting, so a rename cannot leave `assertPreferencesUndeclared` blocking a declaration for a key that no longer exists. Mutation tested: renaming one is caught by name'
    f57ccba8d2c83623:
        hash: 887361bc75657e2b
        text: Copy the live `~/.pi/agent/settings.json` into the change directory as the rollback artifact
    fb9bc1a06088da45:
        hash: 3c1b427bdeb1b6fb
        text: 'Confirm: verified on the live file after the switch. `showLastPrompt` and `powerline` are gone, `theme` is `stylix`, `lastChangelogVersion` survived, `shellCommandPrefix` is three real lines, and `defaultProvider` and `defaultModel` were left untouched'
