    78eb245b0149cc36:
        hash: 5f2ce75457bb13c8
        text: Vendored `modal-editor` and `todo`, which bind only session events. `protected-paths` and `plan-mode` dropped per 3.3, with the reason recorded beside the extension list
    309e673af643ee99:
        hash: ead048565bb7266c
        text: 'Verify: `nix fmt -- --check` is clean and `git diff` is reviewed'
    324a8e1243257385:
        hash: 5520481b44fb5aa7
        text: 'Adversarial review (`adversarial-review` skill), round 1 of K=4. NOT clean: two critics, one on gate correctness and one on whether the check is hollow. Eight objections, three of which defeat this phase''s headline fixes. Fixed and proven so far: - A declared key did NOT win on every activation. The three-way merge returns the DISK value whenever the Nix value is unchanged since the base, so a mergeable key wins once and never again. Measured: base stylix, disk dark, new stylix merged to `dark`. That is the "generated theme is never selected" defect this proposal exists to fix, reappearing on the first pi-side write. `enforce` now covers every declared key, and a probe proves mergeable yields `dark` while enforced yields `stylix`. - The STOP condition greps a 76 MB binary for a bare substring, so `editor` matches and a typo for `externalEditor` passed while pi never read it. Verified. It now checks the shipped `pi/docs/settings.md`, which lists every real setting, and a bare `editor` is absent from it. Objections still open are recorded in 2.11 to 2.14'
    365b66385e442f5e:
        hash: 3f69fb85af14904a
        text: 'Decided: wire it. `nvim-pi` is a `--clean` nvim wrapper that avoids the lazy.nvim startup wait, which is worth keeping; it was unreachable only because the setting was undeclared and the keybinding unbound'
    622e1bf151f7f5cc:
        hash: 223d8628941985d4
        text: Source the vendored extension files from `${pkgs.pi-coding-agent}/pi/examples/extensions/` and delete `piExtensionsRev`, `piExtensionsSrc`, and their hash
    921f93d9869db2b7:
        hash: 37758840bdf913fb
        text: Add a retired-key list to the OpenCode activation script that deletes `theme`, `keybinds`, and `tui` from the live main config before merging; a deep merge cannot remove a key on its own
    2308cb5dbd6a75f6:
        hash: 9fb569a170364543
        text: 'Verify: `nix flake check` and `nh darwin build` are green; review `git diff`'
    3095fe2be90bb962:
        hash: c1389bff72961541
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break this phase against its spec scenarios; revise until no surviving objection or K=4 rounds'
    3416b57d33e0e1c8:
        hash: e3e9af6914a88267
        text: 'Fixed. `adoptDelete` ran only on the adopt path, so a key that was never declared is base-absent, and the merge preserves base-absent by design: the harness rewrote `powerline` and nothing removed it. The list now applies on EVERY activation, and is renamed `retire`, because `adoptDelete` would have been a lie. Asserted by `retire removes a base-absent key the harness rewrote`, mutation tested by stopping the base path from stripping'
    4006fdbcf537b67e:
        hash: c2281f17afdecdaa
        text: 'Recorded rather than re-confirmed. Pi rewrote the settings file between the capture and now, dropping `hideThinkingBlock` on its own, so a pi rewrite alone explains `powerline` being absent and 2.10''s confirm passes even if `retire` does nothing. The real evidence for `retire` is the derivation check, which is mutation tested. Also `powerline` appears nowhere in the 0.82.1 package, so 2.3''s rationale contradicted itself: it is absent from the build, and the claim that pi''s settings screen writes it is unsupported'
    5240c1c5941945f2:
        hash: 698cddf2917fb257
        text: 'Confirm: pi starts with no extension load error; `/plan` toggles; protected paths are blocked; the external editor opens or is gone'
    5542a7c123b2f6de:
        hash: d3584244fa2440ff
