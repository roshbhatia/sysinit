        text: Declare the agreed key set, excluding `defaultProvider` and `defaultModel` by name, and including `theme = "stylix"`, `enableInstallTelemetry = false`, a corrected `shellCommandPrefix` whose newline escape is right, and `skills` if `close-harness-instruction-gaps` has already landed it; the live capture hides that key, because the merge preserves it
    a5f935c7b79f5565:
