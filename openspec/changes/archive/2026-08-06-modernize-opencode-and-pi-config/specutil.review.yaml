    28f7d5c4185aca59:
        hash: 53f642745203e310
        text: Extend the build-time check to a committed fixture pushed through the same retired-key deletion and merge, validated against both schemas; the check derivation is hermetic and cannot read the live `$HOME`
    34eba0f6a53a9ffb:
