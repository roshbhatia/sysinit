    2ef836be866dfa76:
        hash: 3117b86500f01253
        text: Write the TUI config to `~/.config/opencode/tui.json` using the same merge-into-a-writable-file activation pattern as `opencode.nix:208`; this writer is the one `unify-agent-notification-layer` depends on for `attention.notifications`
    3f200e515ecd45c8:
        hash: 48a9a7f4ac7911d2
        text: 'Fixed in two steps, because the first was not enough. `piThemeName` is now the one definition and the setting, the theme''s `name` field, and the install filename all derive from it. That alone did not catch a hardcoded name, so the theme is bound as an attrset before serialization and the assertion also compares its own `name` field. Mutation tested: wrapping the name as `${piThemeName}-dark` was NOT caught after step one and IS caught after step two'
    3fd73a20eade69b7:
        hash: c8bdf6968340dd44
        text: 'Fixed. `mac-system-theme` is removed from the vendored set. It called `ctx.ui.setTheme` on session_start and polled every 2 seconds, and pi persists an extension-driven theme change, so with `theme` declared and enforced the two fought silently and the generated theme was active in zero sessions. Following the macOS appearance was already incoherent here: this host declares `appearance = "dark"` with `catppuccin-macchiato`, so pi would have gone light while everything else stayed dark. The extension list moved to `config/pi-vendored-extensions.nix` so the new `pi-no-theme-writer` check reads the same list, and that check fails the build if any vendored extension calls `setTheme` while `theme` is declared. Mutation tested by re-adding it: caught by name'
    4a901c71652891ab:
        hash: b534611ee0de34a6
        text: Update `hack/update-pi.sh` so it no longer reports on a revision that no longer exists
    4ea406ae01418a4b:
        hash: 9fb569a170364543
        text: 'Verify: `nix flake check` and `nh darwin build` are green; review `git diff`'
    7b711dc93a29915b:
        hash: 2bdb3b4cf3757739
        text: Fixed. Both loops now anchor to the doc's table column and accept dotted children, so `compaction`, `retry`, `warnings` and the other four documented only as `compaction.enabled` style leaves are recognised. The bare-name search rejected real settings, which blocked exactly the declarations this check exists to permit
    8db4ba6409e70164:
        hash: a80c5df78bc200ab
        text: Retire `showLastPrompt` AND `powerline`. A string scan found both absent from the installed binary; `powerline` was written by pi's own settings screen. Both are deleted from the live file before the merge, because undeclaring alone leaves a key on disk forever
    9b2209a1f845d7bd:
        hash: df5ba2c8eebb8e99
        text: Add a `nix flake check` derivation asserting every declared settings key appears in the installed pi binary (follows the hermetic checks at `flake.nix:229`; this cannot be a module-level `throw`, because evaluation cannot read a derivation's contents)
    9bd5b5038510a79d:
        hash: 0239b520198f2c7c
        text: 'Decided, per D7: none of the three is adopted. `plugins/sysinit-spec.ts.backup` cannot load at all. `tools/plan.{sh,ts}` resolves its script from a project-relative path that does not exist for a globally-installed tool, duplicates the openspec skills, and depends on `beads` from outside Nix. All three are preserved in `captured-opencode/`'
    9d437ff1f9bfca64:
        hash: 15bb32775eb7359f
        text: Add a build assertion that every named extension exists in the package
    009d3074e7fb4615:
