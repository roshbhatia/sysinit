        text: 'Resolved, and the premise was half wrong. `forget_base` IS covered: replacing its `rm -f` with a no-op fails the check with `disabled file drops its base: got [kept] want [dropped]`. The block-style YAML assertion is genuinely not mutation-sensitive, and the reason is that the guard it was thought to cover is a no-op: verified against yq v4.53.3 that `... style=""` only changes a YAML-to-YAML transform, where yq preserves source node style, while the write path reads JSON, which carries none. The guard is kept as defence if that path ever takes YAML, the assertion is kept because it would fail if it did, and the comment claiming yq "carries flow style over from JSON input" is corrected: that is false'
    7846571b31d203e7:
