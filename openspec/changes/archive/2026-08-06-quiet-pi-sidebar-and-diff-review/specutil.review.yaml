version: 1
change: quiet-pi-sidebar-and-diff-review
decision: approved
change_hash: c35430be98526c3e
base_commit: 523a425c2114ee11ad2143b511c8baddfd00be1f
items:
    1bdc18763aaf60f9:
        hash: f668945435b3210c
        text: Fix the first attempt, which derived that target from `programs.nh.flake`. Evaluated on this host it resolved into the sysinit.laurel checkout, which carries no module tree from this repository, so activation would have failed on the live machine
    001bce341d16be12:
        hash: 747277ab8e257458
        text: 'Fix the CLI''s exit codes and edges: `clear` on a store-less repository is success rather than the failed test''s status, the absent-store `list --json` carries the same keys as every other path, a symlinked store is refused rather than replaced, and the lock trap clears before releasing so a signal cannot release a lock this process no longer holds'
    2c99a5f6018f0590:
        hash: 66294a4600d45332
        text: 'Open the split through the multiplexer''s own CLI: `wezterm cli split-pane`, falling back to `tmux split-window`, and report the command when neither is present (D5)'
    2de419bd1d6644e9:
        hash: 33cc7e7a069dab8e
        text: 'Apply: `nh darwin switch` from the `sysinit.laurel` checkout in a split pane, gated on `nix flake check` and `nix build .#darwinConfigurations.lv426.system` exiting 0'
    4a50c6683c34193d:
        hash: 71d96e5c9a7d4a56
        text: Rewrite `neovim/sysinit-nvim.nix` from a clone to a symlink, with the target in a new `sysinit.neovim.configPath` option (D9)
    4be1a42ac75c1216:
        hash: 3a3c901dfbf7720b
        text: Reject control bytes in a path in both entry points, detecting a newline by `tr -d` rather than `grep`, which cannot match a line separator (D17). Validate the summary after stripping, so a summary of only control bytes cannot land as an empty note. Type `author` and `rationale` in `apply`, so it accepts exactly what `add` guarantees
    5b3e1540c9e8b407:
        hash: c33d91c955fcd8b1
        text: Narrow `tui.editor.cursorLeft` to `left` in the generated `keybindings.json`, so `ctrl+b` is uncontested, and modernize `renameSession` to the namespaced `app.session.rename` (D7)
    7d3c940fa32844be:
        hash: 8b33af6703ae14dc
        text: 'Add `runtime/diffnote.sh` (follows `runtime/agent-review.sh`) with hunk''s `session comment` command surface: `add`, `apply --stdin`, `list`, `clear`, `path`. Validate a whole batch before writing, and replace the store atomically (D11)'
    07f3672c8bfcbb7e:
        hash: 33b2ff7128d6c7e0
        text: Verify `hunk` appears in no `.nix` file and no lock file, then confirm `nix flake check` and the system build both exit 0
    12ef8d65b34259b8:
        hash: ba91a391f2cb6eb4
        text: 'Track the three dropped files with `git add -f`: `config/.luarc.json`, `config/.neoconf.json`, and `config/.gitattributes`. Each was matched by this repository''s `.gitignore` or the machine''s global ignore, so `git archive` wrote them and `git add` skipped them. Parity with the old clone now verified file by file'
    18eb1eaf5dfa1a91:
        hash: f717ce71f0bdd87a
        text: Make activation refuse, and print the `mv` to run, when `~/.config/nvim` is a real directory. It may hold commits that never reached a remote
    20d6a61752731fea:
        hash: 9c3f272ff3e35952
        text: 'Add `checks/diffnote-roundtrip.nix` (follows `checks/agent-sessions-rollup.nix`): assert that the CLI and the editor derive the same note path, that both payload shapes are accepted, that a rejected batch leaves the store byte-identical, and that rendering places one clamped extmark per note. Expose `M.draw` to make the render assertable without the plugin (D12)'
    41bfc9658a5fa19b:
        hash: e72d023d38a733df
        text: Delete `extensions/openspec-status.ts` and its install entry in `default.nix`. The sidebar OpenSpec panel carries the same fact
    76e24dee15c94c3e:
        hash: 2bf43a7403e0ad40
        text: 'Fix the renderer: clear every buffer drawn into, recompute the repository root per refresh, own attribution at the head with no forgeable signature, cap one row at three notes, reject a non-integral line, close both handles on a failed start, add `VimLeavePre`, and pcall the three CodeDiff hooks'
    84c4c2ef1faf215a:
        hash: 9dc22b51a9f91cb0
        text: 'Extend the check to the holes the review proved: seven rejection cases each asserting the store is byte-identical after, zero-byte and corrupt store handling, a producer failure mid-write, the symlinked cwd, the per-row cap, the `XDG_STATE_HOME` unset and trailing-slash branches, and control-byte stripping'
    85c25186e9788b02:
        hash: b3fa62004048ec0b
        text: Add `pad` beside the existing `truncate` in `extensions/openspec-sidebar/index.ts`, and use it in `SidebarCompositor.paint` so each row occupies the full sidebar width. Extend `reset()` with SGR 49 so appended padding cannot inherit a run's background (D1)
    86cfa99183e57494:
        hash: 12f01fe804ba0b54
        text: Remove the `hunk` overlay entry from `overlays/inputs.nix`, delete `modules/home/programs/hunk.nix`, and drop it from `modules/home/programs/default.nix` (D8b)
    88ef7b0e0e6d1ac5:
        hash: 91a3d968ba8e298e
        text: 'Move: the owner runs `mv ~/.config/nvim ~/.config/nvim.pre-inline`. Activation refuses while a real directory is there, and moving rather than deleting keeps any commit that never reached a remote'
    94b3c57663ffee6d:
        hash: d6d32cfd61bfcbe5
        text: Remove the five `hunk` entries from `llm/lib/allowlist.nix`
    185b9ff78720bd72:
        hash: 3e828f1b205a36fb
        text: 'Rewrite the CLI against those objections: lexical `..` and `.` resolution, `pwd -P`, publish-only-what-parses, repair a zero-byte store and refuse a corrupt one, a lock directory per store, one-pass batch resolution, control-byte stripping at the write path (`[[:cntrl:]]`, after measuring that an escaped `\uXXXX` range matched the printable bytes instead)'
    428e4d526c4b8aad:
        hash: ab9eae3888bea35b
        text: Make `ctrl+b` ask pi to annotate after the split opens, naming the `diffnote apply --stdin` payload, delivered as a follow-up so it never interrupts a running turn (D4)
    476bc3e3d63b7282:
        hash: 406857a6a23926cf
        text: Remove the `hunk` flake input and its entry in the cache bundle list, then regenerate `flake.lock`
    672e21ac9c2fdd98:
        hash: 7cba4ce62b86c1af
        text: 'Confirm: nvim starts from the symlinked path with its plugins loaded, the owner reads a live sidebar and judges that it reports what they meant it to report, and `ctrl+b` opens a CodeDiff split that shows a note pi wrote'
    771cf8ed42c5963b:
        hash: 2d48272d2b2aef70
        text: 'Verify no dangling reference: `dcp`, `mcpAdapter`, `piClaudeCodeUse`, and `interview` appear nowhere in `default.nix`'
    902e08f4d07307d6:
        hash: 124fc9b60ee12068
        text: 'Confirm the `~/.config/nvim` clone is safe to move: 176 tracked files, a clean status, and an empty `openspec/` with nothing untracked to lose'
    961ef0686050d759:
        hash: c888dc799704acf1
        text: Confirm the system build exits 0 with the config staged
    2328ea1a49ab584a:
        hash: 6491282a1a925370
        text: Copy the tracked files into `modules/home/programs/neovim/config/` with `git archive`, dropping `install.sh`, which only cloned the standalone repository
    3080b30468ac6b6c:
        hash: c9858f4086fbd874
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the render against the proposal `Behavior` criteria and D1 through D3. Adversarial review: waived by owner, on the grounds that the root cause was read directly from the paint loop and every artifact in the owner''s screenshot maps to it'
    9466c27e5a02deaf:
        hash: f17c62c5990e199a
        text: 'Replace the `Workspace` panel with `Changes`: add `summaryHeader` beside `panelHeader`, drop the branch, ahead, and untracked reads, and test for a repository with `git rev-parse --git-dir` rather than a current branch'
    39488e3343340323:
        hash: 1a8a89157828ac17
        text: Read `lastModified`, `completedTasks`, and `totalTasks` from `openspec list --json` instead of re-deriving them, which removes the stat fan-out and the `tasks.md` read and fixes the panel below the repository root (D2)
    97422e582fe818f5:
        hash: fb58ba3acedf4234
        text: Run `nix flake check` and build the four pi checks. All exit 0
    208188d8d3ef0a84:
        hash: 3940d5dcdd7c237c
        text: 'Fix what the review found in the surrounding work: the activation error named `programs.nh.flake` rather than `sysinit.neovim.configPath` and tested the directory rather than `init.lua`; the `renameSession` comment claimed a migration path the pinned binary does not contain; `checks/lua-parses.nix` had no guard for the largest Lua home in the repository; `checks/default.nix` was out of alphabetical order; and the moved `README.md` still told the reader to install from the repository this change abandons'
    211488d66e026998:
        hash: c46400a39d89dc0b
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the move against the proposal `Behavior` criteria and D9; revise until the loop reaches a terminal state (see the skill for the scaled round cap)'
    394170ca27821064:
        hash: 5edce12c4209ee65
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the review path against the proposal `Behavior` criteria and D5 through D7. Adversarial review: waived by owner, who redirected the phase to neovim-only mid-flight; the hunk half it would have reviewed no longer exists'
    553125fa6061a295:
        hash: 8050238309da182c
        text: 'Confirm the extension parses: `bun build --target=bun --no-bundle` on the file exits 0, and no reference to the removed `state.changes` shape remains'
    0601271d53571d6d:
        hash: 8c99dca59473cd49
        text: Remove the `McpServerInfo` interface, `getMcpServers`, `renderMcp`, and the `node:fs` and `node:os` imports they were the only users of (D3)
    7071215a9a099bff:
        hash: c6b31cdd0bd6c6a4
        text: Install it in `customExtensionFiles`, then verify against the built `home-manager-files` that the pi extension set is `diff-review.ts` plus the vendored files plus `openspec-sidebar`, with none of the three removed extensions
    a762bd6158dda323:
        hash: 9c1c14807587e018
        text: Allowlist the writing and reading forms beside `specutil lock`, and leave `diffnote clear` off it, because clearing discards notes the owner may not have read
    a936539212c9185a:
        hash: 443b156ef3e4b2f9
        text: 'Extend the check for all of it, then mutation test: ten mutations, ten caught, two only after correcting the mutation itself. `nvim_eval` now surfaces nvim''s stderr, because a Lua error produced empty stdout that read as a failed assertion rather than a probe that never ran'
    ad24fc619a96c932:
        hash: b4f07ede3b694f30
        text: Render one OpenSpec change with a `+N more` count. Pick it by directory modification time, and run `openspec status` for that one change only (D2)
    afc4739e86e515b0:
        hash: c1cc2fb3800c34da
        text: Move the writing forms of `diffnote` to allowlist tierB, keep the reading forms in tierA, and record that pi's gate is `@gotgenes/pi-permission-system` rather than this file
    b6af03267dcc7671:
        hash: a73094c83034e56b
        text: 'Mutation test the extended check: ten mutations, ten caught. Two needed the check strengthened first, one of which needed a case that drives a real producer failure. An eleventh showed the Lua trailing-slash strip was dead code because `vim.fs.joinpath` already collapses it, so the code was removed and the property pinned from both sides instead'
    b59a27d990aeac4c:
        hash: fe25dcf483eb42f1
        text: Use `nvim -c CodeDiff`, which opens the whole changeset with its file explorer, rather than `git difftool`'s one-pair-at-a-time form (D6)
    b14251261e472b2d:
        hash: 43c06e638fade6d7
        text: Align the chord with the sidebar on what "changed" means, and report "not a git repository" rather than a clean tree (D16). Name `author` inside the `ANNOTATE_PROMPT` payload shape it shows, and state that `line` is on the modified side
    bb26296deaa7a60d:
        hash: a56fcd1cb566d074
        text: Remove `pager.log = false` from `git/default.nix`. It existed only because hunk was `core.pager` and its TUI waited for a quit key on `git log` output
    c6a9ab623ce381ba:
        hash: b1d195528c860bd7
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the removal against the proposal `Behavior` criteria and D8b. Adversarial review: waived by owner, on the grounds that the removal is a grep-decidable absence and the build proves nothing else depended on it'
    c6b71e89fbd0b435:
        hash: 46495dbd7bf9f4a5
        text: 'Mutation test the check. Two mutations caught: shortening the Lua digest to 15 characters failed the path assertion, and dropping the clamp failed the extmark assertion. A third, moving the write before validation, was not run because the anchor was not unique; that property is asserted but not mutation-verified'
    c14a4740f00b58e0:
        hash: aa09bd48b94e670c
        text: 'Decide: the owner retired the `sysinit.nvim` remote (archived) and chose each unmanaged config''s fate. `pi-permission-system/config.json` moved into Nix, generated from `allowlist.nix`. `pi-rtk-optimizer/config.json` was deleted with its extension: the config held nothing but upstream defaults, and the extension rewrote `event.input.command` to `rtk <cmd>` forms that match none of the 13 deny globs, which under `yoloMode` auto-approve. `pkgs.rtk` and its `doCheck = false` overlay went with it, unreferenced. Still open: `~/.config/nvim.pre-inline`, the stale `mcp-cache.json`, and the hand-written `pi-openai-fast.json` and `pi-openai-verbosity.json`'
    cca3bfbe992f925a:
        hash: 7d4eef727176400d
        text: Call it from the three `CodeDiff` lifecycle hooks in `config/lua/plugins/codediff.lua`
    d7a50df54702c970:
        hash: f7f785bc5a77263a
        text: 'Adversarial review round 2 of K=2, against the revised artifacts, run on owner approval at the round boundary. NOT clean: three critics (fix-induced regression, correctness, whole-change integration) again returned surviving objections. Two were upheld independently by two critics: a control byte in a note''s PATH reached `diffnote list` and could forge a listing row, and `add` accepted a newline there that `apply` refused. The integration critic found that the neovim move silently dropped three tracked files, which the machine''s own ignore rules hid'
    d133a07fcca16156:
        hash: 56ca9bae50ce84da
        text: 'Return zero rows from a panel with nothing to report: an empty subagent list and an unavailable `openspec`'
    d80619115d774e79:
        hash: 6fc5ae4177cb337b
        text: 'Adversarial review (`adversarial-review` skill): critics attempt to break the removals against the proposal `Behavior` criteria and D3 and D8. Adversarial review: waived by owner, on the grounds that each removal was established by reading what the package reads at runtime against what this repository writes'
    dcb54ec420b6bd03:
        hash: b482ab11a961abbc
        text: 'Round 2 is the K=2 cap. Terminal state CAPPED, with the accepted-and- recorded items listed in the design `Risks` and the proposal `Non-goals` rather than fixed: lexical symlink resolution, note pruning policy, `printf *` as a general allowlist property, author authenticity, a stale lock after SIGKILL, the shared watch directory, and two dangling references inside the moved subtree (an `nvim-walkthrough` skill that exists nowhere, and `config/bin/nvim-ctl` which nothing puts on PATH)'
    de3291e9b3d7b1aa:
        hash: ce64ab80ddd97b78
        text: 'Add `config/lua/harness/diffnote.lua` (follows `config/lua/harness/spec_watch.lua`): read the note file, draw one extmark per note as virtual lines, clamp a stale line to the last line, and watch the store directory so a note lands in an open view (D10)'
    e579e1dde73dfe39:
        hash: 006dcde9698f32d4
        text: Remove `pi-mcp-adapter`, `@benvargas/pi-claude-code-use`, `pi-dcp`, and `pi-interview` from `piPackages` and `piPackagePaths`, delete their three lock files, and record above the list why each is absent so none returns silently (D8)
    edcf7a327ad6da7a:
        hash: 446a5a2d0af6418c
        text: 'Fix the renderer: validate `summary` so one malformed note cannot suppress its valid neighbours on a shared row, bound a row in rendered LINES as well as note count, make the visible selection stable by insertion order, and redraw every drawn buffer on refresh so a REMOVED note disappears'
    eeaf65c3985e48d3:
        hash: 87bb4350593b8119
        text: Drop `status-line` and `model-status` from `vendored-extensions.nix`, with a comment recording that the sidebar owns the turn count and the model, and that `model-status` also wrote an emoji and called `console.log` on every model change
    f8d9bd764a719ed5:
        hash: 82bb1315f9fdb188
        text: 'Add `extensions/diff-review.ts` (follows the extension shape in `extensions/openspec-sidebar/index.ts`): `ctrl+b` and `/review` open the working-tree diff in a neovim split'
    f082feaaa9a16fa8:
        hash: 179c288345f685c1
        text: Build it in `runtime/default.nix` and install it in `llm/default.nix`
    f187b364518ab265:
        hash: 3e835afa5fc17387
        text: Run `nix flake check` and confirm it exits 0, including the new check
    fe6d6e69ac144da3:
        hash: 83cd2d59500d482a
        text: 'Adversarial review (`adversarial-review` skill), round 1 of K=2. NOT clean: three critics (correctness, ops, security) each returned surviving objections with reproductions. Two were upheld by all three: `..` escaped the repository, and a failed write zeroed the store into a state that absorbed every later note while reporting success. Also fixed: the logical-versus-physical cwd, stop() clearing one buffer instead of all, float and leading-zero line numbers, an `oldLine`-only comment anchored on the wrong side, escape injection through `diffnote list`, a forgeable signature line, no lock between writers, quadratic batch cost, a valueless flag exiting with no message, a timer leak, and a root cached across repositories. The allowlist tier was wrong and pi does not read that file at all'
