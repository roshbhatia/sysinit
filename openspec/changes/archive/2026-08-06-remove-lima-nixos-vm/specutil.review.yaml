    a1b1b66d3caff79e:
        hash: c5e971fcaca34afc
        text: 'Result: the build produced the SAME store path as the running system, `+0 -0` paths and 0 bytes. The expectation in this task was wrong. There was no `lima-*` launch agent to remove on this machine, because `sysinit.darwin.lima.instanceName` defaulted to `""` and the `lib.optionalAttrs` guard therefore never generated it. `launchctl list` confirms only `org.nixos.colima` was ever loaded'
    a503ef5bf8f2cfe4:
        hash: df2477c0af505dd8
        text: 'Downstream break, not predicted by the proposal: `sysinit.laurel` declared `nixos-lima.follows = "sysinit/nixos-lima"`, so removing the input made that repo''s lock update fail. The proposal said no in-tree consumer followed the input and did not enumerate the out-of-tree one. Fixed by removing that line in `sysinit.laurel`, mirroring the same removal in `templates/discrete/flake.nix`'
    aa1c6ae7382ec3c7:
        hash: 1b15c8c2edcd6291
        text: 'Run the Behavior grep: `rg -i lima` over the tracked tree, excluding `openspec/` and `flake.lock`, returns only `pkgs.lima`, the colima block, and the `overlays/default.nix` history comment'
    aa90a28a6153f502:
        hash: 5584e408390ca555
        text: 'Review finding: the darwin criteria named an empty generation diff as their evidence, because the live Mac builds from `sysinit.laurel`, which never set the option. Rewrote them to build `lv426`, this repository''s own darwin host: its toplevel store path changes, its launch agents contain `org.nixos.colima.plist` and no `lima-*` plist, and no file in that output mentions lima. Recording "the expectation was wrong" in a task while leaving a false criterion standing in the proposal was the actual error'
    b59d39a98d546afa:
        hash: 6beaf65daadf25b2
        text: Remove the `nixos-lima` input from `flake.nix`, then regenerate `flake.lock` and confirm only `nixos-lima` nodes left it
    c934480f9751ff74:
        hash: c71d11c4d829bb97
        text: 'Confirm: `command -v limactl` resolves to `/run/current-system/sw/bin/limactl` and `org.nixos.colima` is still loaded'
    d2fe7b54e9e5b5f3:
        hash: 52d246ca4f42fe05
        text: Remove the `sysinit.darwin.lima.instanceName` option from `modules/darwin/options.nix`, leaving every `sysinit.darwin.colima.*` option
    d9cdf91432763570:
        hash: 40d0b7cc988a75ac
        text: Run `nix flake check` and confirm it exits 0
    ebe3ea3ac2d8d421:
        hash: 28b2f0fb34132abc
        text: 'Build only: `nh darwin build`, which writes no system change'
    f549e7688e840cd9:
