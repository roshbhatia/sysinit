id: nix-overlay-test-skip
language: nix
severity: warning
message: "A test-skip override in overlays/ goes stale silently."
note: |
  `doCheck = false`, `disabledTests`, and `disabledTestPaths` on an existing
  nixpkgs package only perturb the derivation hash. Once Hydra caches the
  pristine package, the override stops buying anything and starts forcing a
  local source build of something already substitutable. AGENTS.md records
  this; run the `nix-cache-audit` skill before adding one, and keep the result
  out of `cacheAttrs` in flake.nix.

  This fires only inside `.override`, `.overrideAttrs`, and
  `.overridePythonAttrs`. A package the overlay defines itself has no upstream
  build to displace, so its test skip is not a finding.
files:
  - "overlays/**/*.nix"
rule:
  all:
    - any:
        - pattern:
            context: "{ doCheck = false; }"
            selector: binding
        - pattern:
            context: "{ disabledTests = $V; }"
            selector: binding
        - pattern:
            context: "{ disabledTestPaths = $V; }"
            selector: binding
    # Only an override of a package that already exists upstream.
    - inside:
        stopBy: end
        kind: apply_expression
        has:
          field: function
          kind: select_expression
          regex: "\\.(overrideAttrs|overridePythonAttrs|override)$"
