<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* The panel is drawn here rather than by `hs.chooser`, because a chooser is an AppKit
         list with three colour knobs and cannot carry a search field, a footer, or rows of
         its own shape. */
      :root {
        --bg: rgba(30, 30, 32, 0.96);
        --edge: rgba(255, 255, 255, 0.09);
        --line: rgba(255, 255, 255, 0.07);
        --text: #f3f3f5;
        --muted: rgba(255, 255, 255, 0.42);
        --faint: rgba(255, 255, 255, 0.3);
        --sel: rgba(255, 255, 255, 0.1);
        --badge: rgba(255, 255, 255, 0.1);
        --cap: rgba(255, 255, 255, 0.09);
      }

      /* The window follows the system appearance, so the panel does too. */
      @media (prefers-color-scheme: light) {
        :root {
          --bg: rgba(247, 247, 249, 0.97);
          --edge: rgba(0, 0, 0, 0.12);
          --line: rgba(0, 0, 0, 0.08);
          --text: #17171a;
          --muted: rgba(0, 0, 0, 0.45);
          --faint: rgba(0, 0, 0, 0.32);
          --sel: rgba(0, 0, 0, 0.07);
          --badge: rgba(0, 0, 0, 0.08);
          --cap: rgba(0, 0, 0, 0.07);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
        cursor: default;
        user-select: none;
      }

      /* The window's own shadow is square, and the panel is not, so the shadow is drawn in
         here inside a transparent margin. */
      #frame {
        padding: 26px;
        height: 100%;
      }

      #panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 12px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      #search {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 56px;
        flex: 0 0 56px;
        padding: 0 17px;
        border-bottom: 1px solid var(--line);
      }

      #search svg {
        flex: 0 0 17px;
        color: var(--faint);
      }

      #q {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: 19px -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #q::placeholder {
        color: var(--faint);
      }

      #list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px;
      }

      #list::-webkit-scrollbar {
        width: 0;
      }

      #head {
        padding: 6px 10px 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 10px;
        border-radius: 8px;
      }

      .row.sel {
        background: var(--sel);
      }

      .row .icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .row .badge {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--badge);
        color: var(--muted);
        font-size: 11px;
        line-height: 20px;
        text-align: center;
      }

      .row .title {
        flex: 0 1 auto;
        max-width: 60%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .row .sub {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
        color: var(--muted);
      }

      .row .kind {
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 12px;
        font-size: 12.5px;
        color: var(--faint);
      }

      #empty {
        padding: 26px 12px;
        text-align: center;
        color: var(--faint);
      }

      #footer {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        flex: 0 0 40px;
        padding: 0 14px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }

      #action {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #hints {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      kbd {
        display: inline-block;
        min-width: 17px;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--cap);
        color: var(--muted);
        font: 11px -apple-system, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="panel">
        <div id="search">
          <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="6.8" cy="6.8" r="4.6" />
            <path d="M10.4 10.4 L14 14" stroke-linecap="round" />
          </svg>
          <input id="q" placeholder="Search" spellcheck="false" autocomplete="off" />
        </div>
        <div id="list"></div>
        <div id="footer">
          <span id="action"></span>
          <span id="hints">
            <kbd>&#8629;</kbd> Open <kbd>&#8679;J</kbd> <kbd>&#8679;K</kbd> Move <kbd>esc</kbd> Close
          </span>
        </div>
      </div>
    </div>

    <script>
      const HEIGHT = { chrome: 96 + 52, row: 40, list: 12, visible: 9, empty: 74 };

      let rows = [];
      let shown = [];
      let sel = 0;
      let armed = false;
      let icons = {};

      const el = {
        q: document.getElementById("q"),
        list: document.getElementById("list"),
        action: document.getElementById("action"),
      };

      function send(message) {
        window.webkit.messageHandlers.launcher.postMessage(message);
      }

      function escape(text) {
        return String(text == null ? "" : text).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      // A subsequence match, scored so a hit at the start of a word beats one in the middle
      // and a run of adjacent letters beats a scattered one. Returns null for no match, so
      // typing narrows the list the way a reader expects rather than reordering it wholesale.
      function score(text, needle) {
        const haystack = text.toLowerCase();
        let at = 0;
        let total = 0;
        let streak = 0;
        for (let i = 0; i < needle.length; i++) {
          const found = haystack.indexOf(needle[i], at);
          if (found < 0) {
            return null;
          }
          if (found === 0) {
            total += 14;
          } else if (" -_/:.".includes(haystack[found - 1])) {
            total += 9;
          }
          streak = found === at ? streak + 1 : 0;
          total += streak * 4 - (found - at) * 0.4;
          at = found + 1;
        }
        return total;
      }

      function filter() {
        const needle = el.q.value.trim().toLowerCase();
        if (needle === "") {
          // The order handed over, which is by how recently each row was opened.
          shown = rows.slice();
          return;
        }
        const hits = [];
        rows.forEach((row, index) => {
          const title = score(row.title || "", needle);
          const sub = score(row.sub || "", needle);
          const best = Math.max(title == null ? -1e9 : title, sub == null ? -1e9 : sub * 0.5);
          if (best > -1e9) {
            hits.push({ row: row, at: best, index: index });
          }
        });
        hits.sort((a, b) => (b.at !== a.at ? b.at - a.at : a.index - b.index));
        shown = hits.map((hit) => hit.row);
      }

      function draw() {
        if (sel >= shown.length) {
          sel = Math.max(0, shown.length - 1);
        }
        if (shown.length === 0) {
          el.list.innerHTML = '<div id="empty">No results</div>';
          el.action.textContent = "";
          resize();
          return;
        }
        const parts = ['<div id="head">Results</div>'];
        shown.forEach((row, index) => {
          const art = row.icon
            ? '<img class="icon" src="' + icons[row.icon] + '">'
            : '<div class="badge">' + escape(row.badge || "") + "</div>";
          parts.push(
            '<div class="row' +
              (index === sel ? " sel" : "") +
              '" data-index="' +
              index +
              '">' +
              art +
              '<span class="title">' +
              escape(row.title) +
              "</span>" +
              '<span class="sub">' +
              escape(row.sub) +
              "</span>" +
              '<span class="kind">' +
              escape(row.kind) +
              "</span></div>",
          );
        });
        el.list.innerHTML = parts.join("");
        el.action.textContent = shown[sel].kind || "";
        resize();
      }

      // The window is only as tall as the rows it has, so a two-hit search is not a panel of
      // empty space.
      function resize() {
        const count = Math.min(shown.length, HEIGHT.visible);
        const body = shown.length === 0 ? HEIGHT.empty : HEIGHT.list + 24 + count * HEIGHT.row;
        send({ action: "height", height: HEIGHT.chrome + body });
      }

      function move(step) {
        if (shown.length === 0) {
          return;
        }
        sel = Math.min(shown.length - 1, Math.max(0, sel + step));
        const rows = el.list.querySelectorAll(".row");
        rows.forEach((row, index) => row.classList.toggle("sel", index === sel));
        el.action.textContent = shown[sel].kind || "";
        if (rows[sel]) {
          rows[sel].scrollIntoView({ block: "nearest" });
        }
      }

      function choose(index) {
        const row = shown[index];
        if (row) {
          send({ action: "open", index: row.index });
        }
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        if (key === "ArrowDown" || (event.shiftKey && (key === "J" || key === "j"))) {
          event.preventDefault();
          move(1);
        } else if (key === "ArrowUp" || (event.shiftKey && (key === "K" || key === "k"))) {
          event.preventDefault();
          move(-1);
        } else if (key === "Enter") {
          event.preventDefault();
          choose(sel);
        } else if (key === "Escape") {
          event.preventDefault();
          send({ action: "close" });
        }
      });

      el.q.addEventListener("input", () => {
        sel = 0;
        filter();
        draw();
      });

      el.list.addEventListener("mousemove", (event) => {
        const row = event.target.closest(".row");
        if (row) {
          const index = Number(row.dataset.index);
          if (index !== sel) {
            move(index - sel);
          }
        }
      });

      el.list.addEventListener("click", (event) => {
        const row = event.target.closest(".row");
        if (row) {
          choose(Number(row.dataset.index));
        }
      });

      // Closing on focus loss is how a launcher gets out of the way, but the panel is focused
      // just after it is shown, so the handler is armed a beat later and confirms the loss.
      window.addEventListener("blur", () => {
        if (!armed) {
          return;
        }
        setTimeout(() => {
          if (!document.hasFocus()) {
            send({ action: "close" });
          }
        }, 130);
      });

      function setIcons(fresh) {
        Object.keys(fresh).forEach((key) => {
          icons[key] = fresh[key];
        });
      }

      function setRows(fresh) {
        rows = fresh;
        filter();
        draw();
      }

      // Loading the page is asynchronous, and rows handed over before it finishes are lost,
      // so the page says when it is ready rather than the caller guessing.
      send({ action: "loaded" });

      function open(placeholder) {
        armed = false;
        el.q.placeholder = placeholder;
        el.q.value = "";
        sel = 0;
        el.q.focus();
        setTimeout(() => {
          armed = true;
        }, 500);
      }
    </script>
  </body>
</html>
