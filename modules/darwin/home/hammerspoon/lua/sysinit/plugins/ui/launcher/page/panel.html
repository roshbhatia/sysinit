<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* The panel is drawn here rather than by `hs.chooser`, because a chooser is an AppKit
         list with three colour knobs and cannot carry a search field, a footer, or rows of
         its own shape. */
      :root {
        --bg: rgba(30, 30, 32, 0.96);
        --edge: rgba(255, 255, 255, 0.09);
        --line: rgba(255, 255, 255, 0.07);
        --text: #f3f3f5;
        --muted: rgba(255, 255, 255, 0.42);
        --faint: rgba(255, 255, 255, 0.3);
        --sel: rgba(255, 255, 255, 0.1);
        --badge: rgba(255, 255, 255, 0.1);
        --cap: rgba(255, 255, 255, 0.09);
        --accent: #7aa2f7;
      }

      /* The window follows the system appearance, so the panel does too. */
      @media (prefers-color-scheme: light) {
        :root {
          --bg: rgba(247, 247, 249, 0.97);
          --edge: rgba(0, 0, 0, 0.12);
          --line: rgba(0, 0, 0, 0.08);
          --text: #17171a;
          --muted: rgba(0, 0, 0, 0.45);
          --faint: rgba(0, 0, 0, 0.32);
          --sel: rgba(0, 0, 0, 0.07);
          --badge: rgba(0, 0, 0, 0.08);
          --cap: rgba(0, 0, 0, 0.07);
          --accent: #3b5bdb;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
        cursor: default;
        user-select: none;
      }

      /* No shadow of its own: a blur drawn here is clipped at the window edge and reads as a
         square smudge around the rounded panel. The window's shadow follows this shape,
         because a transparent window is shadowed by the part of it that is opaque. */
      #panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--edge);
        border-radius: 14px;
        transform-origin: 50% 12%;

        /* Invisible until the page is told to reveal it. The window is shown before this
           page has reset itself, and painting the panel in between is what made a press of
           the hotkey flash the previous search before showing the new one. Nothing is drawn
           until there is something correct to draw. */
        opacity: 0;

        /* The window is resized to fit its rows, and the panel animates to the same height
           so the two arrive together instead of the window snapping first. */
        transition: height 190ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* The resting visible state. It is a plain class rather than the end of an animation
         with a fill mode, so a webview that never advances the animation still shows a
         finished panel rather than an invisible one. */
      #panel.shown {
        opacity: 1;
      }

      /* Only transform and opacity are animated, so the whole open runs on the compositor
         and never relayouts the list underneath it. */
      #panel.opening {
        animation: rise 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      #panel.closing {
        animation: sink 110ms cubic-bezier(0.4, 0, 1, 1) both;
      }

      /* Height is the one thing not animated during the open or the close: it is being set
         to its starting value, and easing it from whatever the last search left behind
         would read as the panel growing out of the previous one. */
      #panel.instant {
        transition: none;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.975);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes sink {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.985);
        }
      }

      /* The list arrives just behind the panel, which is what reads as motion rather than a
         jump. It moves as one block: a per-row delay would need a fill mode to hold each row
         back, and without one every delayed row shows, hides, then slides. */
      #panel.opening #list {
        animation: settle 240ms cubic-bezier(0.2, 0.9, 0.25, 1);
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #search {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 58px;
        flex: 0 0 58px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }

      #search svg {
        flex: 0 0 17px;
        color: var(--faint);
      }

      #q {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: 19px -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #q::placeholder {
        color: var(--faint);
      }

      #body {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      #list {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 6px;
      }

      /* The preview pane, shown only for a list that has something to preview. */
      #preview {
        display: none;
        flex: 0 0 57%;
        overflow: auto;
        padding: 12px 14px;
        border-left: 1px solid var(--line);
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        line-height: 1.45;
        white-space: pre;
        color: var(--text);
      }

      #panel.split #preview {
        display: block;
      }

      #panel.split #list {
        flex: 0 0 43%;
      }

      #preview::-webkit-scrollbar {
        width: 0;
      }

      #list::-webkit-scrollbar {
        width: 0;
      }

      .head {
        padding: 6px 10px 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        color: var(--faint);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 10px;
        border-radius: 8px;
      }

      .row.sel {
        background: var(--sel);
      }

      .row .icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .row .badge {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--badge);
        color: var(--muted);
        font-size: 11px;
        line-height: 20px;
        text-align: center;
      }

      /* A drawn mark, for a row that stands for a kind of thing rather than one app. */
      .row .glyph {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--badge);
        color: var(--muted);
      }

      .row .glyph svg {
        width: 13px;
        height: 13px;
      }

      .row .title {
        flex: 0 1 auto;
        max-width: 52%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .row .sub {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12.5px;
        color: var(--muted);
        direction: rtl;
        text-align: left;
      }

      .row .kind {
        flex: 0 0 auto;
        margin-left: auto;
        padding-left: 12px;
        font-size: 12.5px;
        color: var(--faint);
      }

      /* The answer is the point of the row, so it is set like one rather than like a name
         that happens to be a number. */
      .row.sum .title {
        max-width: none;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .row.sum .glyph {
        color: var(--accent);
      }

      /* The right-to-left trick that keeps the tail of a long path visible would show a sum
         back to front. */
      .row.sum .sub {
        direction: ltr;
      }

      #empty {
        padding: 26px 12px;
        text-align: center;
        color: var(--faint);
      }

      #footer {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        flex: 0 0 40px;
        padding: 0 14px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }

      #action {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #hints {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      kbd {
        display: inline-block;
        min-width: 17px;
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--cap);
        color: var(--muted);
        font: 11px -apple-system, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="g-clipboard" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <rect x="3.4" y="2.6" width="9.2" height="11.4" rx="1.6" />
          <path d="M6 2.6V1.9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v0.7" stroke-linecap="round" />
        </g>
        <g id="g-file" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M4 1.6h5l3 3v9.2a0.8 0.8 0 0 1-0.8 0.8H4a0.8 0.8 0 0 1-0.8-0.8V2.4A0.8 0.8 0 0 1 4 1.6Z" />
          <path d="M9 1.6v3.2h3" />
        </g>
        <g id="g-folder" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M1.8 4.2A1 1 0 0 1 2.8 3.2h3l1.4 1.6h5A1 1 0 0 1 13.2 5.8v6.4a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1Z" />
        </g>
        <g id="g-command" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path
            d="M6 6h4v4H6ZM6 6a2 2 0 1 0-2-2 2 2 0 0 1 2 2Zm4 0a2 2 0 1 1 2-2 2 2 0 0 0-2 2Zm0 4a2 2 0 1 0 2 2 2 2 0 0 1-2-2Zm-4 0a2 2 0 1 1-2 2 2 2 0 0 0 2-2Z"
          />
        </g>
        <g id="g-sum" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3.2 5.4h9.6M3.2 10.6h9.6" />
        </g>
      </defs>
    </svg>

    <div id="panel">
      <div id="search">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="6.8" cy="6.8" r="4.6" />
          <path d="M10.4 10.4 L14 14" stroke-linecap="round" />
        </svg>
        <input id="q" placeholder="Search" spellcheck="false" autocomplete="off" />
      </div>
      <div id="body">
        <div id="list"><div id="rows"></div></div>
        <div id="preview"></div>
      </div>
      <div id="footer">
        <span id="action"></span>
        <span id="hints"></span>
      </div>
    </div>

    <script>
      /* INCLUDE match.js */
      /* INCLUDE calc.js */

      // Ten rows and a heading, above the panel's own 58px search field and 40px footer.
      const CHROME = 100;
      const LIST_MAX = 436;
      const LIST_FLOOR = 356;
      // The padding around the rows, which their own wrapper does not carry.
      const LIST_PAD = 12;
      // Only ever a screenful and a bit is drawn. Matching can return hundreds of rows, and
      // building a node for each one costs more than every other part of a keystroke put
      // together, for rows nobody scrolls to.
      const DRAW_CAP = 100;
      const DEFAULT_HINTS = [
        ["&#8629;", "Open"],
        ["&#8679;J", ""],
        ["&#8679;K", "Move"],
        ["esc", "Close"],
      ];

      // What the panel shows for an empty query, and what it shows now.
      let base = [];
      let shown = [];
      let sel = 0;
      let armed = false;
      let icons = {};
      // Whether this list previews its selection, whether escape leaves it for the list it
      // was opened from, and whether the page holds all of its rows. A list too large to
      // hold is matched by fzf out of process instead.
      let split = false;
      let nested = false;
      let inpage = true;
      let asked = null;
      // fzf replies out of order, so a query is stamped and a reply that comes back after a
      // newer keystroke is dropped rather than drawn.
      let seq = 0;
      let settled = 0;
      let pending = null;
      let height = 0;
      let hints = DEFAULT_HINTS;

      // An empty Lua table encodes as an object, so a list arriving from Lua is only trusted
      // to be a list once it says so.
      function listed(value) {
        return Array.isArray(value) ? value : [];
      }

      const el = {
        q: document.getElementById("q"),
        list: document.getElementById("list"),
        rows: document.getElementById("rows"),
        action: document.getElementById("action"),
        panel: document.getElementById("panel"),
        preview: document.getElementById("preview"),
        hints: document.getElementById("hints"),
      };

      function send(message) {
        window.webkit.messageHandlers.launcher.postMessage(message);
      }

      function escape(text) {
        return String(text == null ? "" : text).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function ask(query) {
        seq += 1;
        const mine = seq;
        if (pending !== null) {
          clearTimeout(pending);
        }
        pending = setTimeout(() => {
          pending = null;
          send({ action: "filter", query: query, seq: mine });
        }, 24);
      }

      function setMatches(answer) {
        if (answer.seq <= settled) {
          return;
        }
        settled = answer.seq;
        shown = prelude(el.q.value.trim()).concat(listed(answer.rows));
        sel = 0;
        draw();
      }

      // The row above the search results, for a query that is a sum rather than a name.
      function prelude(query) {
        const sum = calculate(query);
        if (sum === null) {
          return [];
        }
        return [
          {
            title: sum.result,
            sub: sum.expression,
            kind: "Calculator",
            glyph: "sum",
            sum: true,
            copy: sum.result.replace(/,/g, ""),
          },
        ];
      }

      function art(row) {
        if (row.icon) {
          return '<img class="icon" src="' + icons[row.icon] + '">';
        }
        if (row.glyph) {
          return '<div class="glyph"><svg viewBox="0 0 16 16"><use href="#g-' + escape(row.glyph) + '"/></svg></div>';
        }
        return '<div class="badge">' + escape(row.badge || "") + "</div>";
      }

      // `instant` is for a list that is opening: it is being drawn at its starting size, and
      // easing to that from whatever the last search left behind would read as this panel
      // growing out of the previous one.
      function draw(instant) {
        if (sel >= shown.length) {
          sel = Math.max(0, shown.length - 1);
        }
        if (shown.length === 0) {
          el.rows.innerHTML = '<div id="empty">No results</div>';
          el.action.textContent = "";
          el.preview.textContent = "";
          resize(instant);
          return;
        }
        const parts = [];
        let heading = null;
        const count = Math.min(shown.length, DRAW_CAP);
        for (let index = 0; index < count; index++) {
          const row = shown[index];
          const wanted = row.sum ? "Calculator" : el.q.value.trim() === "" ? "Recent" : "Results";
          if (wanted !== heading) {
            heading = wanted;
            parts.push('<div class="head">' + heading + "</div>");
          }
          parts.push(
            '<div class="row' +
              (row.sum ? " sum" : "") +
              (index === sel ? " sel" : "") +
              '" data-index="' +
              index +
              '">' +
              art(row) +
              '<span class="title">' +
              escape(row.title) +
              "</span>" +
              '<span class="sub">' +
              escape(row.sub) +
              "</span>" +
              '<span class="kind">' +
              escape(row.kind) +
              "</span></div>",
          );
        }
        el.rows.innerHTML = parts.join("");
        el.action.textContent = shown[sel].kind || "";
        showHints();
        preview();
        resize(instant);
      }

      // The window is only as tall as the rows it has, so a two-hit search is not a panel of
      // empty space. Measured rather than counted, because a heading is not a row and the
      // number of headings depends on what matched. The rows are measured through their own
      // wrapper: the scrolling box around them never reports less than its own height, so
      // asking it would let the panel grow and never shrink.
      function resize(instant) {
        let body = Math.min(el.rows.offsetHeight + LIST_PAD, LIST_MAX);
        if (split) {
          body = Math.max(body, LIST_FLOOR);
        }
        setHeight(CHROME + body, instant === true);
      }

      // The panel eases to its new height and tells Lua the same number, so the window and
      // what it holds move together. Growing needs the window first or the panel is drawn
      // clipped; shrinking needs it last, for the same reason.
      function setHeight(px, instant) {
        if (px === height) {
          return;
        }
        height = px;
        if (instant) {
          el.panel.classList.add("instant");
        }
        el.panel.style.height = px + "px";
        if (instant) {
          void el.panel.offsetWidth;
          el.panel.classList.remove("instant");
        }
        send({ action: "height", height: px, instant: instant === true });
      }

      // The preview is drawn by a tool that takes a moment, so it is asked for once the
      // selection settles rather than on every key of a held-down move.
      function preview() {
        if (!split) {
          return;
        }
        const row = shown[sel];
        if (asked !== null) {
          clearTimeout(asked);
        }
        asked = setTimeout(() => {
          asked = null;
          if (row && row.index !== undefined) {
            send({ action: "preview", index: row.index });
          }
        }, 70);
      }

      function setPreview(answer) {
        const row = shown[sel];
        // Only if the selection has not moved on while the tool was running.
        if (row && row.index === answer.index) {
          el.preview.innerHTML = answer.html;
          el.preview.scrollTop = 0;
        }
      }

      function move(step) {
        if (shown.length === 0) {
          return;
        }
        const cap = Math.min(shown.length, DRAW_CAP);
        sel = Math.min(cap - 1, Math.max(0, sel + step));
        const drawn = el.list.querySelectorAll(".row");
        drawn.forEach((row, index) => row.classList.toggle("sel", index === sel));
        el.action.textContent = shown[sel].kind || "";
        showHints();
        if (drawn[sel]) {
          drawn[sel].scrollIntoView({ block: "nearest" });
        }
        preview();
      }

      function choose(index, mods) {
        const row = shown[index];
        if (!row) {
          return;
        }
        if (row.sum) {
          send({ action: "copy", text: row.copy });
          return;
        }
        // The row's own text goes back with it, because a list too large to hold
        // cannot look up a row by index alone.
        send({ action: "open", index: row.index, text: row.sub, mods: mods || {} });
      }

      // Matching for a list the page holds costs nothing but the work itself, so it is done
      // on the keystroke rather than debounced and sent away.
      function refine() {
        const query = el.q.value.trim();
        if (query === "") {
          // An emptied field returns to the handed-over order, which matching cannot
          // reproduce: it is by how recently each row was opened.
          if (pending !== null) {
            clearTimeout(pending);
            pending = null;
          }
          seq += 1;
          settled = seq;
          shown = base.slice();
          sel = 0;
          draw();
          return;
        }
        if (inpage) {
          shown = prelude(query).concat(rank(query, base));
          sel = 0;
          draw();
          return;
        }
        ask(query);
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key;
        if (key === "ArrowDown" || (event.shiftKey && (key === "J" || key === "j"))) {
          event.preventDefault();
          move(1);
        } else if (key === "ArrowUp" || (event.shiftKey && (key === "K" || key === "k"))) {
          event.preventDefault();
          move(-1);
        } else if (key === "Enter") {
          event.preventDefault();
          choose(sel, { shift: event.shiftKey, alt: event.altKey });
        } else if (event.metaKey && (key === "c" || key === "C")) {
          event.preventDefault();
          choose(sel, { cmd: true });
        } else if (key === "Escape") {
          event.preventDefault();
          send({ action: nested ? "back" : "close" });
        }
      });

      el.q.addEventListener("input", refine);

      el.list.addEventListener("mousemove", (event) => {
        const row = event.target.closest(".row");
        if (row) {
          const index = Number(row.dataset.index);
          if (index !== sel) {
            move(index - sel);
          }
        }
      });

      el.list.addEventListener("click", (event) => {
        const row = event.target.closest(".row");
        if (row) {
          choose(Number(row.dataset.index), {});
        }
      });

      // Closing on focus loss is how a launcher gets out of the way, but the panel is focused
      // just after it is shown, so the handler is armed a beat later and confirms the loss.
      window.addEventListener("blur", () => {
        if (!armed) {
          return;
        }
        setTimeout(() => {
          if (!document.hasFocus()) {
            send({ action: "close" });
          }
        }, 130);
      });

      function setIcons(fresh) {
        Object.keys(fresh).forEach((key) => {
          icons[key] = fresh[key];
        });
      }

      // Matching reads these on every keystroke, so each row carries its prepared fields
      // rather than having them rebuilt per query.
      function setRows(fresh) {
        base = listed(fresh);
        for (const row of base) {
          row.f_title = prepare(row.title || "");
          row.f_sub = row.sub ? prepare(row.sub) : null;
        }
        refine();
      }

      function setHints(list) {
        hints = Array.isArray(list) && list.length > 0 ? list : DEFAULT_HINTS;
        showHints();
      }

      // Enter copies a sum and opens everything else, so the footer says which.
      function showHints() {
        const copying = shown[sel] && shown[sel].sum === true;
        el.hints.innerHTML = hints
          .map(([cap, label], index) => {
            const text = copying && index === 0 ? "Copy" : label;
            return "<kbd>" + cap + "</kbd>" + (text ? " " + escape(text) : "");
          })
          .join(" ");
      }

      // Loading the page is asynchronous, and rows handed over before it finishes are lost,
      // so the page says when it is ready rather than the caller guessing.
      send({ action: "loaded" });

      // Everything a list needs before it can be seen. Called while the window is hidden, so
      // the reset costs nothing visible and the window is already the right size when it is
      // shown.
      function open(opts) {
        armed = false;
        // A keystroke from the list being left must not filter the list being entered.
        if (pending !== null) {
          clearTimeout(pending);
          pending = null;
        }
        split = opts.split === true;
        nested = opts.nested === true;
        inpage = opts.inpage === true;
        el.panel.classList.toggle("split", split);
        el.panel.classList.remove("closing");
        el.preview.innerHTML = "";
        el.q.placeholder = opts.placeholder;
        el.q.value = "";
        setHints(opts.hints);
        sel = 0;
        settled = seq;
        shown = base.slice();
        draw(true);
      }

      // Split from `open` so the window can be shown in between: the panel is only painted
      // once it holds the right rows at the right size.
      function reveal() {
        el.q.focus();
        el.panel.classList.add("shown");
        // Reading the layout between the remove and the add restarts the animation rather
        // than letting the class change coalesce into no change at all.
        el.panel.classList.remove("opening");
        void el.panel.offsetWidth;
        el.panel.classList.add("opening");
        setTimeout(() => {
          armed = true;
        }, 500);
      }

      function dismiss() {
        armed = false;
        el.panel.classList.remove("opening");
        el.panel.classList.add("closing");
      }

      // Back to the invisible resting state, once the window is hidden.
      function reset() {
        el.panel.classList.remove("shown", "opening", "closing");
      }
    </script>
  </body>
</html>
