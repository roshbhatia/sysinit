name: spec-driven
version: 2
description: Rosh's opinionated OpenSpec workflow - proposal, design, then shaped tasks, with extra authoring rules
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Non-goals**: When the change touches more than one capability, fill in a `### Non-goals` block under `## What Changes` listing the work explicitly NOT included. This rule is enforced by the spec-driven schema; omit only for trivially-scoped single-capability changes.
      - **Behavior**: State what the change must do, and what must still hold when it lands. Write each entry so a command or an observation can decide it. This replaces the requirement spec: the acceptance criteria live here, next to the reason for them, and nothing is promoted to a separate spec corpus.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      **Steps.** Run them in order; do not skip to writing.

      1. Run `spec-preflight proposal`. It runs the deterministic rules for you:
         the `specutil check` rubric, `citelock` if the change carries a lock, a
         survey of existing modules matching the proposal's own vocabulary, and
         the presence of a non-empty Behavior section. Fix what it reports.
      2. From its reuse candidates, name in `What Changes` the closest existing
         module by path, and say what is reused against what is introduced. If
         nothing fits, say that. Inventing parallel infrastructure beside an
         established pattern is a default-reject. The script lists candidates; it
         cannot judge closeness, so this judgement is yours.
      3. Shape the change so it lands incrementally: each capability reviewable,
         buildable, and verifiable on its own. If it is genuinely atomic, say so
         in `Impact` and say why.
      4. In `Impact`, enumerate every action that mutates shared state, is hard to
         reverse, or needs confirmation: `nh darwin switch`, `openspec archive`,
         `git push`, network writes, schema migrations, vendored-content updates,
         removal of a public surface. Each becomes a human checkpoint in tasks.md.
      5. In `Impact`, name the gating signal if one exists: a feature flag, kill
         switch, config toggle, or staged sequence. Here that is usually
         `nix build .#darwinConfigurations.lv426.system` before `nh darwin switch`.
      6. State which judgement stays with the owner. Automation evidence and model
         critique are never approval.

      Rules the preflight already enforces, listed so you know not to hand-check
      them: no em-dash in prose, no bolded first term in a bullet outside the
      format keywords (`WHEN`, `THEN`, `AND`, `SHAPE`, `STOP`, `MAX-ITERS`,
      `BREAKING`), every external-factual claim anchored in `citations.lock`.

      **Voice.** A proposal is a design document, so it follows the same voice
      contract as one. Load the `writing-doc-design` skill, which carries the
      shared `_shared/doc-voice.md` fragment; do not re-derive it here.

      Two parts of that fragment bind hardest and are judged in review:

      - RFC 2119 keywords carry every normative statement, and the declaration
        block at the top of the template MUST stay. This is what replaces bolded
        emphasis: where you would have written `**Required:**`, write MUST and
        leave the prose unbolded. Uppercase only when the word carries normative
        force, so a reader can scan for requirements.
      - Simplified Technical English: one instruction per sentence, active
        voice, one term for one concept, no invented metaphors. Do not vary a
        term for style; reuse it.

      **Citations are linked, not just locked.** Every external-factual claim in
      prose MUST carry an inline reference to its `citations.lock` record id,
      written `[cite: <id>]`. A lock the prose never points at makes a reader
      diff two files by hand to find which sentence a record backs, and makes an
      orphaned record invisible. The reference is what turns the lock from an
      appendix into something a reader can follow.

      IMPORTANT: The Behavior section is critical. It is the rubric every later
      artifact is reviewed against, and the adversarial review reads it directly.
      An entry no command and no observation can decide is not acceptance criteria.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - design and tasks both build on this.
    requires: []

  - id: citations
    generates: citations.lock
    description: Pinned external-factual claims, verified offline by citelock
    template: citations.lock
    instruction: |
      Pin every external-factual claim the proposal makes, so the offline gate
      is a pure function of the repository rather than of what a website says
      today.

      This artifact is REQUIRED for every change, including changes that cite
      nothing. An absent lock is ambiguous: it cannot distinguish "there was
      nothing to cite" from "nobody looked". A lock with an empty `records`
      list says the first one, on the record.

      **What counts as an external-factual claim.** Anything whose truth lives
      outside this repository and can change without a commit here: pricing, a
      product's availability or tier, external API behavior, a version or
      release date, a rate limit, a cited paper or RFC, a quoted upstream
      policy. A claim about this repository's own code is NOT external; a
      command decides that one.

      **Steps.**

      1. Re-read the proposal and list every external-factual claim it makes,
         including ones in `Why` used as justification. A claim that motivates
         the change is exactly the one worth pinning, because the whole change
         rests on it.
      2. Give each record an id that reads as what it backs, not a number.
         `rfd576-responsibility` tells a reader what the record is for;
         `claim-3` does not, and the id is what the prose cites. Then run
         `citelock capture <url> --id <id> --quote <text> --class <class>`.
         Capture fails closed when the live source does not state the quote.
         That failure is the feature: it means the claim is wrong, the quote is
         paraphrased, or the URL moved. Fix the claim, do not weaken the quote
         until it passes.
      3. Quote the narrowest span that actually carries the claim. A quote wide
         enough to survive any rewording anchors nothing.
      4. Run `citelock verify <change-dir>`. It must exit 0.
      5. If the change genuinely makes no external-factual claim, write the
         template unchanged (`{"records": []}`) and say so in one line in the
         proposal's `Impact`. Do not leave the file absent.

      **The link is bidirectional and both directions are checkable.** Every
      record id MUST be cited at least once as `[cite: <id>]` in a prose
      artifact, and every `[cite: <id>]` MUST name a record that exists. An
      uncited record is either a claim that got edited out, in which case delete
      it, or a claim the prose forgot to anchor. A dangling reference is a claim
      pretending to be pinned, which is worse than an unpinned one.

      **When the change is revised.** A claim added to the proposal later needs
      its own capture; the lock is not generated once and forgotten. Run
      `citelock recheck` when a pinned source may have moved, and re-capture
      what it reports. Never hand-edit `citations.lock` to make the gate pass:
      the snapshot and its sha256 are the evidence, and editing around them
      leaves a lock that verifies and proves nothing.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Background, current state, constraints, stakeholders. **spec-driven rule**: name the existing patterns/files being extended or paralleled. Cite paths. If introducing a new pattern, justify why the closest existing one was insufficient.
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). **spec-driven rule**: Each entry under Decisions MUST list at least one alternative considered and the explicit reason it was rejected, on a line beginning `- Alternative rejected:` so `specutil check` can read it as a stated fact. A decision without a recorded rejected alternative is not a decision; it's an assumption.
      - **Rollout & Gating**: **spec-driven rule**: REQUIRED section. Describe the sequenced rollout — which phase ships first, what gate must pass before the next phase (build green, manual smoke test, user confirmation, etc.), and where the kill switch is if something goes wrong. For dotfiles work, the default gate sequence is: edit → `nix flake check` → `nh os build` (no system change) → user spot-check → `nh os switch`. Deviations from this sequence MUST be called out. Name any feature flag, config toggle, or capability gate that scopes the rollout.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation. Risks that map to human-verification checkpoints in `tasks.md` MUST be flagged here.
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable). **spec-driven rule**: Every step that mutates shared state, is hard to reverse, or requires elevated permissions MUST be preceded by a verification step and followed by a confirmation step. Single-line "run X" entries for impactful actions are insufficient.
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Adversarial review is NOT a section here. It is its own artifact
      (`review.md`), because findings recorded as prose inside a design doc are
      unreadable as a set: nobody can ask "what survived?" of a paragraph. State
      the rubric sources in `Decisions` and `Rollout & Gating`; the review
      artifact cites them.

      **Voice.** Same contract as the proposal, and it binds harder here because
      a design doc is mostly requirements. Load the `writing-doc-design` skill.
      Keep the RFC 2119 declaration block at the top of the template, carry every
      normative statement with a keyword rather than with bold, and write in
      Simplified Technical English. Every external-factual claim carries its
      `[cite: <id>]` reference, same as the proposal.

      Focus on architecture and approach, not line-by-line implementation.
      Reference the proposal for motivation and for the `Behavior` criteria.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - **spec-driven rule**: When the change spans more than one capability, group tasks under explicit phase headings (`## 1. Phase name`, `## 2. Phase name`, ...). Each phase MUST correspond to a coherent phase that could in principle be reviewed or shipped independently.
      - **spec-driven rule — gate on judgment, not on distrust**: A human gate costs a context switch and trains the owner to click through, so it MUST earn its place. Apply this test, from Anthropic's own criterion that automated testing verifies functionality while human review verifies alignment with broader system requirements: gate where the failure mode is "every check passes and the wrong thing was built"; do NOT gate where the failure mode is "the code is broken", because a command already answers that.
        - An action is IMPACTFUL when it is irreversible, outward-facing, or mutates state the owner cannot reconstruct. These MUST carry an owner gate: `nh os switch` / `nh darwin switch`, `git push`, `openspec archive`, schema fork or migration, deletion outside scratch space, network writes, vendored-content updates.
        - An action is NOT impactful merely because it is a write. `git add`, `nix fmt`, and any formatter sweep are deterministic and revertible; gating them is ceremony. State them as ordinary tasks.
        - A precondition a command can decide is NOT a gate. `nix flake check`, `nh os build`, `specutil check`, and `openspec validate` all exit non-zero on their own. Name the command in the Apply task's own line, or let the pre-commit path run it. Do not spend a checkbox asking the owner to confirm a program's exit code.
        - Where a gate IS earned, the structure MUST be:
          - `- [ ] X.N Apply: <impactful action>, gated on <command that must exit 0 first>`
          - `- [ ] X.N+1 Confirm: <the judgment only a human can make, e.g. the owner spot-checks that the captured settings are the ones they meant to keep>`
        - A `Confirm:` task MUST state a judgment, not a re-run of a command. "Confirm the tests pass" is not a gate; "confirm the migrated values are the ones you intended to keep" is.
        - Prefer ONE confirmation per impactful action. A run of consecutive `Confirm:` tasks after a single action is a sign the author is enumerating observations rather than naming a decision.
        - A gate is a boundary between runs, not a pause inside one. If a phase needs owner sign-off partway through, split it into two phases so the boundary is visible and the first half can be re-run on its own.
      - **spec-driven rule — reuse first**: For each task that introduces a new module/file, the description SHOULD reference the existing pattern it follows (cite a file path) or explicitly note this is a new pattern (with justification carried from design.md).
      - **spec-driven rule — review evidence per phase**: Each phase MUST end with an adversarial-review checkbox before its impactful-action or rollout tasks. The checkbox runs the mandatory deterministic `specutil check` lint and appends a round block to `review.md`. Do not restate findings in `tasks.md`: the review artifact holds them, and two copies drift. Model critique itself is gated on the owner's recorded decision in `review.md`, so a phase whose review is still `pending` is not done. `CLEAN` means only that no critic objection survived; it is not owner or peer approval. Human-verification gates for impactful actions still apply.
      - **spec-driven rule — a loop must be able to run twice**: `SHAPE loop` is a claim about control flow, not a label for "several steps". Declare `loop` only when the phase has a real back-edge: the same tasks re-run on the next iteration against changed state. A phase of N distinct one-shot steps is a `graph` with a dependency chain, not a loop. Test before writing `loop`: name the task iteration 2 starts from. If there isn't one, it is not a loop.
      - **spec-driven rule — STOP is a command, not a wish**: A `- **STOP**` value MUST be decidable by running something. Write the command, or write a predicate over a command's output. `- **STOP** \`nix flake check\` exits 0 and every new check fails on an injected defect` is a stop condition. `- **STOP** the settings are coherent` is not, because nothing can evaluate it and the loop terminates when the model decides it is bored. The verifier MUST also be outside the blast radius of the work: a loop that may edit its own tests has no stop condition at all. To make the condition actually run rather than be asserted, arm the Stop hook: `loop-gate arm --until '<command>' --max <n> --stall <n>`. It evaluates the command when the turn tries to end, blocks the end while it fails, and reports CLEAN, CAPPED, or STALLED. `/goal` is NOT a substitute: its own docs state it "doesn't run commands or read files independently", so it terminates on a transcript that claims success.
      - **spec-driven rule — two bounds, not one**: Every `loop` MUST declare both a progress bound and an iteration bound, because they fail differently. `- **STOP**` is the success exit. `- **MAX-ITERS** <n>` is the iteration cap and is the marker `specutil check` currently enforces. `- TERMINAL:` names how the loop ends WITHOUT success, using the terminal-state vocabulary the `adversarial-review` skill already defines: `CAPPED` (MAX-ITERS reached), `STALLED` (N consecutive iterations with no change in the STOP metric), `CHURNING` (each fix induces the next defect). MAX-ITERS alone is insufficient: a loop that stalls burns the whole cap before anyone notices. A cap hit is reported as open work, never as a pass. Cite the skill rather than restating its cap-scaling rule.
      - **spec-driven rule — phase shape**: Each non-Rollout phase MUST declare `- **SHAPE** loop` or `- **SHAPE** graph`; no other value is valid, and a `## <n>. Rollout` phase is exempt. A `loop` MUST also declare `- **STOP**`, `- **MAX-ITERS**`, and `- TERMINAL:` per the two rules above. TERMINAL is deliberately not a bolded marker: the rubric's bolded-lead allowlist does not yet carry it, so bolding it would fail `bolded-bullet-lead`. Promote it to `- **TERMINAL**` once the allowlist is extended. A `graph` models orchestrator-worker fan-out; each subtask MAY carry a trailing `` `deps:` <ids|none> ``, and every referenced id MUST name another subtask in the SAME phase, because a cross-phase edge means the phase boundary is drawn in the wrong place. When you PRESENT a shaped phase to the owner, render it as an inline ASCII diagram via the `diagram-mermaid-render` skill. That rendering is for human understanding and is not checked.
      - **spec-driven rule — pilot before fan-out**: A `graph` phase that fans out to more than five sibling subtasks MUST name a pilot subtask that runs the same work over a strictly smaller input and must complete before the rest. A fan-out that fails at scale costs the whole batch; a pilot costs one item.

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure (follows `modules/home/programs/llm/skills/` layout)
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      - [ ] 2.3 Adversarial review (`adversarial-review` skill): critics attempt to break the export phase against the proposal `Behavior` criteria; revise until the loop reaches a terminal state (see the skill for the scaled round cap)

      ## 3. Rollout

      - [ ] 3.1 Apply: `nh os switch`, gated on `nix flake check` and `nh os build` exiting 0
      - [ ] 3.2 Confirm: the owner spot-checks that the exported columns are the ones they meant to expose
      ```

      Reference the proposal `Behavior` criteria for what needs to be built, design for how to build it.
      Each task should be verifiable — you know when it's done.
    requires:
      - design

  - id: review
    generates: review.md
    description: Adversarial review record - rubric, findings, verdicts, terminal state
    template: review.md
    instruction: |
      Record the adversarial review of the plan as data, not as prose. This is
      the artifact the owner reads to answer "what was challenged, what
      survived, and what is still open".

      Adversarial review used to be a paragraph in `design.md` that told a
      subagent what to do. That is backwards: the instruction was durable and
      the findings were not. Here the findings are the artifact and the
      methodology is cited from the `adversarial-review` skill.

      **Steps.**

      1. Fill in `## Rubric` by naming its sources. Do not restate them. An
         objection that cites no rubric item is out of scope and is discarded.
      2. Run the deterministic lint FIRST and record it: `specutil check` and
         `citelock verify`. It is mandatory, it is cheap, and it runs whatever
         the owner decides below. It is evidence, never approval.
      3. Write `## Recommendation` BEFORE running any critic. Say whether model
         critique should run for this change and name the concrete risk it would
         catch, or say plainly that there is none. Both answers are fine. An
         absent recommendation is not: the owner must be deciding against an
         argument rather than a blank.
      4. STOP and elicit the owner's decision. You MUST NOT write
         `## Owner decision` yourself, and you MUST NOT read silence as consent.
         Skipping adversarial review is the owner's call, not the author's, so
         `NOT-RUN` is not self-certifiable.
      5. If the owner approves running it, execute the bounded loop from the
         `adversarial-review` skill and record every round in the table: lens,
         finding, the concrete failing scenario, and the verdict. A finding with
         no reproducible scenario does not belong in the table; the loop already
         discards it.
      6. Record the terminal state and the surviving-objection trend. `CLEAN`
         means no objection survived. It is not owner approval and it is not
         peer approval. `CAPPED`, `STALLED`, and `CHURNING` all hand back with
         open work, and each MUST list its open objections.

      **Execution path.** Critics are fresh-context {{agents}} spawned with a
      read-only tool set, never in-process teammates. Context starvation is the
      mechanism that makes the review adversarial: a critic that has read the
      author's argument for why the plan is right is measurably worse at finding
      how it is wrong. Use a teammate only when a critic must observe live
      session state that is not on disk, and name that reason in the round
      record. See the skill's execution-path section; do not re-derive it.

      **This artifact is revised, not regenerated.** A later phase that runs its
      own review appends a round block. Rewriting the file loses the trend,
      which is the one thing that distinguishes converging from churning.
    requires:
      - tasks

apply:
  requires: [tasks, review]
  tracks: tasks.md
  instruction: |
    Read the context files, then drive the work from `specutil next` rather than
    from reading `tasks.md` in file order.

    The loop:

    1. Run `specutil next <change>`. It names the active phase, its shape, and
       the subtasks whose dependencies are complete.
    2. Do that ready set. When it reports `runnable concurrently`, MAY fan out
       independent subtasks when the user requested delegation or parallel work
       materially helps. Never delegate a gate or an owner decision.

       Route the fan-out on what the work needs, not on what is available:

       - Implementation subtasks that share this repository and must not
         conflict: teammates. They coordinate, they are long-lived, and they can
         see each other's edits, which is what keeps two of them from writing
         the same file. Give each a disjoint file set and say so in the prompt.
       - Anything adversarial or verifying: fresh-context {{agents}} with a
         read-only tool set. A reviewer that shares the implementer's context
         inherits the implementer's reasoning. Never a teammate.
       - Read-only investigation whose answer you need before deciding:
         fresh-context {{agents}}. Cheaper than a teammate and there is nothing
         to coordinate.

       The distinction is coordination versus starvation. Work that must agree
       wants shared context; work that must disagree must not have it.
    3. Mark each finished subtask `- [x]` in `tasks.md`.
    4. Repeat from 1. An exit code of 2 means the dependencies form a cycle: stop
       and fix `tasks.md`, do not retry.

    Why not read the file top to bottom: `tasks.md` declares a dependency graph
    and a phase shape. Reading in file order ignores both, so the declaration
    becomes decoration and the ordering is whatever the file happens to look like.
    Asking the tool makes the same input always produce the same plan.

    Stop at an owner gate. An `Apply:` task is impactful and a `Confirm:` task is
    a judgment only the owner can make, so neither is yours to check off.

    For a `loop` phase, arm the declared `STOP` with
    `loop-gate arm --until '<command>' --max <n>` before you start iterating, so
    the exit is evaluated rather than asserted. `specutil next` prints the STOP
    verbatim and deliberately does not build the command for you: a stop
    condition often names a file path in backticks, and a guessed command looks
    right and proves nothing.

    Narrate each ready set before you mark it done. Read `git diff` for the files
    you touched and tell the owner, in a few lines:

    - what changed, by file, in behaviour rather than in line counts
    - which `Behavior` criterion from the proposal each edit serves
    - anything in the diff that no criterion asked for, named as such
    - anything a criterion asked for that the diff does not yet do

    The last two are the point. A diff that satisfies every criterion and also
    does something nobody asked for is the failure a passing check cannot see,
    and it is the reason this step is prose rather than a command.

    Keep it short. This is a running account of what is happening, not a summary
    written at the end, so the owner can stop the work at the ready set where it
    went wrong rather than after the phase.

    Do not reach for a diff-summarizing tool here. `meat` is installed and is
    good at shrinking a diff that is too large to read, but it never sees the
    proposal, so it cannot say which criterion an edit serves or which one the
    diff missed. Use it by hand when a diff is too big to read, not as this step.

    Pause if you hit a blocker or need clarification.

    Before handoff, read the complete diff and run the relevant checks. Address
    review feedback with targeted edits. Do not regenerate the whole change,
    because that makes the effect of review feedback impossible to track.
