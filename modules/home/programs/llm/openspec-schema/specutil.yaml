extract:
  preset: spec-driven

  markers:
    - key: merge
      scope: phase
      bullet: MERGE

  fields:
    - key: writes
      scope: task
      label: writes
      type: list

check:
  preset: spec-driven

  rules:
    - id: required-sections
      name: design-sections
      artifact: design
      sections:
        - "## Decisions"
        - "## Rollout & Gating"

    - id: bolded-bullet-lead
      allow:
        - WHEN
        - THEN
        - AND
        - POLARITY
        - SHAPE
        - STOP
        - MAX-ITERS
        - BREAKING
        - MERGE
        - TERMINAL

    - id: phase-marker-conditional
      name: graph-declares-merge
      when:
        marker: shape
        value: graph
      require:
        - merge
      skipPhasePattern: "(?i)rollout"
