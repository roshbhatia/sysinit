# nvfetcher configuration for automated package source updates Run: nix run
# github:berberman/nvfetcher -- -c nvfetcher.toml -o _sources

# Go packages (note: vendorHash must still be updated manually) These use v-prefixed
# tags (e.g.
[go-enum]
src.github = "abice/go-enum"
fetch.github = "abice/go-enum"

[gomvp]
src.github_tag = "abenz1267/gomvp"
fetch.github = "abenz1267/gomvp"

[mermaid-ascii]
src.github_tag = "AlexanderGrooff/mermaid-ascii"
fetch.github = "AlexanderGrooff/mermaid-ascii"

[kubernetes-zeitgeist]
src.github = "kubernetes-sigs/zeitgeist"
fetch.github = "kubernetes-sigs/zeitgeist"

# Python packages (hererocks uses tags without v prefix)
[hererocks]
src.github_tag = "luarocks/hererocks"
fetch.github = "luarocks/hererocks"

# Font packages
[ioskeleyMono]
src.github_tag = "ahatem/IoskeleyMono"
fetch.url = "https://github.com/ahatem/IoskeleyMono/releases/download/$ver/IoskeleyMono-TTF-Hinted.zip"

# Binary release packages - crush (one entry per platform asset) Tags are v0.47.2, strip
# prefix so $ver = 0.47.2 for URL construction
[crush]
src.github = "charmbracelet/crush"
src.prefix = "v"
fetch.url = "https://github.com/charmbracelet/crush/releases/download/v$ver/crush_$ver_Darwin_arm64.tar.gz"

[crush-x86_64-darwin]
src.github = "charmbracelet/crush"
src.prefix = "v"
fetch.url = "https://github.com/charmbracelet/crush/releases/download/v$ver/crush_$ver_Darwin_x86_64.tar.gz"

[crush-aarch64-linux]
src.github = "charmbracelet/crush"
src.prefix = "v"
fetch.url = "https://github.com/charmbracelet/crush/releases/download/v$ver/crush_$ver_Linux_arm64.tar.gz"

[crush-x86_64-linux]
src.github = "charmbracelet/crush"
src.prefix = "v"
fetch.url = "https://github.com/charmbracelet/crush/releases/download/v$ver/crush_$ver_Linux_x86_64.tar.gz"

# Binary release packages - pi-coding-agent (one entry per platform asset)
[pi-coding-agent]
src.github = "earendil-works/pi"
src.prefix = "v"
fetch.url = "https://github.com/earendil-works/pi/releases/download/v$ver/pi-darwin-arm64.tar.gz"

[pi-coding-agent-x86_64-darwin]
src.github = "earendil-works/pi"
src.prefix = "v"
fetch.url = "https://github.com/earendil-works/pi/releases/download/v$ver/pi-darwin-x64.tar.gz"

[pi-coding-agent-aarch64-linux]
src.github = "earendil-works/pi"
src.prefix = "v"
fetch.url = "https://github.com/earendil-works/pi/releases/download/v$ver/pi-linux-arm64.tar.gz"

[pi-coding-agent-x86_64-linux]
src.github = "earendil-works/pi"
src.prefix = "v"
fetch.url = "https://github.com/earendil-works/pi/releases/download/v$ver/pi-linux-x64.tar.gz"

# Binary release packages - atomic-coding-agent (one entry per platform asset)
# Tags carry no `v` prefix, so no src.prefix. `src.github` tracks the latest
# non-prerelease release; atomic publishes an `-alpha.N` prerelease before most
# tags, and following those would move the pin on nearly every push.
# The glibc linux assets are the ones taken, matching pi; `-musl` variants exist
# and are unused.
[atomic-coding-agent]
src.github = "bastani-inc/atomic"
fetch.url = "https://github.com/bastani-inc/atomic/releases/download/$ver/atomic-darwin-arm64.tar.gz"

[atomic-coding-agent-x86_64-darwin]
src.github = "bastani-inc/atomic"
fetch.url = "https://github.com/bastani-inc/atomic/releases/download/$ver/atomic-darwin-x64.tar.gz"

[atomic-coding-agent-aarch64-linux]
src.github = "bastani-inc/atomic"
fetch.url = "https://github.com/bastani-inc/atomic/releases/download/$ver/atomic-linux-arm64.tar.gz"

[atomic-coding-agent-x86_64-linux]
src.github = "bastani-inc/atomic"
fetch.url = "https://github.com/bastani-inc/atomic/releases/download/$ver/atomic-linux-x64.tar.gz"

# prime-agent (PrimeIntellect-ai/prime-agent) is a pi fork, and unlike pi and
# atomic it publishes an npm tarball rather than a per-platform prebuilt binary,
# so there is one entry rather than four. Tags carry a `v` prefix that the asset
# filename does not, hence src.prefix plus the literal `v` in the path.
#
# The tarball is the release-packed one, which renames the package away from pi:
# `name: prime-agent`, `bin: prime-agent`, `piConfig.configDir: .prime/agent`.
# The source tree publishes as `@earendil-works/pi-coding-agent` with bin `pi`,
# which would collide with pi on PATH; the release asset does not.
[prime-agent]
src.github = "PrimeIntellect-ai/prime-agent"
src.prefix = "v"
fetch.url = "https://github.com/PrimeIntellect-ai/prime-agent/releases/download/v$ver/prime-agent-$ver.tgz"

# amp-cli tracks amp's own release channel rather than a git tag: amp is closed
# source, so `https://static.ampcode.com/cli/cli-version.txt` is the only place
# upstream states which build is current. It is the same file nixpkgs' own
# `amp-cli/update.sh` reads, so this pin and nixpkgs' pin follow one oracle and
# only the update cadence differs. The npm `@sourcegraph/amp` dist-tag carries
# the same version and would work too; the static channel is one indirection
# fewer.
#
# Three platforms, matching nixpkgs. Upstream also publishes `amp-darwin-x64.gz`
# and a non-baseline `amp-linux-x64.gz`, and nixpkgs' derivation has no
# x86_64-darwin entry to hand a source to, so adding either is a platform
# change rather than a version bump.
[amp-cli]
src.webpage = "https://static.ampcode.com/cli/cli-version.txt"
src.regex = '0\.0\.[0-9]+-g[0-9a-f]+'
fetch.url = "https://static.ampcode.com/cli/$ver/amp-darwin-arm64.gz"

[amp-cli-aarch64-linux]
src.webpage = "https://static.ampcode.com/cli/cli-version.txt"
src.regex = '0\.0\.[0-9]+-g[0-9a-f]+'
fetch.url = "https://static.ampcode.com/cli/$ver/amp-linux-arm64.gz"

[amp-cli-x86_64-linux]
src.webpage = "https://static.ampcode.com/cli/cli-version.txt"
src.regex = '0\.0\.[0-9]+-g[0-9a-f]+'
fetch.url = "https://static.ampcode.com/cli/$ver/amp-linux-x64-baseline.gz"

