[project]
name = "sysinit-python-tools"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["basic-memory==0.23.2", "acp-amp==0.1.3", "sg-mcp"]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
pybars3 = ["setuptools"]
pymeta3 = ["setuptools"]
sg-mcp = ["setuptools"]

[tool.uv.sources]
sg-mcp = { git = "https://github.com/ast-grep/ast-grep-mcp", rev = "149e20d47bb7125fb0c1451feea2f48a98742034" }
