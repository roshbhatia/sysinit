<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <!-- Shadow -->
  <ellipse cx="90" cy="196" rx="50" ry="5" fill="rgba(0,0,0,0.10)"/>

  <!-- Body — wide teardrop blends into head (tubular mole silhouette) -->
  <ellipse cx="90" cy="132" rx="47" ry="48" fill="#2D1E12"/>

  <!-- Head — smaller, heavily overlaps body top for one teardrop shape -->
  <ellipse cx="90" cy="95" rx="37" ry="27" fill="#2D1E12"/>

  <!-- Eyes — tiny, inward, beside snout base (moles barely see) -->
  <circle cx="80" cy="86" r="3.5" fill="#0D0600"/>
  <circle cx="100" cy="86" r="3.5" fill="#0D0600"/>
  <circle cx="81.3" cy="84.7" r="1.3" fill="rgba(255,255,255,0.65)"/>
  <circle cx="101.3" cy="84.7" r="1.3" fill="rgba(255,255,255,0.65)"/>

  <!-- Snout — protrudes clearly below chin (head bottom ≈ y=122) -->
  <ellipse cx="90" cy="114" rx="25" ry="20" fill="#4A2E1C"/>
  <ellipse cx="90" cy="122" rx="17" ry="14" fill="#7B4A30"/>
  <ellipse cx="90" cy="128" rx="12" ry="10" fill="#C2715A"/>
  <ellipse cx="90" cy="133" rx="8" ry="7" fill="#E8907A"/>
  <!-- Nostrils -->
  <ellipse cx="86.5" cy="131" rx="2.5" ry="2" fill="#8B3040"/>
  <ellipse cx="93.5" cy="131" rx="2.5" ry="2" fill="#8B3040"/>

  <!-- Spec scroll — presented in front of body -->
  <rect x="44" y="145" width="92" height="42" rx="5" fill="#F5F0E0"/>
  <!-- Rolled ends of scroll -->
  <ellipse cx="44" cy="166" rx="6.5" ry="21" fill="#E6DCC6"/>
  <ellipse cx="136" cy="166" rx="6.5" ry="21" fill="#E6DCC6"/>
  <!-- Scroll border -->
  <rect x="44" y="145" width="92" height="42" rx="5" fill="none" stroke="#C8B890" stroke-width="1.5"/>
  <!-- Lines of specs on scroll -->
  <line x1="55" y1="155" x2="125" y2="155" stroke="#A89070" stroke-width="1.5"/>
  <line x1="55" y1="162" x2="119" y2="162" stroke="#A89070" stroke-width="1.5"/>
  <line x1="55" y1="169" x2="122" y2="169" stroke="#A89070" stroke-width="1.5"/>
  <line x1="55" y1="176" x2="116" y2="176" stroke="#A89070" stroke-width="1.5"/>

  <!-- LEFT digging paw — large spade, planted below scroll -->
  <ellipse cx="33" cy="170" rx="27" ry="14" fill="#22160C" transform="rotate(-18 33 170)"/>
  <!-- Left claws — point DOWNWARD (digging) -->
  <ellipse cx="15" cy="183" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(42 15 183)"/>
  <ellipse cx="24" cy="188" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(20 24 188)"/>
  <ellipse cx="33" cy="190" rx="5.5" ry="3.5" fill="#180E07"/>
  <ellipse cx="42" cy="188" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(-20 42 188)"/>
  <ellipse cx="50" cy="183" rx="5"   ry="3.5" fill="#180E07" transform="rotate(-40 50 183)"/>

  <!-- RIGHT digging paw — symmetric, large -->
  <ellipse cx="147" cy="170" rx="27" ry="14" fill="#22160C" transform="rotate(18 147 170)"/>
  <!-- Right claws — point DOWNWARD -->
  <ellipse cx="130" cy="183" rx="5"   ry="3.5" fill="#180E07" transform="rotate(-42 130 183)"/>
  <ellipse cx="138" cy="188" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(-20 138 188)"/>
  <ellipse cx="147" cy="190" rx="5.5" ry="3.5" fill="#180E07"/>
  <ellipse cx="156" cy="188" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(20 156 188)"/>
  <ellipse cx="165" cy="183" rx="5.5" ry="3.5" fill="#180E07" transform="rotate(42 165 183)"/>
</svg>
